<style>
  :root {
    --ink: #1c2430;
    --ink-soft: #4a5568;
    --paper: #fbfaf7;
    --line: #dcd8cf;
    --accent: #b5622f;
    --accent-soft: #f1e3d8;
    --ok: #2f6b4f;
    --ok-soft: #e2ede6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.55;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 18px 20px 0;
  }
  h1 {
    font-size: 19px;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 10px 16px;
    cursor: pointer;
    border: none;
    background: none;
    font-size: 14.5px;
    color: var(--ink-soft);
    border-bottom: 2px solid transparent;
    font-weight: 500;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  main { max-width: 820px; margin: 0 auto; padding: 24px 20px 80px; }
  .crumb { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; }
  .crumb button {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 13px; padding: 0; text-decoration: underline;
  }
  .section-title { font-size: 15px; font-weight: 600; margin: 28px 0 10px; }
  .section-title:first-child { margin-top: 0; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .num-badge {
    font-variant-numeric: tabular-nums;
    font-size: 13px; color: var(--ink-soft);
    width: 26px; flex-shrink: 0;
  }
  .play-btn {
    border: 1px solid var(--line); background: white;
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; font-size: 13px;
  }
  .play-btn:hover { border-color: var(--accent); color: var(--accent); }
  select {
    flex: 1; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: white; font-size: 14px; color: var(--ink);
  }
  .badge {
    font-size: 11.5px; padding: 3px 8px; border-radius: 20px;
    white-space: nowrap; flex-shrink: 0;
  }
  .badge.suggest { background: var(--accent-soft); color: var(--accent); }
  .badge.done { background: var(--ok-soft); color: var(--ok); }
  .badge.empty { background: #eee; color: #888; }
  .progress-bar {
    height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 8px 0 20px;
  }
  .progress-fill { height: 100%; background: var(--accent); }
  .topic-card {
    display: block; width: 100%; text-align: left;
    border: 1px solid var(--line); background: white; border-radius: 8px;
    padding: 14px 16px; margin-bottom: 8px; cursor: pointer; font-size: 14.5px;
  }
  .topic-card:hover { border-color: var(--accent); }
  .topic-card .tc-count { color: var(--ink-soft); font-size: 12.5px; margin-top: 2px; }
  .q-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .q-chip {
    border: 1px solid var(--line); background: white; border-radius: 6px;
    padding: 8px 14px; cursor: pointer; font-size: 14px;
  }
  .q-chip.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .player-box {
    background: white; border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; margin-bottom: 20px;
  }
  audio { width: 100%; }
  .script-card {
    border: 1px solid var(--line); background: white; border-radius: 8px;
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
  }
  .script-card.picked { border-color: var(--ok); background: var(--ok-soft); }
  .script-card .sc-label { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .script-card pre {
    white-space: pre-wrap; font-family: inherit; margin: 0; font-size: 14px; line-height: 1.6;
  }
  .empty-note { color: var(--ink-soft); font-size: 14px; padding: 20px 0; }
  .hint { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .backup-row { display: flex; gap: 16px; padding: 8px 0 14px; }
  .backup-row button {
    background: none; border: none; color: var(--ink-soft); cursor: pointer;
    font-size: 12.5px; padding: 0; text-decoration: underline;
  }
  .backup-row button:hover { color: var(--accent); }
</style>

<script>
const DATA = {"general_topics": [{"key": "자기소개", "label_ko": "자기소개", "label_en": "Self Introduction", "scripts": [{"slide": 10, "text": "Let’s start the interview now. Tell me something about yourself.\n\n1.인사말\n\n2.이름/나이\n\n3.결혼 여부/가족\n\n4.현재 신분 (전공/하는 일)\n\n5.취미/여가 활동\n\n6.성격/장단점\n\n7.마무리"}], "aliases": []}, {"key": "furniture", "label_ko": "가구", "label_en": "furniture", "scripts": [{"slide": 34, "text": "My home 가구 많음.\n방마다 있는 가구들 나열.\n그 중에 최애 가구 =  Bed\n이유와 침대에 대한 상세설명\n침대에 대한 루틴\n\n마무리\n\n집에 있는 가구 또는 가장 좋아하는 가구 묘사 (int)\nTell me about the furniture you have in your home.\nIs there a piece that is your favorite?\n\n: There are many types of furniture in my (apartment.)\n\nIn the living room, there is a couch (sofa), a tv and a tea table.\n\nIn my bed room, I have a computer, a desk, a chair and a bed.\n\nMy favorite piece of furniture is my bed\nbecause I love to relax on my bed.\nMy bed is very comfortable and cozy.\nSo it makes me get a good night’s sleep.\nHaving a good sleep is very important to me.\nSo I love my bed.\nThere is a warm blanket and a big one pillow on the bed.\n\nI always make my bed when I wake up in the morning.\nI like to keep my bed nice and clean.\n\nSo, this is a my favorite funiture."}, {"slide": 35, "text": "거실에 있는 소파.\n소파에 대한 설명\n어떨때 쓰는지 사용법 (티비 볼때, 낮잠 잘때)\n\n내 방에 있는 침대.\n침대에 대한 설명.\n어떨때 쓰는지 설명법 ( 잠잘때, 핸드폰 할때, 책 읽을 때)\n\n마무리\n\n평소에 가구들을 어떻게 사용하는지 설명 (int)\nTell me about how you use your furniture on a typical day.\nWhat kind of things do you do with your furniture?\n\n: I have a couch (sofa) in the living room.\nIt is a gray couch and it is made of leather.\nThere are cushions on it.\nI usually sit on the sofa/ when I am watching TV.\nI sometimes lie down on it and take a nap.\n\nAlso, I have a big closet in my room, which I use to store my clothes.\nThere is a section where(which)/ I hang my shirts, vests, and cardigans.\nThere is another section where/ I hang my suits, winter coats and jackets.\nThere are also drawers where/ I keep(store) my sweaters, t-shirts and jeans.\nI always try to keep my clothes well-organized.\n\nSo this is how/ I use my furniture on a typical day.\n\n*That’s (pretty much) about it."}, {"slide": 36, "text": "잘 기억 안나지만, 유추해보자면 작았던 것 같아.\n예를 들면, 과거는~ 지금은~\n그리고 과거는 ~ 지금은~\n\n마무리\n어렸을 때 가구와 지금 가구 비교 (adv)\nTell me about the furniture that you had in your childhood home.\nWas there anything different from the furniture that you have today?\nDescribe for me what your home looked like at that time.\n\n: Actually, I don’t remember the (furniture) from my childhood.\nBecause it was a long time ago, so my memory is unclear.\n\nBut, I guess the furniture (I used when I was a kid/from my childhood) was a lot smaller. For example, my bed was a single bed for children.\nBut now, I use a queen-sized bed for adults.\n\nAnd I think the color of the furniture used to be brighter.\nFor example, my desk was white when I was a kid (young), but I use a brown desk.\n\nSo, I guess the size and color of the furniture are the biggest differences.\nThat is all I remember."}, {"slide": 37, "text": "특정 가구에 생긴 문제 및 해결 방법 묘사 * (adv)\nSometimes, problems arise when it comes to furniture. Things might break, the fabric might get stained or ripped. Tell me about a time when you had a problem with a piece of furniture. Tell me everything that happened and how you fixed the problem.\n\n: In the past, I had several problems with my furniture .\n\nOnce, I remember when the leg of my desk broke.\nIt was hard to fix it, so I had to throw it away.\nI eventually got a new one.\n\nAlso, I remember when my sofa got a stain.\nI spilled something on it by mistake.\nI try to wipe it off, but it left a stain.\nSo l had to clean it off with a stain remover.\n\nSo, these were the problems I have had with my furniture.\n몇 년 전에 문제가 있었지.\n한번은 책상이 손상 > 못고침 > 버림. > 새로 구입\n한번은 침대가 스크래치 > 보기 안좋아보여 > 시트 입힘\n\n마무리"}], "aliases": ["Furniture"]}, {"key": "housing", "label_ko": "집", "label_en": "housing", "scripts": [{"slide": 42, "text": "House\nApartment\nStudio\nAt home\nSpacious\nClean my home\nVacuum and mop the floors\nDust the furniture\nDo the laundry\nWash my clothes\nThe whites/the colors\nDetergent\nFabric softener\nHang-dry\nLaundry rack\nDo the dishes/ dish rack\nTake out the trash(garbage)/ take out the recycling and the food waste\nKick back and relax\nGet some rest/ sleep/ exercise/fresh air"}, {"slide": 43, "text": "Renovate/renovation\nRedo-redid\nRearrange the furniture\nLooked brand new\nHave a family gathering at home\nInvited some relatives over\nOrdered in some food from a delivery restaurant\nSat down and had dinner together\nLeftovers\nHelp set up the table\nHelp clean up\nbreak/ break down/ broke down\nTake it in for repairs\nWent out\nReplace the batteries\nReplaced the old one with a new one\nBreak into several pieces\nClean up the glass"}, {"slide": 44, "text": "본인이 살고 있는 집 : 현재시제 (int)\nI would like to now talk about where you live.\nCan you describe your home to me?\nWhat does it look like?\nHow many rooms does it have?\nGive me a description with lots of details.\n\n: I live in an apartment with my family.\nThere are three bedrooms, two bathrooms and two balconies in my apartment.\nThere is also a living room, a kitchen, a utility room and a storage.\n\nIn the living room, there are many furniture and home appliances.\nThere is a sofa, a tea table, and a display case.\nThere is also a television, an air-conditioner and an air-purifier.\n\nIn the bathroom, there is a toilet, a shower booth, a bathtub and some cabinets.\nThere are some towels, some soap, some shampoo and some conditioner.\n\nThe living room is right next to the kitchen.\nIn the Kitchen, there is a sink, a dish rack and a dining table.\nAlso there is a fridge, a microwave, a stove and a water cooler.\nWhat else? There is also a rice cooker, a toaster, a blender and a coffee machine.\nThere are also dishes such as plates, bowls and cups in the kitchen cabinets.\n\nSo, this is what my place is like. \n(*These are all I can say about my place/home)\n\n### Notes:"}, {"slide": 45, "text": "본인이 가장 좋아하는 방 묘사 - 본인 방 중심묘사, 가장 좋아하는 가구 (int)\nI would like to now talk about where you live.\nTell me about your favorite room in your home.\nWhat does it look like?\n\n: My favorite room at home is my bedroom.\nI like my room because it is the best place to get some rest.\n\nI can do almost everything in my room.\nI sometimes get some sleep, surf the internet, watch TV or listen to music.\nI also read books, watch movies or play games.\n\nIn my bed room, I have a bed, a nightstand, a closet and a dressing table.\nI have used them for a long time.\nI also have TV, an AC and a display case.\n\nMy favorite furniture is my bed because I love to relax on my bed.\nMy bed is very comfy and cozy.\nSo it helps me get quality sleep.\nHaving a good sleep is very important for me.\n\nSo, this is why I like my bedroom the most."}, {"slide": 46, "text": "본인의 집에서 주중/주말 일과 묘사 – 집안일/재활용 (int)\nWhat is your normal routine at home?\nWhat do you usually do during the weekdays?\nWhat kinds of things do you do on the weekends?\n\n본인이 집에서 하는 집안 일 묘사 – 집안일/ 재활용 (int)\nTell me what you do to keep your house clean and comfortable.\nWhat kinds of housework do you do around your home?\n\n: I have to do a lot of housework at home.\nIt is one of my daily routines.\n\nOn weekdays, I clean my home whenever I can.\nFirst, I open all the windows to air out the apartment.\nAnd then, I vacuum and mop the floors and I dust the furniture.\nI sometimes clean the bathroom after I take showers.\nI do the dishes almost everyday.\nAlso, I take out the garbage at least once a week.\nI take out the recycling and the food waste.\n\nOn weekends, I gather my clothes and do the laundry.\nDoing laundry takes a long time for me, so I do the laundry on weekends.\n\nSo, this is what I do at home."}, {"slide": 47, "text": "어렸을 때 살았던 집과 지금 집 비교 (adv)\n어렸을 때 살았던 집과 동네 묘사 (adv)\nDescribe the home you lived in as a child.\nHow was that home different from the home you live in now?\n\n: I remember living in a house/ when I was a kid.\nThere was a playground in front of my house.\nI played there all the time with my friends.\nI have many enjoyable memories of that place.\n\nBut now, I live in a more spacious apartment.\n1) There is a park nearby where I can get some exercise.\nI sometimes play sports with my family there.\n2) There are many stores and facilities near my home.\n3) There is a bus stop, a subway station, a train station, and a taxi stand.\n4) There is also a bank, a hair salon, a gym, a fitness center and a dry cleaner’s.\n5) There are also some restaurants, coffee shops and bars.\n6) There is also a grocery store that I go to often.\n\nSo, this is what my neighborhood is like."}, {"slide": 48, "text": "집에 준 변화 중 하나 자세히 묘사 (adv)\nSometimes we want to change something in our home, maybe get new furniture or do some painting or decorating.\nTell me about one change that you made in your home.\nTell me why you decide to make that change and everything you had to do to make that change happen.\n\n: I have renovated my home a few times over the years.\nOnce I redid the wallpaper because it was getting old.\nI also redid the floors, the windows, the curtains and the blinds.\nAfter the renovation, my home looked brand new.\nIt was worth the money and time. *\n\nAlso, I remember getting some new home appliances.\nI got a new TV and a new AC for the living room.\nI also bought a new toaster and a new coffee machine.\nI can make coffee very easily with the coffee machine.\nI think it is a must-have item.\n\nSo, these were the changes I remember.\n\nrearrange : 재배열(배치)하다"}, {"slide": 49, "text": "본인 집에 생겼던 여러 문제점들 묘사 (adv)\nThere are always problems which happen in any home.\nThings break, projects do not go as planned, or people you live with don’t cooperate.\nTell me about some problems or issues that have happened in your home.\n\n: I remember when my TV at home broke down.\nIt was very frustrating because I could not watch my favorite TV show.\nSo, I had to call up a person to fix it.\n\nI also remember when my computer broke down.\nSo, I went to the service center to get it fixed.\n\nAnd I remember when the lightbulbs in the bathroom went out.\nI had to get a new bulb and replace it.\n\nI also remember when the alarm clock did not work in the morning, so I was late for my work. I replaced the batteries and since then I use my mobile phone as an alarm.\n\nThese are the problems I had at home."}, {"slide": 50, "text": "본인 집에 생겼던 여러 문제점 중 한 가지 구체적 설명 및 대처 방법 (adv) * -가구\nPick one of those problems you just mentioned and explained to me everything that happened. Start with when it happened and anything that may have caused the problem. Then, explain in detail everything you did to resolve the problem.\n\n: As I mentioned, I had some problems with my furniture.\n\nOnce, I remember when my chair got damaged.\nOne of the legs broke and fell off.\nIt was hard to fix it, so I had to throw it away, and got a new one.\n\nAlso, I remember when my desk got scratched.\nIt did not look good, so I covered it up.\n\nI also remember when my bed got a stain.\nI spilled something on it by mistake.\nI wiped it off as soon as I could, but it left a stain.\nI had to wash the blanket and the pillow.\n\nSo, these were the problems I had."}, {"slide": 51, "text": "본인 집에 생겼던 여러 문제점 중 한 가지 구체적 설명 및 대처 방법 (adv) * -컵\nPick one of those problems you just mentioned and explained to me everything that happened. Start with when it happened and anything that may have caused the problem. Then, explain in detail everything you did to resolve the problem.\n\n: As I mentioned, I remember breaking a cup at home.\n\nI dropped the cup by mistake it was slippery.\nI lost my grip.\n\nThe cup broke into several pieces and I had to clean up the glass.\nI picked up the big pieces and vacuumed the small pieces.\n\nI tried to be careful, but I cut my finger on a piece of glass.\nIt was bleeding and it was a little sore.\nI disinfected the cut and put a band-aid on it.\n\nSince then, I try to be more careful."}, {"slide": 52, "text": "집에 생기는 문제를 부모님과 본인이 해결하는 방법의 차이 묘사\n- 본인 집에 생겼던 여러 문제점들 묘사 (adv)\nI’d like to now talk about where you live.\nCompare how you solve problems in your home to how your parents or friends solve problems that occur in their homes. How is it same? How is it different?\n\n: Frankly, my parents and I do not solve problems at home differently.\n\nFirst, we deal with the small problems ourselves.\nFor example, I remember breaking a glass at home.\nThe glass broke into several pieces and I had to clean up the glass.\nI picked up the big pieces and vacuumed the small pieces.\nNext, I remember when one of the lightbulbs in the bathroom went out.\nSo, I had to get a new bulb, and replace the old one with the new one.\n\nWhat else? I remember when the clock in my room did not work well.\nSo, I had to replace the batteries for the clock and it worked again.\n\nOn the other hand, when there are bigger problems at home, we get help from professionals.\nFor instance, I remember when the washer broke down at my place.\nIt was frustrating because I could not do the laundry.\nI could not fix the problems myself, so I called up a person to fix it.\n\nOnce again, we do not solve problems at home that differently."}, {"slide": 53, "text": "5~10년간 우리나라 주택들의 변화 추세 설명\nI’d like to now talk about where you live.\nHow has the style of homes changed over the past 5 or 10 years at where you live? Are the homes being built today different from the homes built 10 years ago?\nWhat developments or changes have you noticed?\n\n: Homes have changed a lot over the last 5 to 10 years.\n\nFor starters, apartment (buildings) have become a lot taller than in the past.\nOld apartments were not that tall. However, newly-built apartments nowadays typically have more than 30 floors. As people live in taller buildings, they have a better view from their homes.\n\nThese new buildings also have more parking spaces. That's because many households have more than one car now. These parking lots are always built underground these days.\n\nPlus, apartments have become much prettier over the years.\nOld apartments used to look rather simple. New apartments these days look very modern and well-designed. Some look very sophisticated and luxurious.\n\nAlso, new apartment complexes have become more eco friendly.\nSome of them look like parks, as they have a trees, flowers, benches and fountains.\n\nSo, I think homes have become a lot better than in the past.\nThey have come a long way."}, {"slide": 54, "text": "새로운 가전/전자제품들이 가사노동에 가져온 변화묘사\nI’d like to now talk about where you live.\nMany homes today are equipped with new appliances or electronic devices that make everyday life more convenient. What are some of these new home appliances or electronic devices? How have they changed household responsibilities?\n\n: Home appliances have made our lives a lot easier than in the past.\nThey have made a world of difference in our lives.\n\nFirst, one of the most important appliances is the fridge. It keeps food cold and prevents it from going bad. Storing food has become a lot easier thanks to the fridge.\nNext, the microwave is another useful appliance. We can heat things up very easily with the microwave.\nIt takes much less time and effort to cook things.\n\nPlus the coffee machine is a great appliance as well. We can make coffee very easily with the coffee machine. It is a must-have item for coffee lovers.\nAlso, the dishwasher is also very useful. It does the dishes automatically and we do not have to do the dishes ourselves. We can save time and energy and we can also save water as well.\n\nNext, the washer and dryer are essential appliances as well. First, we throw in the laundry, and then, the detergent in the washer. And then, it does the laundry automatically, all by itself. With a dryer, we do not need to hang-dry clothes on a laundry rack. We can save space and it is much easier to dry the clothes.\n\nNext the air-fryer is a new appliance that is gaining a lot of popularity. It fries food with hot air and does not use oil in the frying process. The food comes out very crispy and crunchy. It is quite amazing! It is very useful when you warm up leftover chicken or pizza.\nThese are the new appliances or electronic devices that make everyday life more convenient in our homes."}, {"slide": 55, "text": "생활에 유용한 특정 가전/전자제품 세부 묘사\nThink about a specific modern appliance or device that people consider as useful or convenient at home. What do people say about this home appliance or device?\n\n가전제품이 우리 삶에 가져온 변화 묘사\nHow have home appliances changed our lives?\nHow was life before the appliances different from life now?\nWhat is the biggest change on our lives?\n\n: I think vacuum cleaners are one of the most useful home appliances.\nBack in the day, we used to sweep the floors with a broom.\nIt took a long time to clean the floors.\nBut now we use vacuum cleaners to clean the floors.\nThey suck up the dust very easily and cleaning the floors is a breeze now.\nWe just need to change the dust bag in the vacuum from time to time.\nThere are wireless vacuum cleaners these days. They are more convenient because you do not have to plug them in. There are no wires, so they do not get tangled up.\nEven better, there are now robotic vacuum cleaners that clean the floors themselves.\nFrankly, the first-generation models were not that good. They did not do a good job.\nHowever, the new models are much better than in the earlier ones. They are really high-tech and have definitely come a long way. They can be controlled by an application and you can get status updates. They even come back to the charger by themselves. Some models even have a mop pads on them as well. They sweep the dust and mop the floors at the same time.\nSo vacuum cleaners have changed the way we clean the floors.\nCleaning our homes has become a lot easier than in the past."}, {"slide": 56, "text": "집을 구할 때 사람들이 겪는 문제 묘사 #14\nWhat are some major problems most people who rent a home or an apartment have? How do people deal with these issues?\nHow do these things affect how or where people live?\n\n우리나라 주택시장 문제 관련 뉴스 설명 #15\nSometimes the issues of too many new homes or not enough new homes can create a controversy in a community. Think of a time when the issue regarding housing was in the news in your area.\nWhat was the issue and why were people talking about it?\n\n: I remember watching the news about the housing market in Korea.\nIt was about rising housing prices, which have skyrocketed over the years.\nBecause of the price hike, rent prices have also risen a lot.\n\nDue to this trend, people have a lot of trouble finding a home.\nThey are also having a hard time paying the rent.\nSome people even get a loan to pay the rent.\nOther people move to different areas to find cheaper housing.\n\nMeanwhile, the government is doing what it can curb housing prices.\nIt is raising taxes on homeowners who have more than one home.\nIt is also making it more difficult to get mortgages.\nIt is also building more apartments by developing new residential cities.\nPlus, It is imposing price caps and re-sale restrictions on newly-built apartments.\n\nHowever, these housing policies are not always that effective.\nIn fact, they sometimes backfire and prices go up again.\n\nSo, one of the biggest problems in the housing market is high prices.\n\n### Notes:"}, {"slide": 57, "text": "집을 구할 때 사람들이 겪는 문제 묘사 #14 - NEW\nWhat are some major problems most people who rent a home or an apartment have? How do people deal with these issues?\nHow do these things affect how or where people live?\n\n우리나라 주택시장 문제 관련 뉴스 설명 #15 - NEW\nSometimes the issues of too many new homes or not enough new homes can create a controversy in a community. Think of a time when the issue regarding housing was in the news in your area.\nWhat was the issue and why were people talking about it?\n\n: News about the housing market is in the news all the time.\nHousing prices in Korea have skyrocketed over the years.\nBecause of the price hike, rent prices also rose a lot.\nAs a result, people had a hard time paying the rent.\nMany people had to get a loan from the bank to pay their rents.\nOther people had to move to different areas to find cheaper housing.\nAs a result, many families with young children had trouble finding a home.\nThis become more and more of a big issue in Korea.\n\nHowever, all of this started to change from late 2022.\nInflation was at record-high levels due to external factors like the war in Ukraine.\nCentral banks around the world started to raise interest rates.\nEventually, the global economy took a downturn and things are not looking good.\nThis had a huge impact on the housing market in Korea.\nVery few people wanted to buy houses, so housing prices started to drop sharply.\nThe government intervened and tried to stabilize the market, but it was no use.\nMany housing policies were not that effective and some even backfired.\nSo, this problem in the housing market is an ongoing issue we have to resolve.\n\n### Notes:"}], "aliases": ["Housing"]}, {"key": "recycling", "label_ko": "재활용", "label_en": "recycling", "scripts": [{"slide": 61, "text": "우리나라의 재활용 현황 묘사 (int)\nI’d like to know about how recycling is practiced in your country.\nWhat do people specifically do?\nTell me how things are recycled.\n\n: Garbage is a big problem in every country.\nIt causes environment pollution and destroys nature.\n\nAmong them, plastic takes a long time to decompose in nature.\nRecycling is the best way to deal with plastic waste.\nIt is eco-friendly because we can reuse our resources.\n\nKorea is a good example when it comes to recycling.\nRecycling is well-practiced at people’s homes.\nIt has become a daily routine in people’s lives.\n\nSo, Koreans practice recycling quite well."}, {"slide": 62, "text": "본인이 재활용하는 물건들 묘사 (int)\nRecycling is a common practice.\nTell me about all the different kinds of things that you recycle.\n\n본인이 집에서 재활용하는 방법 묘사 (int)\nHow do you recycle in your home?\nWhat are the things that you recycle?\n\n: I have two types of trash cans at home.\nOne is for regular garbage, and the other one is for the recyclables.\n\nI gather plastics, bottles, cans, paper and glass there.\nI clean the bottles and cans with water before I throw them away.\nAnd then, I take them out separately.\nI do that at *least once or twice a week.\n\nI often do that after work/ or on my way out.\nThere is a designated area for the recycling. \nIt is next to the dumpster for regular garbage.\n\nSo, this is the way/ I recycle at home."}, {"slide": 63, "text": "재활용 수거 방법 과거와 현재 변화 서술(adv) #14\nThe handling of recycling materials has changed over the years. Tell me how the collection of recycling materials used to be in the past. And how has it evolved to the present?\n재활용에 대한 사람들의 인식 과거 현재 변화 서술 (adv) #14\nDescribe what the attitude was toward recycling when you were a child. Did people recycle then? Did they throw everything out in the garbage? What were people’s views on recycling at that time and how have they changed over the years?\n어렸을 때 했던 재활용 방법 묘사 (adv)\nTell me about recycling when you were a child. Did your family recycle?\nWas there a particular place to which you brought the recyclables? Were there any special containers? Describe what it was like in detail.\n\n: Back in the day, people did not think recycling was important.\nThey do not recycle at home because there was no recycling policy.\nPeople just took out the recyclables with the other garbage.\n\nHowever, I remember recycling being practiced at schools.\nWe separated the recyclables from the non-recyclables.\nWe sometimes took scrap paper to school for collection.\nI remember doing that when I was a kid.\nBut these days, people's view have changed a lot. They are more conscious about environmental issues. They think recycling is very important for the environment.\n\nSo, recycling is well practiced at people's homes.\nIt has become a part of our daily lives."}, {"slide": 64, "text": "OPIc(63w)\n재활용 관련된 기억에 남는 에피소드 설명 (adv)\nCan you tell me about a story or an experience you had related to recycling? Maybe something went wrong with recycling, or you might have had a discussion with a friend who disagrees with recycling. Describe your experience in detail.\n\n재활용 관련된 문제가 발생했던 경험 설명 (adv)\nProblem sometimes occur while recycling.\nPerhaps, the pick-up service did not come as planned.\nOr, the items were too big for the containers.\nOr, the container turned over and spilled the items.\nTell me about something memorable that happened to you or your family.\n\n: I remember taking out the recycling a few days ago.\n\nHowever, some leftover milk got on my hands.\nMy hands became sticky and dirty.\nAnd they smelled really bad.\nBut I didn’t have any tissues with me.\nSo, I had to go to the bathroom and wash my hands.\n\nSince then, I try to be more careful/ when I take out the recycling."}, {"slide": 65, "text": "재활용 혹은 환경에 대해 본 뉴스 보도 서술 (adv)\nWhat are some of the stories in the news with respect to recycling or the environment today? Describe what the current news reports are saying about the recycling or the environment.\n\n: Well, I can’t think of anything that happened recently, but I remember a big incident that occurred 4 years ago.\nI remember watching the news about a recycling problem that happened in 2018.\nChina used to import recyclables from other countries.\nHowever, it stopped doing that from 2018 due to environmental reasons.\nAs a result, Korea had no place to export its recyclables.\nThere was too much supply, and the price for recyclables dropped sharply.\n\nEventually, recycling companies stopped collecting scrap plastic because they could not make any profits.\nScrap plastic started to pile up at people's homes.\nIt was a serious problem.\n\nIn the end, local governments had to intervene.\nThey started to pay subsidies to recycling companies.\nAnd they started to collect scrap plastic again.\n\nSo, this was the incident I remember about recycling."}, {"slide": 66, "text": "재활용 혹은 환경에 대해 본 뉴스 보도 서술 (adv) - NEW\nWhat are some of the stories in the news with respect to recycling or the environment today? Describe what the current news reports are saying about the recycling or the environment.\n\n: Well, I can’t think of anything related to recycling.\nBut I know one thing for sure! There is a lot more trash than before.\nSo, we have to practice recycling a lot better.\nPeople order food delivery or shop online very often because of quarantine and social distancing measures.\nAs a result, there has been a spike in the use of plastics and disposable containers used for delivery and packaging.\nA staggering amount of trash is being created as a result.\n\nAlso, wearing a mask has become a way of life for all people.\nMost masks are single-use, so a huge amount is being thrown away as trash.\n\nSo, we need to try to reduce the amount of plastic we use in our daily lives. When ordering in, both vendors and consumers must try to cut down on the use of disposable items. We should also raise the recycling rate by properly sorting out the trash.\nThat will help us reduce trash and reuse our resources."}], "aliases": ["Recycling"]}, {"key": "music", "label_ko": "음악", "label_en": "music", "scripts": [{"slide": 72, "text": "Listen to music\nHave some music on/ turn on some music\nSinger/ artist/ musician\nMelody/ lyrics\nReleased new singles\nHit No.1 on the music charts\nCatchy/ got goosebumps/ overwhelming\nTrendy / were screaming/ were singing along to the songs\nSensational / the venue / was packed with people / sold out/\nIncredible singer/ amazing dancer\nGood-looking/ talented/ unique voice / my taste for music\nWas really into a group / over and over again\nHad fans in all age groups / could not get enough of their music\n\n### Notes:"}, {"slide": 73, "text": "본인이 좋아하는 음악 장르, 가수 묘사(int)\nYou indicated in the survey that you listen to music.\nWho are some of your favorite musicians and /or composers?\n\n: I think I listen to all kinds of music.\n\nMy favorite Korean musician is TaeYeon of Girl’s Generation.\nShe is a member of the famous girl group in Korea.\nShe is a good singer and she has a sweet voice.\nSo I love her.\nAnd One of my favorite musicians is Alec Benjanmin.\nHe is a American singer.\nHe usually sings song that he has composed himself.\nHe is not famous yet, But I think that he will be a famous singer in the world someday.\nI love his voice and lyrics in his songs.\n\nSo, they are the singers I like the most."}, {"slide": 74, "text": "다른 종류의 2가지 음악 비교\n- 본인이 좋아하는 음악 장르, 가수 묘사(int)\nYou indicated in the survey that you listen to music.\nPick two different kinds of music or composers. Describe each in as much detail as possible and then compare the similarities and differences between them.\n\n: Well, frankly, I do not have a particular type of music that I can call my favorite. I listen to a lot of pop music, but I also listen to dance music as well. I do listen to hip-hop or rock n’ roll occasionally, but not very often. The only types of music I do not like are perhaps Jazz, heavy metal, country or classical music. One of my favorite singers is a British singer called Anne Marie. She is one of the most well-known musicians in the world. She does a lot of R&B and pop. She is also one of the best-selling artists of all time. She also won many music awards.\nShe has tons of hit songs and among them, 2002 is my favorite. I really like the melody and the lyrics of the song. In fact, most of her songs are fast and upbeat. They are very inspirational. I think her music is very catchy and trendy. I think she is an incredible singer and amazing dancer. She also has a very nice and unique voice. Meanwhile, I also like a Korean boy band called BTS. I am sure you have heard of them. BTS is now one of the biggest groups in the world. They are creating a sensation these days. They have fans all around the world, who called themselves Army. BTS released a new single this year called butter and it was a huge hit. I really liked it myself, I think it was a great song. I listened to it over and over again. In fact, it hit No.1 on the billboard chart and it stayed there for seven weeks. It was the 4th time that BTS has topped that chart. Thanks to their recent success, BTS is leading the K-pop boom around the world. They have become an icon of a Korean pop music and pop culture. When they have live concerts, the tickets quickly get sold out. Of course, they make the crowd go crazy at these concerts. There are seven members in the group and are all very good-looking. I think they are very talented as they write their own songs. Their dance routines are very well organized and cool to look at.\nPersonally, I think the popularity of BTS will go on for quite some time."}, {"slide": 75, "text": "다른 종류의 2가지 음악 비교\n- 본인이 좋아하는 음악 장르, 가수 묘사(int)\nYou indicated in the survey that you listen to music.\nPick two different kinds of music or composers. Describe each in as much detail as possible and then compare the similarities and differences between them.\n\n: Well, frankly, I usually listen to all kinds of music such as hip-hop, jazz , balad, and dance music.\nSo, I like almost musicians.\nHowever, Among them, My favorite musicians are Taeyeon and Alec Benjamin.\nFirst, Taeyeon is a famous singer in Korea. She is a member of Girl’s Generations.\nI think she has a sweet voice and suits well with ballads.\nI love her voice.\n\nSecond, One of my favorite musicians is Alec Benjanmin.\nHe is a American singer.\nHe usually sings song that he has composed himself.\nHe is not famous yet, But I think that he will be a famous singer in the world someday.\nI love his voice and lyrics in his songs.\n\nSo, they are the singers I like the most."}, {"slide": 76, "text": "본인이 음악을 듣는 장소, 시간 묘사 (int) *\nWhen and where do you usually go to listen to music?\nDo you listen to radio? Do you go to concerts?\nTell me about the different ways you enjoy music.\n\n: I usually listen to music on my cell phone. I a\nI always carry around my phone, so I can listen to music whenever and wherever I want.\n\nI think I listen to music most often when I am on the move.\nFor example, I listen to music on the subway or the bus.\nI also listen to music in the car when I am driving.\nI listen to music when I am walking down the street.\n\nI listen to music when I am working out, because I can focus on my workout.\nI also listen to music when I am working or studying,\nbecause I can concentrate on what I am doing.\nI listen to music when I am doing housework.\nI also listen to music before I go to sleep.\n\nI have some music on when I feel down or gloomy.\nI turn some music on when I am bored.\n\nSo, I listen to music whenever and wherever I want to."}, {"slide": 77, "text": "본인이 음악을 처음 좋아하게 된 계기, 취향변화 (adv)\nWhen did you first become interested in music?\nWhat kinds of music did you like first?\nTell me how your interest in music developed from your childhood until today.\n\n: I first became interested in music when I was a kid.\nI was really into a Korean group called (ABC.)\nThey were sensational at that time. They also had a lot of fans.\n\nTheir new singles always hit No.1 on the music charts.\nI was hooked on some of their songs.\nSo I used to listen to their songs over and over again.\nThey were great singers (and dancers.)\nThey were also very good looking and talented.\nMost of their songs were very catchy and trendy.\n\nBut now, my taste for music changed.\nI began to listen to music by various artists.\nI sometimes listen to rock, but I sometimes listen to hip-hop as well.\nI also listen to Korean music, but I also listen to foreign music.\n\nSo, I guess I now listen to various types of music."}, {"slide": 78, "text": "본인이 라이브 음악 들었던 경험 묘사 (adv) (4-4)\nCould you think back to a particularly memorable time when you heard live music? Describe that experience in detail. When was it? Where were you? Who were you with? Who did you hear? What happened that made that performance so memorable?\n\n: I remember going to a concert a few years ago.\nIt was a music festival, and I went there with my friends.\nThe concert was held on an outdoor stage.\nThere were so many people at the concert.\n\nThe mood of the concert was amazing.\nThe fans were screaming and were singing along to the songs.\nThere were some songs that struck a chord with me.\nI even got goose bumps because it was so overwhelming.\nI really liked it when they were playing songs that I knew.\nThere were also special effects, which were spectacular.\n\nLooking back, It was a memorable concert.\nAnd it was worth the money and time."}, {"slide": 79, "text": "요즘 관심을 끄는 새로운 음악 기기/ 설비 묘사\n- Mobile phone, streaming sites, Bluetooth functions\nWhat new electronics gadgets or equipment are people who like music interested in these days? What are they talking about? What new products excite them and why?\n\n: Most people listen to music on their cell phones, laptops or Tablet PCs. These  devices are always connected to the internet. So, people use streaming sites to listen to music these days. These streaming services are very convenient in many ways. They have thousands of songs and it is very easy to search for music.\nThe best thing about them is that people can make their own playlist. Also, these services recommend similar songs on the playlist. People can also see the lyrics or information about the song on the screen. They can also listen to the same song over and over again. Plus, the sound quality has become much better than in the past. Meanwhile, cell phones and computers have Bluetooth functions. So, you can connect them to various types of devices such as Bluetooth earphones or speakers. These device have become the norm and they are all the rage these days. They are very convenient because you do not have to plug them in. There are no wires, so they do not get tangled up. Personally, I use Bluetooth earphones quiet often myself when I listen to music. My friends gave me Airpods for my birthday and I have been using them ever since. I also use my earphones when I talk on the phone. I also have Bluetooth speakers at home. My audio in my car is also Bluetooth. Once again, the latest trend is Bluetooth devices when it comes to music."}], "aliases": ["Music"]}, {"key": "movie", "label_ko": "영화", "label_en": "movie", "scripts": [{"slide": 86, "text": "Movie star\nMovie theater\nThe movie starred +배우\nThe movie was directed by + 감독\nAction movies\nSci-fi movies\nHorror movies\nRomantic comedies\nAnimations\nSuperhero movies\nKorean movies/Hollywood movies\nA popular form of entertainment\n\nStoryline\nTwist\nActing\nChemistry among the actors\nVery fun to watch\nEntertaining"}, {"slide": 87, "text": "Many scenes I could related to\nMany funny lines\nCracked up many times\nOriginal\nWell-made\n\nDo very well at the box office\nA huge box-office hit\nA killer movie\nHit the all- time record\nNewly-released movie\nAre being released overseas\nAre winning awards at big films festivals\n\nMade history\nWon the academy award for best picture\nWon the Oscars for the best director ad best original screenplay\n\nGot a lot of spotlight from the media"}, {"slide": 88, "text": "본인이 가장 좋아하는 영화 장르 묘사 (int) * (5-1)\nYou indicated in the survey that you go to movies with adults.\nTell me about the kinds of movies that you like to see.\n영화 작품들의 과거와 현재 변화 설명 #14\nYou indicated in the survey that you like to go to movies with adults.\nCould you compare the movies made today to movies you saw while growing up? how have movies changed? What are the differences and similarities?\n\n: When I was a young, I sometimes used to watch Hollywood movies.\nThat’s because Korean movies were not that fun and They were a little boring in the past.\n\nBut now, I enjoy watching Korean movies because they have become a lot better.\nThey have come a long way and they are all the rage these days. .\n\n((some Korean movies are being released overseas. ))\nSome movies are winning awards at Big film festivals.\nIn fact, the Korean movie “Parasite” won 4 awards in 2020.\n((It was the first time that / a Korean movie had won an Academy Awards.))\n\nSo, the movie industry is growing very fast in Korea.\nThe Korean movie market is the one of the largest markets in the world.\n\nAuctually, I think Korean movies have become much better than in the past.\n\n===================================================\n(Some Korean movies are winning many awards at Big film festivals, such as Oscars, Academy Awards, Cannes Film Festival and the Golden Globe Awards.)"}, {"slide": 89, "text": "본인이 영화를 누구와 보러 가고, 전후로 하는 일들 묘사 (int) -현재시제\nTell me what you usually do when you go to see movies.\nWho do you like to go with?\nWhat do you do before and after the movie?\n\n: I usually go to movies with my friends or family.\nI sometimes go by myself, but not very often.\n\nMany movie theaters are at the shopping malls.\nSo, before watching the movie, we sometimes do some shopping.\nWe buy some clothes, shoes or cosmetics.\nAnd also we get some coffee at the coffee shop.\n\nRight before the movie, we sometimes get some snacks.\nWe get some popcorn and soft drinks at the snack shop.\n\nAfter watching the movie, we often go to a Chinese restaurant.\nThere are many great Chinese food such as 짜장면, 탕수육 and 마라탕 .\nAfter enjoying the meal, we sometimes go to a coffee shop to get some coffee.\n\nSo, these are the things I do before and after watching a movie.\n \n(that’s that’s pretty much about it)"}, {"slide": 90, "text": "최근 영화관에 가서 본인이 영화 전후로 했던 일들 묘사 (adv) -과거시제\nI would like to know about the last time you went to the movies.\nTell me everything that happened that day.\nIncluding all the things you did before and after the movie.\n\n: I remember going to a movie last week.\nI went to a theater with my friends in the downtown area.\nBefore watching the movie, we did some shopping at some stores.\nWe bought clothes, shoes and some comestics.\nWe also had some coffee at a coffee shop.\n\nAfter watching the movie, we went to a Chinese restaurant.\nThe food was so tasty because I was so starving. \nAnd the 마라탕 was so fresh and delicious.\nWe also ordered the various side dishes.\nPlus, we grabbed some drinks while having the meal.\nAnd I look forward to going there again.\n\nLooking back, it was a very happy day."}, {"slide": 91, "text": "최근 영화관에 가서 본인이 영화 전후로 했던 일들 묘사 (adv) – * 과거시제 (코로나 버전)\nI would like to know about the last time you went to the movies.\nTell me everything that happened that day.\nIncluding all the things you did before and after the movie.\n\n: Actually, I have not been to a movie recently because of the coronavirus.\nAs you know, It is not safe to go to crowded places like movie theaters.\nSo, not many people go to watch movies these days. In fact, people are trying to minimize person to person contact. People were told to avoid crowded places such as bars, clubs and karaokes. In fact, businesses were forced to shut down when the number of new cases spiked.\n\nNext, many companies made their staff work from home.\nWork meetings took place through video conferences, using programs like zoom.\nThis changed the work environment fundamentally.\n\nAlso, schools had to make necessary changes as well.\nIn-school classes were postponed or had to be stopped sometimes, and students had to take remote video classes from home.\nPlus, more people are shopping online more often for even things like groceries.\nMost importantly, people were  asked to clean their hands well as often as they could.\nHand sanitizers were set up in almost all places, including elevators.\nPlus, everyone was told to wear masks in public and practice social distancing.\n\nIn the end, the coronavirus changed out lives drastically and some changes will never come back to normal."}, {"slide": 92, "text": "본인이 기억에 남는 영화 묘사, 재미있었던 이유 설명 (adv) *\nWhat was a memorable movie you watched in the past?\nWhat was it about? What was special about that movie?\nWould you recommend that movie to other people?\n\n본인이 가장 좋아하는 영화배우에 관한 최근 본 뉴스 설명 (adv) *\nWho is one of your favorite actors? Tell me a specific story about something that actor did that you heard about in the news.\nBegin the story with some details about the actor or the actress and then tell me all the details of what happened. Especially things that made this incident so interesting to movie fans.\n\n:  I remember watching the Hollywood movie, Guardians of the Galaxy in 2023.\nThe movie has a story that heroes save the universe in space adventure.\n\n1) Personally, I really liked the storyline of the movie.\n2) There were some delightful music and fantastic space.\n3) I think the movie was well made.\n4) I also liked the acting and the chemistry among the actors.\n\nActually, This movie was a big-hit in many countries.\nLooking back, it was one of the most memorable movies in my life.\nAnd it was worth the money and time.\n\n=====================================================\n\n5) There were also many funny lines and I cracked up many times.\n6) So I think the movie was fun and it was a killer movie.\n\nActually, the movie was a box-office hit in many countries.\nAs I mentioned, Parasite made history by winning four Oscars and\nI remember watching the news on TV about my favorite movie star 송강호, who played in the movie.\n\nTouched/ impressed"}, {"slide": 93, "text": "친구들과 이야기하는 영화 관련 토픽 설명\n- 본인이 기억에 남는 영화 묘사, 재미있었던 이유 설명 (adv) *\n- 본인이 가장 좋아하는 영화배우에 관한 최근 본 뉴스 설명 (adv) *\nWhen you talk to your friends or family about movies, what topics or issues regarding movies do you discuss? Why are these issues of interest or concern to your friends? What makes them so important?\n\n: My friend and I sometimes talk about Hollywood movies.\nIn fact, I remember talking about the Hollywood movie, Guardians of galaxy last year.\nThe movie has a story that heroes save the universe in space adventure.\n\nIn fact, the move have a big-hit in mant countries .\nI remember watching the news on TV.\n\nPersonally, I really liked the storyline of the movie.\nAnd I really liked the visual effects in space.\nI also liked the acting and the chemistry among the actors.\nThere were also many funny lines and I cracked up many times.\nI think it was a killer movie.\n\n===========================================\nOverall, the movie was very fun to watch and entertaining."}, {"slide": 94, "text": "친구들과 이야기하는 영화 관련 토픽 설명 (NEW)\n- 본인이 기억에 남는 영화 묘사, 재미있었던 이유 설명 (adv) *\n- 본인이 가장 좋아하는 영화배우에 관한 최근 본 뉴스 설명 (adv) *\nWhen you talk to your friends or family about movies, what topics or issues regarding movies do you discuss? Why are these issues of interest or concern to your friends? What makes them so important?\n\n: Well, when I talk to my friends about movies.\nWe talk about streaming services a lot.\nHonestly, although I like movies very much.\nI have not been going to theaters as much as I used to.\nI think it was partly due to the coronavirus.\nAs you know, it was not safe to go to crowded places like movie theaters when COVID was at its peak.\nInstead, I think I watch a lot of movies and TV programs at home now.\nThe rise of streaming services such as Netflix has triggered this change.\nMost of people around me use at least one of these services.\nThe best thing about them is that you can watch movies very easily, with a simple click. You can\nwatch them on your TV, laptop, cell phones, or tablets. So, you can watch them wherever you are, even when you are on the move.\n\nPlus, the movie industry is growing very fast in Korea.\nMany Korean movies have become mainstream on the global stage these days.\nSo, watching movies is one of the most popular forms of entertainment in this country."}], "aliases": ["Movie"]}, {"key": "TV", "label_k ually do when you watch TV shows or movies. When do you watch it? Who do you watch it with? Where do you watch it?\nTell me about your typical routine when you what TV shows or movies.\n\n: I think I usually watch TV with my friends.\nI like to watch news programs, comedy shows or pet shows.\nPlus, I always watch TV on my cell phone.\nSince I always carry around my phone, I can watch TV wherever I am.\nI think I watch TV most often when I am on the move.\nFor example, I watch TV on the subway or the bus.\n\nAlso, I tuen the TV on when I am bored.\nMeanwhile, I also watch shows on YouTube.\nMy favorite channel is a Pet Channel because dogs and cats are very cute and lovely.\nSo, this is when and where I watch TV."}, {"slide": 107, "text": "지난 10년간 사람들의 TV시청 방식의 변화 #14 -\nAudio or visual technology has changed over time.\nNow, people use big screens and tablets at home to enjoy visual content. Can you tell me about some different ways people watch TV programs? How has it changed over the last 10 years?\nTell me about your typical routine when you what TV shows or movies.\n본인이 TV 또는 영화에 처음 관심을 갖게 된 계기, 취향 변화\nTell me how you first became interested in watching TV or movies, and how that interest has changed or developed from when you first became interested until today.\n\n: In the past, people (I) used to watch TV at home.\nBut these days, people (I) also can watch TV wherever they are.\nBecause They (I) always carry around their phones.\nI think people watch them usually when they are on the move.\nFor example, they watch video clips on the subway or the bus.\nAlso, they watch them when they are bored or do not have anything else to do.\n\nthe most common video sharing service people use is YouTube.\nAs you know, it is a platform service where people share visual contents.\nThere are so many visual contents there.\nSo, we can watch the contents video that they are interested in.\nPlus, some people have memberships on OTT services such as Netflix or Disney plus, Coupang play.\nThey watch various types of TV shows or movies using those services.\n\nSo, the way people(I) watch visual content has become more conveinet than in the past.\n\n====================================================================\nSo, the way people(I) watch visual content has changed a lot over the last 10 years. (over the years)"}, {"slide": 108, "text": "본인이 좋아하는 TV혹은 영화 캐릭터 설명 -\nPick your favorite TV or movie character and tell me all the things that character does in the show or movie.\n\n: My favorite movie character is Groot in Guardians of the Galaxy.\nHe is so small tree-like creature but he has a significant presence.\nAlso, he has a unique ability to regrow himself.\nSo, using this, he can protect his friends in the movie.\n\nWell, he always say “I’m Groot”.\nAnd he like to dance with delightful music.\n\nSo, When you watch the movie, you can see dancing Groot with music.\n\nSo, I love Groot for his adorable personality.\nSo, this is my favorite movie character."}, {"slide": 109, "text": "본인이 TV 또는 영화에 처음 관심을 갖게 된 계기, 취향 변화\nTell me how you first became interested in watching TV or movies, and how that interest has changed or developed from when you first became interested until today.\n\n: I first became interested in TV programs when I was a kid.\nI was really into cartoons for children.\n\nI watched my favorite cartoons every day.\nI was very excited whenever I watched them.\n\nBut I have become grown up, my favorite TV programs changed.\nI began to watch many kinds of TV shows such as drama, SF movie.\nAnd My favorite channel is a Pet gromming Channel, because dogs and cats are my adorable and so cute\n\nSo, I guess I now watch various types of TV shows."}, {"slide": 110, "text": "영상 콘텐츠에 적용되는 최신 기술 설명, 영상 시청 관련 새로운 트랜드, 시청자들에게 관심을 끄는 이유 -\nTV 방송 프로그램 과거와 현재 비교\nNew technology is being applied to visual content these days.\nHow is new technology being applied?\nWhat are some trends these days related to this technology?\nAnd what do people think about it?\n\n: visual content have changed a lot over the years.\nBack in the day, they used to be old-fashioned.\nPlus, there were not many channels, so there were not that many choices.\n\nBut now, TV programs have become much better.\nThey are very fun to watch and entertaining.\n\nCurrent trends include the rise of short-form content on platforms like YouTube and Instagram, catering to shorter attention spans\n\nPlus, there are now many more TV stations.\nThere are many channels thanks to cable networks and satellite TV.\nViewers can get hundreds of channels, so there are a lot of options to choose from.\n\nMeanwhile, video sharing services are all the rage these days.\nThey have become the norm and more people watch them instead of TV now.\nAmong them, YouTube and Tik Tok video clips are the most popular. People subscribe to channels to channels they like. Some YouTubers are big stars, and they are called influencers. Plus, many people subscribe to OTT services like Netflix or Disney plus.\nThey watch all sorts of TV shows or movies on those platforms.\nSo, visual content has become a lot better than in the past.\nThey have come a long way and there are many more platforms to watch them on.\n\n### Notes:"}, {"slide": 111, "text": "TV 방송 프로그램 과거와 현재 비교\nTV shows have definitely changed over time.\nDescribe for me a TV show that you remember from your childhood.\nWhat was the show like?\nHow was it different from the TV shows that are popular today?\n\n: I think TV programs have changed a lot.\nBack in the day, they used to be old-fashioned, and I think they were a bit boring.\nPlus, there were not many channels, so there were not many choices.\n\nBut now, TV programs have become much better.\nThey are very fun and addictive.\nAnd there are so many channels now thanks to cable and satellite TV.\nViewers can get more than a 100 channels so they can enjoy many kinds of TV programs.\n\nWe can also use the VOD service whenever we want to.\nMeanwhile, YouTube video clips are all the rage these days.\nThey also watch TV shows on Netflix.\n\nSo, TV shows have become a lot better than in the past and they have come a long way."}, {"slide": 112, "text": "본인이 기억에 남는 영화 묘사, 재미있었던 이유 설명 (adv) *\nWhat was a memorable movie you watched in the past?\nWhat was it about? What was special about that movie?\nWould you recommend that movie to other people?\n\n본인이 가장 좋아하는 영화배우에 관한 최근 본 뉴스 설명 (adv) *\nWho is one of your favorite actors? Tell me a specific story about something that actor did that you heard about in the news.\nBegin the story with some details about the actor or the actress and then tell me all the details of what happened. Especially things that made this incident so interesting to movie fans.\n\n:  I remember watching the Hollywood movie, Guardians of the Galaxy in 2023.\nThe movie has a story that heroes save the universe in space adventure.\n\n1) Personally, I really liked the storyline of the movie.\n2) There were some delightful music and fantastic space.\n3) I think the movie was well made.\n4) I also liked the acting and the chemistry among the actors.\n\nActually, This movie was a big-hit in many countries.\nLooking back, it was one of the most memorable movies in my life.\nAnd it was worth the money and time.\n\n=====================================================\n\n5) There were also many funny lines and I cracked up many times.\n6) So I think the movie was fun and it was a killer movie.\n\nActually, the movie was a box-office hit in many countries.\nAs I mentioned, Parasite made history by winning four Oscars and\nI remember watching the news on TV about my favorite movie star 송강호, who played in the movie.\n\nTouched/ impressed"}, {"slide": 113, "text": "본인이 특별히 기억에 남는 TV방송이나 영화에 대해 설명 (adv) -\nCan you tell me about a TV show or a movie that was particularly memorable?\nWhat was it and who was in it?\nWhere did the action take place?\nWhat happened and what was it so memorable for you?\nGive me the details starting from the beginning to the end.\n\n:  I remember watching the Korean movie, Parasite in 2020.\nIt was a movie dealing with issues of a social class.\n\n1) Personally, I really liked the storyline of the movie.\n2) There were some big twists at the end.\n3) I think the movie was very original and was well made.\n4) I also liked the acting and the chemistry among the actors.\n5) There were also many funny lines and I cracked up many times.\n6) So I think the movie was fun and it was a killer movie.\n\nActually, the movie was a box-office hit in many countries.\nAs I mentioned, Parasite made history by winning four Oscars and\nI remember watching the news on TV about my favorite movie star 송강호, who played in the movie.\n\nLooking back, it was one of the most memorable movies in my life.\nAnd it was worth the money and time."}, {"slide": 114, "text": "본인이 특별히 기억에 남는 TV방송이나 영화에 대해 설명 (adv) - NEW\nCan you tell me about a TV show or a movie that was particularly memorable?\nWhat was it and who was in it?\nWhere did the action take place?\nWhat happened and what was it so memorable for you?\nGive me the details starting from the beginning to the end.\n\n:  Korean TV dramas have gained a lot of popularity in Asian markets over the years.\nMillions of viewers in China, Japan and Southeast Asia are watching Korean TV shows.\n\nHowever, Korean dramas recently hit another landmark with the success of the Netflix mega hit TV show, Squid Game. The show created a huge sensation around the world.\nIt became the streaming service’s most popular original program ever.\nThe show is about people competing with one another in some deadly survival games.\nThere are six rounds in the game and only one survivor becomes the winner.\nThere are some gruesome scenes, but the storyline is very original well-made.\n\nPersonally, I liked it very much myself.\nIn fact, I binge-watched all 9 episodes in a couple of days.\nIt was entertaining and I liked the message the show was conveying through the various games the people had to play. Plus, watching the various characters, who all have different backgrounds, was another interesting aspect of the show.\nIf fact, Squid Game rewrote TV history this year by winning six Emmy Awards.\nLead Actor 이정재 won the outstanding Lead Actor in a Drama Series, and the Outstanding Directing for a Drama Series went to 황동혁.\nThis was the first time for a non-English drama series to win Emmy awards.\nThe next season of the series is in the making, so many fans are waiting for its release."}], "aliases": ["TV"]}, {"key": "Domestic trips", "label_ko": "국내여행", "label_en": "Domestic trips", "scripts": [{"slide": 118, "text": "본인이 좋아하는 국내여행 장소들 묘사 (int) *\nYou indicated in the survey that you take vacations domestically.\nTell me some of the places you like to travel and why you like going there.\n\n: When I take vacations domestically, I go to beaches from time to time.\nGeographically, Korea is a peninsula.\nIn other words, it faces the ocean on three sides: the west, the east and the south.\nSo, there are many beaches in our country and I have been to several of them.\n\nAmong them, one of my favorite beaches is /on the east coast of Korea. \nIt is one of the most well-known beaches in our country.\nAnd it is also a popular vacation spot /during the summer.\nIt gets crowded/ during the peak season.\n\nThere are tons of things to do/ near the beach.\nAnd there are a lot of hotels/ where people can stay at.\nThere are also various kinds of bars and cafes.\n\nPlus, there are a lot of places where you can get street food.\nThere are also many restaurants that serve fresh seafood.\nSome places serve fish or shrimp. Others serve crab, shellfish, octopus or squid.\n\nSo, I once again, I go to beaches for my vacations whenever I have the chance."}, {"slide": 119, "text": "본인이 여행 가기 전에 하는 준비 설명 (int)\nCan you tell me all the things you do in order to prepare to take trips?\n\n: When I prepare to take trips, I do a lot of things.\nI do a lot of searches regarding my travel destination.\n\nAnd when I find a good place to stay and to play and to eat.\nI begin to make reservations.\n\nFirstly, I make reservations for my hotel.\nI compare prices of hotel rooms and choose a place to stay.\n\nSecondly, I looking for a delicious restaurant and coffee shop.\nSo I also make a reservation for there.\n\nLastly, after I check weather on trip days, I pack suitable clothes for the weather.\nI make sure to pack my swimsuit, sunglasses, comfortable shoes and a jacket.\nI also pack some t-shirts, shorts, underwear, pajamas and a baseball cap.\n\nNext, I pack my toiletries and cosmetics in my pouch.\nI pack my toothbrush, toothpaste, some lotions, sunblock and shampoo.\n\nPlus, I make sure to pack some emergency medicine or a first-aid kit.\nBecause it is hard to buy (get) some medicine at the vacation spots.\nOther than that, I also pack my bags for my trip.\n\nSo, these are the things I do before take trips."}, {"slide": 120, "text": "본인이 어렸을 때 갔었던 여행들 설명 *(adv)\nTell me about some of the trips that you took in your youth. Where did you go?\nWho did you go with? And what did you see or do during those early trips?\n\n: I remember going to the beach quite often with my family when I was a kid.\nWe used to stay at beachside hotels that had a nice ocean view.\n\nDuring the day, we swam in the ocean with my sister.\nWe also bulit a sandcastle nearby coastline.\nPlus, we caught some crabs on the beach.\n\nFor lunch, we used to go out and have some fast food such as burgers, pizza or pasta.\nI remember that these were so delicious.\n\nAnd for dinner, we often went to market to buy seafood.\nSo, We had seafood such as octopus, squid, crab and fish.\nThe food always tasted extra good because I was starving.\n\nLooking back, these trip are so memorable trip in my life."}, {"slide": 121, "text": "여행 중에 있었던 잊을 수 없는 에피소드 설명 (배탈) * adv\nTraveling can lead to many kinds of interesting, funny and unexpected experiences. Tell me about one travel experience you had that was unforgettable. Start by telling me when this happened, where you were, and who you were with. Then, tell me about all the things that happened that made this experience so unforgettable.\n\n: I remember/ when I had a bad stomachache (during a trip.)\nI think I ate too fast because I was so starving.\nI feel pretty bad.\n\nMy stomach was upset, and I felt like throwing up.\nI also had a fever and felt light-headed.\nI tried to find some medicine but could not find anything.\n\nSo, I went to the drug store to get some medicine.\nI told the pharmacist about my symptoms.\nSo, He gave me something that would make me feel better.\n\nI came back to the hotel and took some medicine to get better.\nI had to stay inside and get plenty of rest.\nSince then, I try to be more careful/ when I eat something."}, {"slide": 122, "text": "지난 5년간 여행이 더 어려워진 이유 설명\nYou indicated in the survey that you take vacations domestically.\nMost people say that traveling has become more difficult in the past 5 years.\nTell me what types changes you have observed when traveling and how these changes affected the traveler or traveler experience.\n\n: Frankly, there is no reason to believe that traveling has become more difficult over the last 5 years. I think it is the complete opposite. In fact, travelling has become a lot easier than in the past. That’s because transportation has become convenient than in the past.\n\nFor example, in the past, it was difficult to make a reservation for trains or airplane.\nBut now, they have become easier than in the past.\nWe can make a reservation on the internet whenever we want.\nIt takes half the time to get somewhere now.\n\nPlus, in the past, plane ticket used to be very pricey. But now, they have become much cheaper thanks to low-cost carrier.\nSome flights only cost half the price. Of course, plane tickets are quite expensive these days due to high oil prices and high demand after the COVID-19 pandemic.\nHowever, I expect ticket prices to fall once low-cost carriers start flying again.\n\nAnd, back in the day, we used to use paper maps when we go on trips.\nThese days, traveling has become much easier because we now have GPS.\nThe GPS tells us where to go, so we do not get lost that often."}, {"slide": 123, "text": "여행 관련 사람들이 갖고 있는 걱정 설명\nWhen people talk about traveling, what are the main issues or concerns they typically raise or discuss? What has caused these concerns?\nWhat is being done to address these concerns for the future?\n\n: Well, one of the biggest concerns when it comes to trips is safety.\nOver the last three years, it has not been safe to go on trips due to the Coronavirus. We were more likely to come into contact with people when we travel. So, chances were that we could get infected by covid-19 more easily.\nThe virus was highly contagious and new variants were even more transmissible. Overall, there have been over 550 million confirmed cases worldwide.\nUnder the circumstances, traveling overseas used to be close to Impossible. Many nations closed off their borders to foreigners and most of them had very strict  restrictions for travelers. And even if you did go somewhere overseas, you had to be under quarantine upon arrival and when you got back. This was a major hurdle for overseas travel. So, not many were going overseas unless it was absolutely necessary.\nHowever, things are slowly changing. As the pandemic is moving into an endemic phase, many countries have lifted restrictions and quarantine rules. People have been waiting for this moment for so long. Already, travel agencies are getting busier as more and more people are resuming international travel. Personally, I look forward to my first trip overseas since pandemic. I can’t wait to get on a plane to go on a nice summer vacation to a tropical island."}], "aliases": ["Domestic trips"]}, {"key": "Overseas trip", "label_ko": "해외여행", "label_en": "Overseas trip", "scripts": [{"slide": 133, "text": "본인이 가본 해외 국가나 도시, 현지인 묘사 * (int)\nYou indicated in the survey that you take vacations internationally.\nCan you describe for me one of the countries or cities you’ve visited?\nWhat does it look like? And what are the people like there?\n\n: I remember/ going to Thailand a few years ago.\nI went there with my family.\n\nThailand is one of our neighboring countries.\nIt is only a short flight from Korea.\nThailand has a diverse geography because it has many mountains, beaches and rivers.\n\nFirst, there are many rivers that flow through large cities.\nThe rivers provide water for these cities.\n\nAlso, there are many mountains in Thailand.\nThe mountains create a pretty landscape.\n\nPlus, there are tons of beaches in Thailand.\nSome beaches are popular vacation spots.\n\nPeople can enjoy various types of seafood in Thailand.\nI think Thai people are quite friendly in general.\n\nThat is the impression I got."}, {"slide": 134, "text": "본인이 해외여행지에 가서 주로 하는 일들 묘사 (int)\nCan you tell me about the things you like to do when visiting another country?\n\n: I like to do a lot of sightseeing when I travel overseas.\nI often visit tourist attractions or landmarks in the country.\nI take a lot of pictures while I look around these places.\nAnd I sometimes post them up online.\n\nI also go to decent restaurants to enjoy the local food.\nI do online searches to find the best restaurants.\nThere are a lot of postings online for good places.\nSometimes, I ask my friends for recommendations.\n\nPlus, I do a lot of shopping at local markets.\nI also go to duty free shops to get gifts or some souvenirs.\n\nSo, this is what I do when I take trips overseas."}, {"slide": 135, "text": "본인이 처음으로 가본 해외 국가나 도시 묘사 (adv)\nDescribe for me your first trip to another country or city. When was the trip? Where did you go? Who did you go with and what did you do?\nDescribe that experience for me in as much detail as possible.\n\n본인이 어렸을 때 가보았던 해외 국가 묘사 (adv)\nThink about another country that you visited when you were young. Describe what that country was like with lots of details. What were your impressions of that place?\n\n: I remember going on a trip to (Indonesia) when I was a kid.\nI went there with my family.\nIt was my first trip overseas.\nAnd I still remember when I first got on the plane.\nI was scared at first, but soon I felt excited.\n\nWhen we arrived, we first went to the hotel to check in.\nWe got our room keys and headed to our room.\nWhen we got to our room, we first looked around.\nAfter that, we unpacked our bags.\n\nAnd then, we went on a tour and visited some famous places.\nI had a lot of fun and I was very amused.\nWe enjoyed every minute of our stay.\nI went to some local restaurants.\nThe local dish tasted very good.\n\nLooking back, It was a memorable trip."}, {"slide": 136, "text": "우리나라 관광객들이 주로 가는 해외 국가 묘사 (int)\nTell me about a popular place tourists like to go to when traveling outside your country.\nWhy do they like visiting those locations?\n\n우리나라 사람들이 주로 가는 해외 국가 묘사 (int)\nWhere do people in your country go to when they travel abroad? Why do they like visiting those locations? What is special about the countries they visit?\n\n: Koreans often go to Thailand when they travel overseas.\n\nThailand is one of our neighboring countries.\nIt is only a short flight from Korea.\n\nThailand has a diverse geography because it has many mountains, beaches and rivers.\n\nFirst, there are many rivers that flow through large cities.\nThe rivers provide water for these cities.\n\nAlso, there are many mountains in Thailand.\nThe mountains create a pretty landscape.\n\nThere are tons of beaches in Thailand.\nSome beaches are popular vacation spots.\nPeople can enjoy various types of seafood in Thailand.\n\nKoreans often go to Thailand when they take trips overseas."}, {"slide": 137, "text": "해외여행 중에 겪은 잊을 수 없는 에피소드 설명 (배탈)\nTell me a specific story about a time when you or someone you know travelled outside your country. Perhaps, something happened that was funny, interesting, frightening, etc. Tell me the story of what happened from beginning to end.\n\n: I remember/ when I had a bad stomachache (during a trip.)\nI think I ate too fast because I was so hungry.\nI got indigestion, and it was pretty bad.\n\nMy stomach was upset, and I felt like throwing up.\nI also had a fever and felt light-headed.\nI tried to find some medicine but could not find any.\n\nSo, I went to the drug store to get some medicine.\nI told the pharmacist about my symptoms.\nHe gave me something that would make me feel better.\n\nI came back to the hotel and took some medicine to get better.\nI had to stay inside and get plenty of rest.\nSince then, I try to be more careful/ when I eat something."}, {"slide": 138, "text": "우리나라 관광객들이 해외여행지에서 하는 일들 묘사\nTell me about where tourists go and what they do on their overseas trips.\n\n: Korean tourists like to do a lot of sightseeing when they travel overseas.\nThey often visit tourist attractions or landmarks in the country.\nThey take a lot of pictures while they look around these places.\nAnd they sometimes post them up online.\n\nThey also go to decent restaurants to enjoy the local food.\nThey do online searches to find the best restaurants.\nThere are a lot of postings online for good places.\nSometimes, they ask the locals for recommendations.\n\nPlus, they do a lot of shopping at local markets.\nThey also go to duty free shops to get gifts or some souvenirs.\n\nSo, this is what Korean tourists do."}, {"slide": 139, "text": "해외로 나가는 여행객들이 관심 갖는 것들 묘사\n- 우리나라 관광객들이 해외여행지에서 하는 일들 묘사\nWhen people discuss traveling to other countries.\nWhat are the things that they are most interested in doing or seeing?\nWhy are these things of such interest or importance to travelers?\n\n: People do various things when they travel overseas.\nFirst, they like to do a lot of sightseeing.\nThey often visit tourist attractions or landmarks in the country.\nThey also take a lot of pictures while they look around these places.\nThey sometimes shoot videos clips and post them up online.\nPeople also send them to their friends and family.\n\nNext, they like to go to decent restaurants to enjoy the local food.\nThey do online searches to find the best restaurants.\nThere are a lot of postings online for good places.\nSometimes, they ask the locals for recommendations.\nI think trying local food is a big part of traveling.\n\nPlus, they do a lot of shopping when they travel overseas.\nThey buy things at local markets. They sometimes get souvenirs or clothes.\nThey also go to duty free shops to buy things.\n\nSo, these are the things people do when they take trips overseas."}, {"slide": 140, "text": "해외여행 과거와 현재 비교 – 교통편 발달\nYou indicated in the survey that you take vacations internationally.\nHow has traveling to other countries changed over the years? Is it easier or more difficult? Describe what traveling was like in the past and what changes you have seen over the years.\n\n: Frankly, I think travelling overseas has become a lot easier than in the past.\nThat’s because transportation has become a lot better over the years.\n\nFor example, in the past, trains used to be slower.\nBut now, they have become much faster than in the past.\nThat's because there are now bullet trains that are twice as fast.\nIt takes half the time to get somewhere now.\n\nPlus, in the past, plane ticket used to be very pricey.\nBut now, they have become much cheaper thanks to low-cost carrier.\nSome flights only cost half the price.\nOf course, plane tickets are quite expensive these days due to high oil prices and high demand after the COVID-19 pandemic.\nHowever, I expect ticket prices to fall once low-cost carriers start flying again.\n\nNext, back in the day, we used to use paper maps when we go on trips.\nBut these days, traveling has become much easier because we now have GPS.\nThe GPS tells us where to go, so we do not get lost that often."}], "aliases": ["Overseas trips"]}, {"key": "geography", "label_ko": "지형", "label_en": "geography", "scripts": [{"slide": 147, "text": "우리나라 지형적 특징 묘사 (int)\nDescribe your country’s geography for me.\nAre there mountains, lakes, or rivers? What is your country like?\n\n: Korea has a diverse geography because it has many mountains, beaches and rivers.\n\nFirst, there are some rivers that flow through large cities.\nThe rivers provide water for these cities.\n\nAlso, there are many mountains in Korea.\nThe mountains create a pretty landscape, and they change into beautiful colors in fall.\n\nThere are tons of beaches in Korea because it is a peninsula.\nSome beaches are popular vacation spots.\nPeople can enjoy various types of seafood in Korea.\n\nSo, Korea’s geography is very diverse."}, {"slide": 148, "text": "이웃 국가의 국민 성향과 전통 묘사 (int)\nTell me a little bit about a country close to your own country. Tell me what the country look like, about its people and some of its traditions.\n\n: Thailand is one of our neighboring countries.\nIt is only a short flight from Korea.\n\nAnd Thailand has a diverse geography\nbecause it has many mountains, beaches and rivers.\nFirst, there are many rivers that flow through large cities.\nThe rivers provide water for these cities.\n\nAlso, there are many mountains in Thailand.\nThe mountains create a pretty landscape.\n\nPlus, there are tons of beaches in Thailand.\nSome beaches are popular vacation spots.\nAnd, people can enjoy various types of seafood in Thailand.\n\nI think Thai people are quite friendly in general.\nThat is the impression I got."}, {"slide": 149, "text": "보편적인 야외 활동 묘사\nTell me about the kinds of outdoor activities that are popular in your country.\nDo people hike, bike, or swim? What do people typically do outdoors?\n\n우리나라 사람들이 시간이 날 때 하는 활동 묘사\nPlease tell me about what kinds of free time activities people in your country do.\n\n: Koreans do many kinds of outdoor activities in their free time.\n\nBecause there are many rivers.\nThere are riverside pa
