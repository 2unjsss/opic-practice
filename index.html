rks along the river.\nPeople can get some exercise and play sports there.\nSome people have picnics or ride bikes.\n\nAlso, because there are many mountains,\npeople like to go hiking or camping to the mountains.\nThere are also many ski resorts on the mountains,\nso many people like to go skiing in winter.\n\nAnd because there are many beaches, some people go on vacations to coastal areas.\n\nSo, Koreans enjoy these kinds of activities."}, {"slide": 150, "text": "가장 좋아했던 국내 장소 묘사 (int)\nI’d like you to pick a favorite place in your country from your childhood and describe that place for me. What are your memories of that place? What was it like when you were a child?\n\n지형관련 추억묘사 (adv)\nDescribe for me an early memory that you had of your country’s geography. Perhaps, you visited a special place or went to an important natural landmark. Describe what you saw when you visited this special place.\n\n: I remember going to the beach when I was a kid.\n\nMy favorite beach is on the south coast of Korea.\nIt is well-known beach.\nAnd it is also a popular vacation spot during the summer.\nIt gets crowded during the peak season.\n\nThere are tons of things to do near the beach.\nAnd there are a lot of hotels where people can stay at.\nThere are also various kinds of bars and cafes.\n\nSo, I remember going to the beach quite often when I was a kid."}, {"slide": 151, "text": "지형 관련해서 본인이 가본 국내 장소 추억 묘사 (adv)\nPeople often have memorable and moving experiences when they explore their country’s geography. You might climb a famous mountain or swim at a beautiful beach. Tell me the story of a memorable time you had while visiting a natural place in your country.\n\n: I remember going to the beach when I was a kid.\nWe stayed at beachside hotels with a nice ocean view.\n\nDuring the day, we swam in the ocean.\nAlso, we made a sandcastle or played with a ball.\n\nFor lunch, we went out for some Italian food such as pasta or pizza.\nWe also had seafood such as octopus, squid, crab and fish.\n\nAnd for dinner, we often had a barbeque at our hotel.\nWe grilled some meat and vegetables on the grill.\nThe food always tasted extra good because I was starving.\n\nAt night, we also took walks along the beach.\n\nLooking back, these trips were very enjoyable trips.\nIt was worth the time."}, {"slide": 152, "text": "우리나라가 지난 10년간 겪은 변화 중 하나 설명\nHow has your country changed in the past decade? Choose one area of change and provide a lot of details about urban development, tourism, or any other area.\n\n: Korea has changed a lot over the years.\nOne of the biggest changes is transportation.\nIt has become a lot better over the years.\n\nFor example, in the past, trains were very slow.\nBut now, they have become faster.\nThat’s because there are now bullet trains.\nSo, it takes less time to travel long distances.\n\nPlus, in the past, plane tickets were very pricey.\nBut now, plane tickets have become cheaper.\n\nAlso, it was hard to get a cab(taxi)in the past.\nBut you can call a cab(taxi) easily by using mobile apps now.\n\nSo, transportation has become better over the years."}, {"slide": 153, "text": "우리나라와 지리적으로 근접 국가 묘사, 변화 추세 설명\n- 우리나라 관광객들이 주로 가는 해외 국가 묘사 (int)\n- 우리나라 사람들이 주로 가는 해외 국가 묘사 (int)\nThink about a country that is geographically close to your home country.\nIn what ways has this country changed over the years?\nHas there been any changes in its economy, politics, etc.?\nDescribe this country and its changes in detail.\n\n: Japan is one of our closest neighboring countries.\nIt is only a short flight from Korea. It takes 2 hours to get there.\nJapan has a diverse geography because it has many mountains, beaches and rivers.\nFirst, there are many rivers that flow through large cities.\nThe rivers provide water for these cities.\nPlus, there are many bridges over the rivers, which are very pretty.\nNext, there are many mountains in Japan.\nIn fact, nearly half of the country is mostly mountains.\nThey change into beautiful colors especially in the fall season.\nThe trees change to red, yellow and orange. Their colors are beautiful.\nPlus, there are tons of beaches and Islands in Japan. Some of them are popular vacation spots and the coastline is very scenic. people can enjoy various types of seafood in Japan.\nMeanwhile, one of the changes your Japan is going through is population aging.\nIts population is actually aging quiet rapidly."}, {"slide": 154, "text": "이웃국가 관련 최근 읽거나 들은 뉴스 설명\n-우리나라와 다른 국가와의 관계와 관계 변화 설명\nTell me in detail about a news item you read or heard recently about a country near your country. What was the news story about?\nTell me in as much detail as you can about this report.\nTell me why this story is important.\n\n: Korea and Japan have a very long and complicated history. Relations between the two countries have gone through many ups and downs. Back in the early 1900’s, Japan occupied Korea for 36 years. It committed numerous war crimes during its occupation. Many of them were crimes against humanity. Nevertheless, Japan has not fully apologized for each wrongdoings. In recent months, relations between the two countries have become extremely bad. Korea's supreme court ruled that Japanese companies should compensate Korean victims. However, Japan strongly opposed the ruling and imposed trade sanctions on Korea. Korea retaliated by imposing sanctions of its own. Meanwhile, Korean people started to boycott Japanese products and canceled trips to Japan. The two nations currently have a big conflict over this matter. In fact, bilateral relations are at its lowest point. \nRecently I saw many news reports about this issue.\nIt gave me more insight about the relationship between Korea and Japan."}, {"slide": 155, "text": "우리나라와 이웃 국가와의 역사적 사건과 그 파장/ 여파 설명\nI’d like for you to think about a specific historic event that has affected the relationship between your country and one of the its neighboring nations. It could be a treaty signed between two countries, a cultural event or the visit of other country’s minister or president. Tell me in detail about everything that happened.\n\n: Let me talk about North and South Korea.\nTo give you some background, a major turning point in Korean history was the Korean War. Back in 1950, a war broke out between the North and the South.\nThat war lasted for 3 years and millions of people lost their lives.\nThe two sides signed a ceasefire treaty in 1953. Due to this war, Korea is still divided into North and South Korea. North Korea heavily invest in its military and so does South Korea. More recently, however, there have been diplomatic efforts to bring peace. There were several inter-Korean summits, which were historic.\nThey were aimed at the denuclearization of the Korean peninsula. The leaders of North Korea and the US also met three times as summit meetings. High-level talks are still going on to reach an agreement, but negotiations have not been going well in the past few months. In fact, North Korea is conducting weapon tests again, and tensions are rising. In the end, the final goal is to bring long-lasting peace to the Korean peninsula."}], "aliases": ["Geography"]}, {"key": "Hotel", "label_ko": "호텔", "label_en": "Hotel", "scripts": [{"slide": 156, "text": "우리나라 보편적인 호텔들 묘사 (int)\nTell me about the hotels in your country. What are those places like?\n\n: There are tons of hotels in Korea.\nThey are everywhere these days.\n\nSome hotels are very luxurious and quite big in size.\nMost of them are five-star hotels.\nThey have hundreds of guest rooms and their service is excellent.\nThey often have chains all across the world.\n\nPlus, there are also many hotels at popular vacation spots.\nThey vary in size and provide great views from the rooms.\nThese hotels get crowded during the peak season.\nThey charge higher rates during those times. So, it is more expensive to stay at hotels. It is good to book a room in advance because hotels can get fully-booked.\n\nSo, this is what hotels in Korea are like."}, {"slide": 157, "text": "호텔에 도착해서 하는 일들과 언제 투숙하는지 설명 (int)\nTell me what you typically do when you go to a hotel.\nWhat do you do first, second, etcetera? When do you usually stay at hotels?\n\n: I normally (usually) stay at hotels when I go on vacations.\nWhen I arrive at a hotel, I first go to the front desk to check in.\n\nIf I have a reservation, I give them my name.\nAnd then I get my room keys and head to my room.\n\nWhen I get to my room, I first look around.\nI check the bed, the bathroom and the closet.\nI also open the curtains and look at the view.\nAfter that, I unpack my bags and hang my clothes in the closet.\nI normally change into some comfortable clothes.\nAnd then, I go on a tour and visit some famous places.\n\nSo, this is what I do when I arrive at a hotel."}, {"slide": 158, "text": "기억에 남는 호텔 묘사와 기억에 남는 이유 설명 (adv)\nPeople often have memories of especially beautiful and interesting hotels.\nTell me about a hotel that you remember for some reason. Where was it?\nWhat did it look like? Describe it for me in as much detail as possible.\n\n: I remember staying at a beachside hotel a few years ago.\n\nI went there with my family.\nAnd it was the best hotel in the area.\n\nThe view from the room was breathtaking.\nI could see the sunset from the window.\n\nAnd the food at the hotel tasted amazing.\nI went to the hotel buffet and there was so much to eat.\nI enjoyed everything I ate there. I also ordered room service when I was hungry at night.\n\nPlus, I also got a massage at the hotel spa.\nI also went to swim in the swimming pool.\nI also got some souvenirs at the gift shop.\n\nLooking back, I really enjoyed my stay there.\nIt was one of the most memorable hotels in my life.\nIt was worth the money I spent. I look forward to going there again if I have the chance."}, {"slide": 159, "text": "최근에 호텔에 묵었던 경험 묘사 (adv)\nWhen was the last time you stayed in a hotel?\nTell me the whole story of where you were, why you were there and what you did there. Take me through the whole hotel stay from start to finish.\n\n: I remember staying at a beachside hotel on my last vacation.\nThe hotel was very nice and pretty.\nWhen I arrived, I first went to the front desk to check in.\nI had a reservation, so I gave them my name and my credit card.\nAnd then, I got my room keys and headed to my room.\n\nWhen I got to my room, I first looked around.\nI checked the bed, the bathroom and the closet.\nI also opened the curtains and took a look at the view outside.\nThe view of the beach was amazing.\nAfter that, I unpacked my bags and hung my clothes in the closet.\nAnd then, I changed into some comfortable clothes.\n\nSo, this was the last time I stayed at a hotel."}], "aliases": ["Hotel"]}, {"key": "food", "label_ko": "음식", "label_en": "food", "scripts": [{"slide": 172, "text": "건강식 종류와 건강에 좋은 이유 *\nMany people try to eat healthy these days.\nWhat kinds of foods are healthy and why are they healthy for us?\n\n본인이 먹는 일상음식 묘사 *\nTell me about a kind of food you eat on a regular day.\nWhen and where do you usually eat?\n\n: Personally, I try to eat healthy every day. I try to eat well and properly.\n\nFor starters, I try to eat vegetables and fruits as often as I can.\nThey contain a lot of fibers[퐈이벌], minerals and vitamins[바이타민즈].\nMy favorite vegetables are cabbage and mushrooms.\nI also like cucumbers and carrots because they are very crunchy.\nMy favorite fruits are pomegranate, shine muscat.\nI like to have pears, peaches and grapes when they are in season.\n\nNext, I also try to eat fish, pork, beef and chicken as much as I can.\nI eat eggs with different styles because they are rich in healthy protein.\n\nSo, these are foods that are healthy for us."}, {"slide": 173, "text": "건강식 구매 방법 및 조리법 설명 *\nHow do you shop for healthy food?\nWhat kinds of things do you have to do to cook healthy food?\n\n: The best way to cook healthy food is to use fresh ingredients.\nI always make sure to get fresh ingredients for cooking.\nI also check the expiration date on processed foods.\n\nI get groceries at a local markets near my home.\nThe store is very large in size.\nThey have everything from (fresh vegetables) to (all kinds of seafood.)\n\nThere are a lot of options to choose from.\nThey have good prices and good quality, so I can get great deals there.\n\nI am a regular and I go there at least once or twice a week.\n\nSo, this is where I buy healthy food for cooking.\n\nHowever, these days, I also get groceries online very often."}, {"slide": 174, "text": "어렸을 때 건강식을 먹게 된 계기 설명\nTell me how you found out about eating healthy.\nDid your family eat healthy when you were growing up? Did your friend become healthier by eating healthy food? Describe in detail how you started to eat healthy.\n\n: When I was a kid, my mom used to be a health-conscious.\n\nShe made sure we were getting the nutrients we needed.\nShe used to make sure we were having balanced meals.\n\nShe made us eat vegetables and meat and also made us drink milk every day.\nMy mom was the one/ who made me learn about eating healthy.\n\nI become more conscious about what I eat because of my mom.\nAs an adult, I still try to eat healthy myself.\nI also try to eat less unhealthy food such as junk food.\nI also try to eat less instant food.\n\nSo, I learned about eating healthy from my mom."}, {"slide": 175, "text": "건강식을 최근에 먹어 본 경험\nWhen was the last time you had some healthy food?\nWho was it with and how did you feel?\nWhat was special about that experience?\n\n우리나라 대표음식 묘사\nWhat are some of the typical foods in your country?\nWhat dishes are popular?\n\n: One of the most typical foods in Korea is Kimchi.\nIt is very tasty and also healthy for us as well.\nIn fact, Kimchi was selected as one of the healthiest foods in the world.\n\nKimchi is rich in vitamin and fiber.  쓔유\nIt makes us healthier because it helps us to have better Immune system.\n\nMost of Koreans eat Kimchi every single day and I also had some last night for dinner. I think Korean meals are not the same without Kimchi.\n\nOnce again, Kimchi is one of the healthiest foods I have almost every day."}, {"slide": 176, "text": "음식 관련 기억에 남는 에피소드 묘사 *\nTell me about a memorable experience you had while eating something. It could have been something good or bad. What happened? Why was it so memorable or special? Tell me everything in as much detail as possible.\n식사 관련 기억에 남는 에피소드 묘사 *\nSometimes when we plan a meal, things do not work out. Reservations at restaurants get lost or meals delivered to offices or homes have missing items. Tell me the story of a time that a plan for a meal did not work out as planned for you or someone you know.\nTell me everything you did to resolve this situation from beginning to end.\n\n: I remember when I had a bad stomachache after eating something.\nI think I ate too much because I was so hungry.\nI should not have done that.\nI got indigestion, and it was pretty bad.\n\nMy stomach was upset, and I felt like throwing up.\nI also had a fever and felt light-headed.\nI tried to find some medicine but could not find any.\n\nSo, I went to the drug store to get some medicine.\nI told the pharmacist about my symptoms.\nHe gave me something that would make me feel better.\n\nI came back home and took some medicine to get better.\nI had to stay inside and get plenty of rest.\nSince then, I try to be more careful when I eat something."}, {"slide": 177, "text": "어렸을 때 먹었던 특별한 음식 관련 경험 묘사 (음성x)\nTell me about a memory that you have about a special food or a dish from your childhood. Tell me where and when you had this dish. Describe in detail. What made this experience so memorable?\n\n: I remember going to a burger chain near my home when I was a kid.\n\nI usually ordered a chicken burger combo, which was one of their signature menus.\nI got a soft drink or a milk shake for the drink.\nPlus, I used to get French fries or onion rings as a side dish.\nSometimes, I ordered chicken nuggets, chicken wings or chicken tenders.\n\nThe food at that place tasted amazing especially when I was starving.\nThe French fries were so crispy and crunch.\nOther side dishes were very tasty as well.\nI can still remember how good the food was.\n\nThe only downside was that the food was very greasy.\nBut that did not bother me too much because I was a young kid.\n\nSo, looking back, it was one of the most memorable fast food places in my childhood."}, {"slide": 178, "text": "20년간 사람들이 식품 구매 방식 변화\nHow has food shopping changed over the last 20years?\nWhat have been some of the trends or changes you have noticed when comparing shopping today with that of the past?\n\n: Food shopping has become much easier over the last 20 years.\nOne of the most significant changes is online shopping.\n\nIn the past, people had to go to actual stores to get groceries.\nThey used to shop at various locations such as discount stores, shopping malls or grocery stores.\nBut now, people shop online very often as well.\nIt has become the norm and it is all the rage these days.\nOnline shopping is very convenient in many ways, because there is no need to go to actual stores.\nAll you have to do is to pick and choose items on your phone.\nYou can pay instantly and the goods are delivered to your home.\nIt takes much less time and effort to buy things on the internet.\nAlso, there are a lot of options to choose from, so you can get great deals.\nIn fact, people buy various types of groceries online.\n\nOnce again, food shopping has become a lot easier than in the past."}, {"slide": 179, "text": "식품 오염 사건 관련 뉴스 보도 설명 I (NEW)\nThere have been many stories in the news of foods that have been contaminated or that contained dangerous bacteria. Tell me about the food scare stories you heard about or read about.\n\n: I remember watching the news about a mess food poisoning incident.\n\nThousand of students at more than 20 schools got sick.\nThe food had gone bad at the student cafeterias.\nThe food was contaminated by bacteria.\n\nMany students had symptoms such as high fever, stomach pain and vomiting.\nMost of them were hospitalized because their symptoms were quite severe.\nIt was very unfortunate that the students got sick like that.\n\nEventually, the food and drug administration conducted investigation.\nThey found out that the chocolate cake that the students had was the problem.\nThe cause was salmonella, a very dangerous bacteria that causes food poisoning.\n\nThe incident raised awareness for food safety issues.\nSince then, people started to be more careful when they eat something."}, {"slide": 180, "text": "식품 오염 사건 관련 뉴스 보도 설명 II\nThere have been many stories in the news of foods that have been contaminated or that contained dangerous bacteria. Tell me about the food scare stories you heard about or read about.\n\n: I can not think of any news about food poisoning off the top of my head.\nMost of the news I have seen recently was about the Coronavirus.\nAs you know, the epicenter of the virus was Chinese city of Wuhan.\nHowever, it spread to at least 210 other countries all over the world.\nThe virus was highly contagious and spread at an alarming rate.\nThe WHO declared a global pandemic and called for measures to contain the virus.\n\nIn the initial stages, the situation was especially bad in European countries such as  Italy, Spain, France, Germany and the UK. But soon, the situation got worse in nations like the US, India, Brazil and Russia. Among them, the US got the highest number of cases, over 60 million.\n\nOverall, there were more than 200 million confirmed cases worldwide.\nThe global death toll went over 4 million and it is still rising.\nSome coronavirus vaccines from Pfizer, Modena, and AstraZeneca have been approved and healthcare workers are getting vaccinated first.\nHowever, we will still have to wait months to have them available for the general public.\n\nThat being said, I hope that the coronavirus will die off eventually, sooner than later."}, {"slide": 181, "text": "식품 오염 사건 관련 뉴스 보도 설명 III (new)\nThere have been many stories in the news of foods that have been contaminated or that contained dangerous bacteria. Tell me about the food scare stories you heard about or read about.\n\n: I remember watching the news about COVID-19.\n\nThe virus had a deep and widespread economic impact.\nMany nations had to impose strong social distancing measures to contain the virus.\nSome even had nation-wide lockdowns and closed down their borders.\nThis had a devasting effect on local economics and people’s livelihoods.\nThe hardest-hit areas were the travel industry and the airline industry.\nMany in those sectors lost their jobs as companies had to downsize their workforce.\n\nThe virus also took a huge toll on large businesses as many of them had to shut down.\nSmall and medium- sized business also took a big hit.\nMany stores went out of business and closed down.\nMillions of people lost their jobs as companies had to lay off their employees.\nAs a result of these layoffs, the unemployment rate rose sharply.\nA lot of people have had a very difficult time making a living.\nPlus, most economies posted minus growth year-on-year.\n\nIn the end, the coronavirus had major ripple effects on the global economy.\nI hope that the economy could come back to normal as soon as possible."}], "aliases": ["Food"]}, {"key": "Health", "label_ko": "건강", "label_en": "Health", "scripts": [{"slide": 185, "text": "건강한 사람들이 먹는 음식 묘사 (int)\nTell me about the kinds of foods healthy people eat.\nWhat foods are they? Where do they buy these foods?\n\n건강한 사람들의 식습관 묘사 (int)\nWhat are the eating habits of healthy people?\nWhat do they usually eat during the week, for breakfast, lunch, dinner, snacks, etc?\n\n건강한 사람들의 식습관의 과거 현재 변화 (adv)\nHow have the eating habits of healthy people changed since when you were child? Was the healthy diet same as it is now? Describe in detail the major differences.\n\n: The way people eat healthy has not changed that much over the years. ->건강한 사람들의 식습관의 과거 현재 변화\nHealthy people try to eat well every day.\n\nThey try to eat vegetables and fruits as often as they can.\nThey contain a lot of fibers, minerals and vitamins.\nFor example, they eat fruits such as apples, bananas and grapes.\nThey also eat vegetables such as tomatoes, onions, carrots, potatoes and sweet potatoes.\n\nThey also try to eat fish, pork, beef and chicken as much as they can.\nThey eat eggs and beans with different styles.\nThey are rich in healthy protein.\nThey try to eat organic food whenever they can.\nThey are not grown with chemicals, so they are much healthier.\nSo, these are what healthy people eat."}, {"slide": 186, "text": "본인 동네에 건강식품 파는 식료품점 묘사 (int)\nTell me about a local health food store in your neighborhood.\nWhat does this place look like?\n\n본인의 건강을 위해 음식 관련해서 했던 일 묘사\nTell me about something that you did to stay healthy.\nDid you cook a healthy meal, eat at a healthy restaurant or learned about a healthy diet?\nWhat did you do exactly and how did it help you become healthier?\n\n: I stay at home quite often these days because of the coronavirus.\nSo, I try to cook healthy food at home for my health.\nThe best way to cook healthy food is to use fresh ingredients.\nSo, I always make sure to get fresh ingredients for cooking.\nI also check the expiration date on processed foods.\nI get groceries at a local supermarket near my home. The store is very large.\nThey sell everything from fresh vegetables to all kinds of seafood.\nSo there are a lot of options to choose from.\nThey have reasonable prices and good quality goods.\nSo I can get good deals there.\nI am a regular and I go there at least once or twice a week on average.\nSo this is where I buy fresh ingredients for cooking.\nHowever, I also get groceries online very often these days."}, {"slide": 187, "text": "본인이 아는 건강한 사람 습관 묘사 (int)\nTell me about someone you know who is very healthy.\nWhat is that person like?\n\n: One of my friend is very health-conscious.\n\nShe always tries to eat well and properly.\nAlso, she tries to cut back on unhealthy food such as junk food.\n\nNext, my friend tries to work out as often as she can.\nShe tries to get some exercises at the gym every day.\nShe also tries to take walks at the park whenever she can.\n\nSo, these are the things that make my friend healthy."}, {"slide": 188, "text": "본인이 건강을 위해 하는 일들 (int)\nTell me about all the things you do in order to stay healthy.\n\n: I do several things to stay healthy.\nFirst, I try to work out as often as I can.\n\nI try to get some exercises at the gym or take a walk at the park.\nI sometimes go hiking or ride bike whenever I have some free time.\nNext, I try to eat proper balanced meals.\nI try not to eat too much or too late. /(I try to eat little and early)\nI also try to eat slow and mild food.\n\nPlus, I think personal hygiene is very important especially because of the coronavirus.\nI try to wash my hands well as often as I can and I always wear mask in public.\nI also use hand sanitizers whenever I have the chance.\nI also try to practice social distancing and avoid crowded places.\n\nI think my mental health is very important.\nI try to stay positive and look on bright side of things so that I can get less stress.\n\nSo, these are the things I do to stay healthy."}, {"slide": 189, "text": "본인이 건강을 위해 새로운 것을 시도해 본 경험 묘사 (adv)\nTell me about a time when you or someone you know did something new to become healthier. Maybe it was playing a sport or eating some healthy food. Tell me about the change in detail.\n\n본인 건강 유지를 위해 뭔가 새롭게 배웠던 경험 묘사 (adv)\nTell me about a specific time when you learned something about how to maintain good health. It might have been a class you took, or a book you read. Describe what happened from beginning to end in detail.\n\n: I have tried several new things to stay healthy.\nFirst I tried to work out as often as I could.\nI tried to get some exercise at the gym or take walks at the park.\nI also went hiking or riding whenever I could.\nI also took yoga class and got personal training from a trainer.\n\nNext, I tried to eat properly and have balanced meals.\nI tried not to eat too late. ( I tried to eat early/ I tried to have early dinner)\nI also tried not to eat too fast or too salty. /(I tried to eat mild and slowly)\nI tried to cut back on unhealthy food such as junk food./\n(I didn’t eat junk food/I tried to eat less junk food)\n\nI thought mental health was very important.\nSo I tried to stay positive and look on bright side of things so that I could get less stress.\nSo, these were the things I have tried to stay healthy."}, {"slide": 190, "text": "본인이 건강을 위해서 했던 행동 구체적으로 설명 (adv)\nPeople do a lot of things to try to be healthy. They might join a healthy cooking class or join a new exercise program. Tell me about something you have done to try to improve your health.\nTell me why you choose that particular activity and how it all worked out.\n\n: Eating healthy was one of the most effective ways to stay healthy.\nI tried to eat healthy every day.\n\nFor starters, I tried to eat vegetables and fruits as often as I could.\nThey contain a lot of vitamins, minerals and fiber.\nMy favorite vegetables are tomatoes and potatoes.\nI also like to have cabbages and onions.\nI like to have peaches and grapes when they are in season.\n\nNext, I tried to eat fish, pork, beef and chicken breasts as much as I could.\nI tried to eat beans and tofu whenever I had the chance.\nThey are rich in healthy protein.\nThey are not grown with chemicals, so they are much healthier.\n\nIn the end, eating properly helped me stay healthy and lose some weight."}, {"slide": 191, "text": "건강에 대한 인식과 운동법 과거 현재 비교 (adv)\nIdeas about what good health is and how to maintain it change frequently.\nWhat did people do to maintain good health when you were a child?\nWhat was considered to be a healthy diet at that time?\nHow did people usually exercise?\nDescribe how our ideas of what is healthy have changed over time.\n건강에 대한 세대간 인식 과거 현재 비교 (adv) #14,15\nDifferent generations have different views on what is healthy.\nSome generations think people have to be skinny in order to be healthy.\nWhile others believe people must be muscular. What did your parent’s generation think people have to be like in order to be healthy?\nHow does that compare to what your generation believes?\n사람들의 건강 유지 방법 과거 현재 비교 (adv) #14,15\nDescribe how people usually stayed in good shape when you were a child.\nWhat kinds of sports did they play? Did people go to gyms?\nDescribe what fitness was like then, and how it has changed over the years.\n\n: In the past, people thought less about their health.\nBeing healthy was same as not being sick.\nBecause there was not much information about health.\nBut these days, things are a lot different.\n\nFor starters, people can find out about their health more easily.\nThere is a lot of health information on the internet.\nPeople can get medical check-ups on a regular basis.\nThese check-ups tell people what is wrong with their health.\nIf they find out there is something wrong, they can do something about it more quickly.\n\nPeople also try to work out as often as they can.\nWith this trend, gyms have become a lot better than in the past.\nThey have many kinds of exercise programs.\n\nOnce again, people are more conscious about their health these days."}, {"slide": 192, "text": "건강에 대한 인식과 운동법 과거 현재 비교 (adv)\nIdeas about what good health is and how to maintain it change frequently.\nWhat did people do to maintain good health when you were a child?\nWhat was considered to be a healthy diet at that time?\nHow did people usually exercise?\nDescribe how our ideas of what is healthy have changed over time.\n건강에 대한 세대간 인식 과거 현재 비교 (adv) #14,15\nDifferent generations have different views on what is healthy.\nSome generations think people have to be skinny in order to be healthy.\nWhile others believe people must be muscular. What did your parent’s generation think people have to be like in order to be healthy?\nHow does that compare to what your generation believes?\n사람들의 건강 유지 방법 과거 현재 비교 (adv) #14,15\nDescribe how people usually stayed in good shape when you were a child.\nWhat kinds of sports did they play? Did people go to gyms?\nDescribe what fitness was like then, and how it has changed over the years.\n\n: The way people look after their health has changed a lot due to COVID-19.\nAs the virus spread, it has had a huge impact on our daily lives.\nFirst, we had to minimize person-to-person contact.\nPeople were told to avoid crowded places such as bars, clubs and karaokes.\nIn fact, businesses were forced to shut down when the number of new cases spiked.\n\nNext, many companies made their staff work from home.\nWork meetings took place through video conferences, using programs like zoom.\nThis changed the work environment fundamentally.\n\nAlso, schools had to make necessary changes as well.\nIn-school classes were postponed or had to be stopped sometimes, and students had to take remote video classes from home.\n\nMost importantly, people were asked to clean their hands well as often as they could.\nHand sanitizers were set up in almost all places, including elevators.\nPlus, everyone was told to wear masks in public and practice social distancing.\n\nIn the end, the coronavirus changed out lives drastically and some changes will become permanent, and things may never come back to normal."}, {"slide": 193, "text": "건강 관련 최근 본 뉴스 내용 설명 (food 식중독 뉴스)\nTell me about a recent news story related to health issues.\nDescribe what happened in detail.\nWhat was the reaction of your community?\n건강 관련 최근 발생한 사건 설명\nDescribe a recent event in your area that involved health issues.\nPerhaps, something happened in the food or medical industries.\nPerhaps, something related to sports happened or a ban on smoking was enacted.\nDescribe what happened in detail including the reaction of your community.\n\n: I remember watching the news about the coronavirus pandemic.\nAs the virus spread, it has had a huge impact on our daily lives.\nFirst, we had to minimize person-to-person contact.\nPeople were told to avoid crowded places such as bars, clubs and karaokes.\nIn fact, businesses were forced to shut down when the number of new cases spiked.\n\nNext, many companies made their staff work from home.\nWork meetings took place through video conferences, using programs like zoom.\nThis changed the work environment fundamentally.\n\nAlso, schools had to make necessary changes as well.\nIn-school classes were postponed or had to be stopped sometimes, and students had to take remote video classes from home.\n\nMost importantly, people were  asked to clean their hands well as often as they could.\nHand sanitizers were set up in almost all places, including elevators.\nPlus, everyone was told to wear masks in public and practice social distancing.\n\nIn the end, the coronavirus changed out lives drastically.\nSome changes will become permanent, and things may never come back to normal."}], "aliases": ["Health"]}, {"key": "shopping", "label_ko": "쇼핑", "label_en": "shopping", "scripts": [{"slide": 201, "text": "Go shopping\nShop online\nGet great deals\nGet discounts\nGet an exchange\nGet a refund\nGet groceries\nLocal supermarket chain\ngood quality goods\nGood prices\nIn stock\nSold-out\n\nTypical shopping day\nDecide what to buy\nThink about where to go\nThink about when to go\nDress light\nWear comfortable shoes\nWalk around\nLook around\nDo some window shopping\ncompare prices\nTry things on\nPay for something\nPay with my credit card\nPay in cash"}, {"slide": 202, "text": "우리나라 상점/ 쇼핑몰 묘사\nYou indicated in the survey that you go shopping.\nTell me about stores or shopping centers in your country.\nWhat are these places like?\n\n: There are tons of stores and shopping centers in Korea.\nThey are everywhere these days.\n\nMany stores are on busy streets with a lot of traffic.\nThey are concentrated near subway stations or universities.\n\nOne of the largest places to shop is outlet malls.\nThere are many types of stores at these places.\nYou can find all sorts of brands for clothes and shoes.\nThese stores normally sell products from the previous season.\nSo you can get discounts and get great deals there.\n\nPlus, there are many restaurants and cafes at outlet malls.\nThere are large-scale food courts as well.\nSo, you can grab a bite if you are hungry.\n\nOnce again, there are many stores and shopping centers in Korea."}, {"slide": 203, "text": "본인이 즐겨 가는 쇼핑 장소와 사는 물건 묘사\nWhere do you go when you go shopping for something?\nWhat do you buy when you go there? What is special about that place?\n\n쇼핑하는 습관 묘사\nYou indicated in the survey that you go shopping. I’d like to know more about your interest in shopping. Where do you go? Who do you usually go with?\n\n: In the past, I always had to go to actual stores to buy things.\nI used to shop at various locations such as department stores, discount stores,\nshopping malls or grocery stores.\nBut now, I shop online very often as well. It has become the norm.\n\nOnline shopping is very convenient in many ways.\nThat’s because you don’t need to go to actual stores.\n\nAll you have to do is to pick and choose an item on your computer or phone.\nYou can pay for it instantly and the goods are delivered to your home.\n\nIt takes less time and effort to buy things on the internet.\n\nI get electronics, clothes, shoes, books or tickets on the internet most often.\nPlus, I sometimes buy food, groceries or skincare products online as well.\n\nSo, I shop online quite often."}, {"slide": 204, "text": "본인이 쇼핑을 하러 가는 날 하는 일들 순서대로 묘사\nDescribe a typical shopping day for you. Tell me everything you do from the moment you leave home until you return.\n\n: On a typical shopping day, I first decide what to buy.\nI also think about where to go and when to go.\nI also think about who to go with.\n\nThen, I make sure to wear comfortable shoes, because I have to walk around a lot.\n\nWhen I get to the shopping mall, I first look around.\nAnd then, I compare prices and try things on.\n\nWhen I find something I want to buy, I go up to the counter and pay for it.\nAfter doing some shopping, I go grab a bite at some restaurants nearby.\n\nSo, this is what I do on a typical shopping day."}, {"slide": 205, "text": "어렸을 때 쇼핑 추억과 좋아하게 된 계기 묘사\nTell me about your early memories of shopping and how you came to enjoy it so much. You could include information about where and when you used to shop, the people you went shopping with, what kinds of things you used to do while shopping or anything else that would give a clear picture of that experience.\n\n어렸을 때 기억에 남는 상점/시장 묘사\nThink about your early memories of shopping. Is there a store or a market that you remember from your childhood? Describe this place for me. What did it look like? What was your impression of the place?\n\n: I remember getting groceries when I was a kid.\nI went to a local supermarket with (mom and dad./my family)\nI was very excited whenever I went there.\n\nFirst, we got some rice, bread and instant noodles.\nPlus, we got some fruits such as apples, strawberries, bananas and oranges.\nWe also bought some veggies such as potatoes, tomatoes, onions and carrots.\nWe got some ice-cream, milk, cheese and sausages.\nWe also bought some chips, cookies, chocolates and sweets.\n\nThe supermarket was very large so there were many kinds of products.\nThey had good prices and good-quality goods, so we were able to get great deals there.\n\nSo, this was my early memory of going shopping."}, {"slide": 206, "text": "본인의 최근 쇼핑 경험 묘사\nWhen was the last time you went to shop for something? Where did you go and what did you buy? Who did you go with? What was special about that shopping experience?\n\n: I remember getting groceries a few days ago.\nI went to a local supermarket with (mom and dad./my family) recently.\n\nFirst, we got some bread and instant noodles.\nPlus, we got some fruits such as apples, strawberries, bananas and oranges.\nWe also bought some veggies such as potatoes, tomatoes, onions and carrots.\nAlso, we purchased some drinks, beer and wine.\nNext, we got some chicken, pork and beef.\nWe also got some ice-cream, milk and cheese, chips, cookies and chocolates.\n\nThe supermarket was very large so there were many kinds of products.\nThey had good prices and good-quality goods.\n\nSo, this was the last time I went shopping."}, {"slide": 207, "text": "쇼핑 중 겪은 예상치 못한 경험 묘사 *\nSometimes, funny or unexpected things happen while shopping. Tell me the story of a memorable shopping experience you had. Maybe you saw a friend at a store, maybe the item you bought was broken or did not work. Tell me in detail about a shopping trip that you still remember for some reason.\n\n본인이 겪은 특정 쇼핑 에피소드 묘사 *\nYou probably had many interesting experience while shopping. Perhaps something good, funny or problematic happened. Where were you. What happened? What did you and others do to deal with the situation? Tell me about that particular experience in as much as details as possible.\n\n: I remember shopping for some running shoes a few weeks ago.\nI found a pair of shoes I really liked at a store.\nBut the store did not have my size because they were sold-out.\nI could not buy the shoes I wanted, so I had to buy another one instead.\n\nPlus, I remember getting a shirt online.\nBut when I tried it on at home, it did not fit well.\nIt was too big and too long.\nSo, I sent it back to get an exchange.\n\nAnd I once bought a jacket at a store.\nHowever, when I saw it again at home, it did not look good on me.\nSo, I went back to get a refund.\n\nSo, these were the problem I have had."}, {"slide": 208, "text": "사람들의 쇼핑 습관 관련된 가장 큰 변화 묘사\nYou indicated in the survey that you go shopping.\nGoing shopping has changed a great deal over the years.\nTalk about the most significant changes in shopping over the years.\n\n: Shopping has become much easier over the last 20 years.\nOne of the most significant changes is online shopping.\n\nIn the past, people had to go to actual stores to buy things.\nThey used to shop at various locations such as department stores, discount stores, shopping malls or grocery stores.\nBut now, people shop online very often as well. It has become the norm.\n\nOnline shopping is very convenient in many ways, because there is no need to go to actual stores. All you have to do is to pick and choose items on your computer or phone.\nYou can pay for it instantly and the goods are delivered to your home.\n\nIt takes much less time and effort to buy things on the internet.\nAlso, there are a lot of options to choose from, so you can get great deals.\n\nPeople get electronics, clothes, books or tickets on the internet most often.\nPlus, people get groceries, cosmetics, accessories, or skincare product online.\n\nOnce again, people shop online whenever the need to."}, {"slide": 209, "text": "사람들이 요즘 많이 언급하는 인기 상품/ 서비스 묘사\nWhat kinds of products and services do you hear shoppers talk about the most these days? Why do you think they are generating so much interest?\nTell me in detail about those products. What are people saying about them and why?\n\n: Most people listen to music on their cell phones, laptops or Tablet PCs.\nThese devices are always connected to the internet.\nSo, people use streaming sites to listen to music these days.\nThese streaming services are very convenient in many ways.\nThey have thousands of songs and it is very easy to search for music.\nThe best thing about them is that people can make their own playlists.\nThey can also see the lyrics or information about the song on the screens.\nThey can also listen to the same song over and over again.\nPlus, the sound quality has become much better than in the past.\nMeanwhile, cell phones and computers have Bluetooth functions.\nSo, you can connect them to various types of devices such as Bluetooth earphones or speakers. These devices have become the norm and they are all the rage these days.\nThey are very convenient because you do not have to plug them in.\nThere are no wires, so they do not get tangled up.\nPersonally, I use Bluetooth earphones quite often myself when I listen to music.\nMy friend gave me on Airpod for my birthday, and I have been using it ever since.\nOnce again, the latest trend is Bluetooth devices when it comes to music.\n\n### Notes:"}], "aliases": ["Shopping"]}, {"key": "restaurant", "label_ko": "음식점", "label_en": "restaurant", "scripts": [{"slide": 227, "text": "우리나라 보편적인 음식점 묘사\nTell me about the restaurant in your country. What is a typical restaurant like?\n\n본인 동네에 가장 좋아하는 음식점 묘사\nTell me about a restaurant near where you live.\nWhat kind of food does it serve? How are the prices? How often do you go there?\nGive me as much detail as you can about one of your favorite local places to eat.\n\n: One of the most typical restaurant in my country is barbeque restaurants.\nThere are tons of BBQ places in Korea.\n\nI think they are everywhere these days.\nMany BBQ places are on busy streets with a lot of foot traffic.\nThey are usually concentrated near subway stations or universities.\n\nThey serve various types of meat such as pork, beef, chicken, duck.\nIt is one of the most well-known restaurants in my neighborhood.\nPersonally, I like going to a local BBQ place that serves pork.\nI like going there because I like the food and the mood.\nPlus, it is close to my home. It is only 10 minutes away on foot.\nThe owner and staff are also very nice and friendly. The service is very good.\nNext, it is cheaper than other places. Their prices are reasonable.\n\nI am a regular there, I think I go there at least once or twice a month on average.\nSo, this is what my favorite local restaurant is like."}, {"slide": 228, "text": "본인이 가장 좋아하는 외국 음식점 묘사\nDescribe your favorite restaurant with an ethnic or international menu.\nTell me about the place in as much detail as possible.\n\n: I go to fast food places from time to time.\nAnd I go to burger chains most often.\nWhen I go there, I know what to get in advance, because they have a pre-set menu.\n\nWhen I go there, I usually order a burger combo, which is one of their signature menus.\nI get a soft drink or a milkshake for the drink.\nI sometimes get French fries or onion rings as a side dish.\nI sometimes order chicken nuggets, chicken wings or chicken tenders.\nI sometimes get biscuits or ice cream.\n\nI sometimes get the food to go or I sometimes eat it on the spot.\n\nFast food tastes great especially when I am starving.\nThe French fries are so crispy and crunchy.\nOther side dishes are very tasty as well.\n\nThe only downside is that the food is very greasy and is high in high in calories.\nI could gain weight if I eat fast food too often.\nSo, this is my favorite foreign restaurant."}, {"slide": 229, "text": "음식점에 가면 어떻게 하는지 순서대로 묘사\nTell me about what you usually do when you eat at a restaurant. What do you do first , second, etc? Take me through a typical restaurant visit.\n\n: When I arrive at a restaurant, I first decide where to sit.\nI sometimes decide on my own.\nBut, sometimes one of the waiters shows me to my table.\n(guide me to the table)\n\nWhen I get the menu, I decide what to order.\nI sometimes ask for recommendations.\n\nWhen the food comes out, I start to eat.\nI ask for more water or sauce whenever I need to.\nAfter I am done with the main dish, I sometimes have some dessert.\n\nBefore I leave the restaurant, I go up to the counter and pay for my meal.\nI usually pay with my credit card or debit card.\nI rarely pay in cash these days.\n\nSo, these are the things I do/ when I go to a restaurant."}, {"slide": 230, "text": "본인이 가장 좋아하는 음식, 음식점 묘사\nDo you have a favorite type of food?\nDo you like American, Chinese or Japanese?\nWhat is your favorite restaurant? Why do you like to go there?\n\n외국 음식점에서 최근에 간 경험 묘사\nWhen was the last time you ate at a restaurant with an international menu?\nWhat was the occasion? Who was with you? What did you eat and so on?\nTell me the entire story of that visit.\n\n최근에 음식점 갔었던 경험 묘사\nTell me the story of the last time you had a chance to eat out at a restaurant.\nWhere did you go? Who was with you? What did you have?\nTell me everything that happened from start to finish.\n\n: My friends and I had a gathering a few weeks ago. We got together for dinner.\nMy favorite food is Italian food so we went to a decent Italian restaurant.\nIt is a well-known restaurant in town.\n\nWhen we got there, we first decide where to sit. And then, we looked at the menu and decided what to get.\n\nWe ordered several dishes including a combo menu. And when the food came out, we started to eat.\nThe main dish and the side dishes were very tasty. I think the food tasted extra good because I was starving.\nThe pasta and pizza were tasty and the stake was very juicy and tender.\nI also liked the sauce and the seasoning on the food as well. It tasted really good.\n\nWe also grabbed some drinks while having the meal. The drinks went very well with the food.\nLooking Back, it was a very enjoyable dinner.\nI look forward to going there again if I have the chance."}, {"slide": 231, "text": "어렸을 때 갔던 음식점 묘사 (adv)\nDescribe for me a restaurant that you remember from your childhood.\nWhat was the restaurant like? Was it different from the restaurant you visit today?\n\n: I remember going to fast food place when I was a kid.\nAnd I went to burger chains most often.\n\nWhen I went there, I usually ordered a burger combo.\nI got a soft drink or a milkshake for the drink.\nI sometimes got French fries or onion rings as a side dish.\nI sometimes order chicken nuggets or chicken wings.\nI sometimes got biscuits or ice cream.\n\nThe food at that place tasted amazing especially when I was starving.\nThe French fries were so crispy and crunchy.\nOther side dishes were very tasty as well.\nI can still remember how good the food was. It still stands out in my memory.\nThe only downside was that the food was very greasy and high in calories.\n\nLooking back, it was one of the most memorable fast food places in my childhood."}, {"slide": 232, "text": "좋아하는 테이크 아웃/배달 음식점 묘사 (int)\nTalk about your favorite take-out or delivery food restaurant. What is the place like? What kind of food do they commonly offer?\n\n: There are tons of take-out restaurants in Korea.\nI think they are everywhere these days. I think almost all restaurants offer take-out or delivery services because of the corona virus.\n\nMany take-out places are on busy streets with a lot of foot traffic.\nThey are concentrated near subway stations or universities.\n\nOne of the most typical take-out places is burger chains.\nMany people get the food to go when they go to these places.\nSome people use the drive thru to get their food.\nOther people use food delivery apps to order their food.\nIn fact, these apps have become the norm and they are all the rage these days.\n\nPersonally, when I go to these fast food chains, I know what to get in advance,\nbecause they have a pre-set menu.\n\nFor example, when I go to Burger King, I always order the Whopper combo.\nSo, this is what my favorite take-out restaurant is like."}, {"slide": 233, "text": "테이크아웃/ 배달음식점에서 최근에 음식을 사본 경험 묘사 (adv)\nTalk about the last time you used a take-out or delivery food service.\nWhat did you get and where was it?\nWhat do you remember about that experience?\n\n: I remember going to a fast food chain in the downtown area recently.\nI ordered a burger combo, which was one of their signature menus.\nI got a soft drink for the drink.\nI also got French fries and chicken nuggets as a side dish.\n\nI got the food to go and left the restaurant.\nWhen I came home, I started to eat the food.\nIn fact, the food tasted amazing because I was starving.\n\nThe French fries were so crispy.\nThe other side dishes were very tasty very well.\nI can still remember how good the food was.\nIt still stands out in my memory.\nThe only downside was that the food was very greasy and was high in calories.\n\nLooking back, it was a very enjoyable meal."}, {"slide": 234, "text": "배달음식점을 통해 특별한 행사준비, 경험묘사 (adv)\nTalk about a time when you used a take-out or a delivery service for a special occasion involving a large number of people. What was the occasion?\nWhat did you have to do to use the service? Tell me about that experience in as much detail as possible.\n\n: I remember having my grandmother’s birthday party at home.\nWe invited some relatives over for dinner.\n\nWe cooked some food and ordered in some Chinese food from a delivery restaurant.\nWe used a food delivery app to order delivery. These apps are very convenient.\nIt takes much less time and effort to order in.\nFirst, we can pay for the food directly on the app. Plus, the delivery address is already stored on the app. Also, the app tells you how long it will take.\n\nBefore we ate, I helped set up the table. And then, we all sat down and had dinner together.\nThe food was very tasty, and we had a lot of fun.\n\nWhen the guests left, I helped clean up. There were some leftovers, so I put them in the fridge.\nI also cleaned the table and did the dishes.\nAnd then, I started to clean my home. I opened all the windows to refresh the air.\nI also vacuumed and mopped the floors and dusted the furniture.\nPlus, I took out the trash and the recycling.\n\nSo, looking back, it was a memorable party."}, {"slide": 235, "text": "음식점 업계의 건강식 추세로의 변화 설명\n테이크 아웃/배달 음식점들의 건강 메뉴 추세 설명\nThere is a trend in the restaurant industry to offer healthier choices designed to attract the health-conscious consumer. What changes have you observed in this regard in recent years? Think about a country that is geographically close to your home country.\n음식점 업계와 외식 문화의 변화설명\nWhat kinds of changes in restaurants or eating out have you notices over the last few years? How was eating out different?\nWhat has brought about some of these changes?\n\n: Well, I think busy people do not always have time to cook themselves.\nSo, they eat out or order in more often, especially during the work week.\nMeanwhile, people have become much more health-conscious than in the past.\nSo, they think about their health when they go out to eat or order delivery.\nThey prefer foods that is healthy for them.\nFor example, many people like to have salads these days.\nThey are much healthier because they are mostly vegetables.\nVeggies are rich in vitamins, minerals and fiber. They are very nutritious.\nPersonally, I also have salads for lunch from time to time.\nWell, due to this trend, many restaurants have developed healthy menus.\nPeople like to go to these places that serve healthier food options.\nSo, restaurant food has changed a lot over the years.\nIt has become a lot better than in the past."}, {"slide": 236, "text": "음식점 체인점과 지역 음식점의 고객 경험 차이 설명\nThe advantages of chain restaurants such as McDonald’s is that the consumer knows what to expect in terms of menu, prices, etc. Are there certain advantages to small, local restaurants? How would you compare the two in terms of the overall experience each provides?\n\n: When I go to chain restaurants, I know what to get in advance,\nbecause they have a preset menu.\nFor example, when I go to Burger King.\nI normally order a Whopper combo, which is one of their signature menus.\nI get a soft drink or a milkshake for the drink.\nI sometimes get French fries or onion rings as a side dish.\nI sometimes order chicken nuggets, chicken wings, chicken tenders or drumsticks.\nI sometimes get biscuits or ice cream.\n\nOn the other hand, when I go to small local restaurants, I do not know what to get.\nThat’s because they do not have a pre-set menu.\nI have to look at the menu carefully to see what to get.\nIf I do not know what to order, I ask for help.\n\nSo, this is the biggest difference between chain restaurants and local restaurants."}, {"slide": 237, "text": "사람들과 음식점에 대해 언급하는 요소 설명\nWhen your friends or family discuss restaurants they like or dislike.\nWhat are some of the characteristics they discuss the most?\nHow do these characteristics affect their dining experiences?\n\n: When it comes to restaurants, my friends and I talked about the taste the most.\nWe like to dine at restaurants that serve tasty food.\n\nWe often search online to find decent restaurant or hot places.\nPlus, we talked about the mood.\nThe atmosphere helps us enjoy the meal.\nAlso, we discuss the price.\nWe like to get great deals when we go out to eat.\n\nNext, we talk about things such as the location and the service.\nWe also talked about how clean the restaurant is.\nWe also talk about parking availability.\n\nSo, these are the things we talk about when it comes to restaurants.\n\n-These are all I can talk about this question. (this topic)"}, {"slide": 238, "text": "테이크 아웃/배달 음식의 트랜드 변화 설명\nWhat are the latest trends people are talking about related to take-out or delivery food options?\nPerhaps, it has to do with ordering online or an app, or it has to do with some kinds of new offerings. Discuss the changes that you have observed recently regarding take-out or delivery food options.\n\n: There are tons of delivery restaurants in Korea.\nIt is safe to say that almost all places offer delivery services.\nPeople use food delivery apps to order in these days.\nOrdering in has become a lot easier than in the past.\nThese apps have become the norm and they are all the rage.\nThere are tons of menus on these apps, there are a lot of options to choose from.\n\nSometimes, it is hard to pick because there are so many menus.\nI have a trouble choosing a menu quite often myself.\nThese apps are very easy to use and I think that is why so many people use them.\n\nPeople can pay for the food directly on the app.\nThere are also photo reviews by other customers you can look at.\nThe delivery address is also stored on the app.\nThe app also tells you how long it will take, which is very useful.\n\nPlus, especially these days, because of COVID-19, it is not safe to go to restaurants.\nInstead, people prefer to order delivery using these apps.\nIn fact, the number of food delivery orders has risen sharply in the last year.\nHowever, there is one problem, which is the trash created by disposables.\n\n### Notes:"}], "aliases": ["Restaurant"]}, {"key": "Gathering", "label_ko": "모임", "label_en": "Gathering", "scripts": [{"slide": 247, "text": "본인이 사는 지역에 진행되는 모임들 묘사 (Int) * (집에 친구 초대)\nTell me about some of the gatherings or celebrations that happen at where you live.\n\n본인 지역 사람들이 주로 가는 파티를 하는 장소 묘사 (int) *\nWhere do people usually have celebrations or parties in the area where you live or work? Is it at someone’s home, or a park, or somewhere else? Tell me everything about that place in as much detail as you can.\n\n: People often have gatherings, celebrations or parties at bars or restaurants.\nFirst, they typically have social gatherings.\n\nWhen they get together, they grab some drinks with their friends.\nDrinks break the ice and loosen up the mood.\nThey also sometimes play drinking games while they drink.\n\nMany companies have staff-dinners at bars or restaurants as well.\nIt is a great chance to bond with their co- workers.\nThey can get closer after they have some drinks together.\n\nNext, people go to bars for special occasions such as birthday parties and celebration for promotions and year-end party. (end of year party, welcome parties, farewell parties.)\nI think drinks spice up the mood at these events.\n\nSo, these are the gatherings or parties people have at bars."}, {"slide": 248, "text": "우리나라 주요 휴일 설명 (휴일: 전통명절) NEW\nPick a major holiday that people celebrate in your country.\nWhat do people do to celebrate the holiday? Where do they go?\nWho do they spend time with? Tell me as much as you can.\n\n: There are two big family holidays in Korea.\nOne is the Lunar New Year’s, and the other is the Korean Thanksgiving holidays.\nPeople get several days off to celebrate these occasions.\n\nIt is a tradition for family members to get together during these holidays.\nMany people visit their hometowns or family back home.\nPeople typically visit their parents, grandparents, or other relatives.\n\nWhen they gather, they cook holiday food and enjoy meals together.\nThey ask how each other is doing and do some catching up.\n\nMeanwhile, exchanging gifts is a big part of family holidays.\nPeople exchange gift boxes or fruit baskets. They sometimes offer money gifts as well.\n\nThere are many long-time traditions and customs for these occasions.\nThey have been passed down for many generations.\n\nFirst, people dress up in traditional outfits.\nThey are called 한복 and they are very colorful and pretty.\nPlus, remembering our ancestors is a big part of family holidays.\nThere are traditional memorials that take place. This is called 차례.\nPeople also visit their ancestors’ graves to pay their respects. This is called 성묘."}, {"slide": 249, "text": "모임에서 있었던 일들 묘사\nTell me about a gathering or a celebration that was held in the area in which you live. Describe where the gathering was held. Who was there. What the purpose of the gathering was, and what happened from beginning to end.\n\n: My friend and I had a gathering a few weeks ago.\nWe got together for dinner.\nMy favorite food is Italian food, so we went to an Italian restaurant.\nIt was a well-known restaurant in town.\n\nWhen we got there, we first decide where to sit.\nAnd then, we looked at the menu and decided what to get.\nWe ordered several dishes including a combo menu.\nAnd when the food came out, we started to eat.\nThe main dish and the side dishes were very tasty.\nI think the food tasted extra good because I was starving.\n\nThe pasta and pizza were tasty and the stake was very juicy and tender.\nI also liked the sauce and the seasoning on the food as well. It tasted really good.\nWe also grabbed some drinks while having the meal. We had some beer.\nThe drinks went very well with the food.\n\nLooking Back, it was a very enjoyable dinner.\nI was very happy with the meal I had there.\nI look forward to going there again if I have the chance."}, {"slide": 250, "text": "본인이 참석했던 모임 에피소드 묘사 (지갑을 두고 온 것)\nSometimes when people get together for celebration or gatherings, unexpected things can happen. Tell me all about something unexpected that happened at a celebration or a gathering in the area where you live. Tell me what happened from beginning to end.\n\n최근에 본인이 갔던 휴일 파티에서 했던 일 묘사\nTell me about the last holiday party or celebration that you attended. Give me lots of details about what happened. Who was there and what you did from beginning to end.\n\n: I remember when I had a bad stomachache after eating something at a gathering.\nI think I ate too much because I was so hungry.\nI got indigestion, and it was pretty bad.\n\nMy stomach was upset, and I felt like throwing up.\nI also had a fever and felt light-headed.\nI tried to find some medicine but could not find any.\n\nSo, I went to the drug store to get some medicine.\nI told the pharmacist about my symptoms.\nHe gave me something that would make me feel better.\n\nI came back home and took some medicine to get better.\nI had to stay inside and get plenty of rest.\nSince then, I try to be more careful when I eat something."}, {"slide": 251, "text": "본인이 파티 준비를 도와준 경험 묘사\nTell me about a time when you helped prepare for a party or a celebration. Perhaps you helped invite people, or you helped decorate, or get the food or drinks. Tell me about this experience from the beginning to the end in detail.\n\n: I remember having a family gathering at home.\nWe invited some relatives over for dinner.\n\nWe cooked some food and ordered in some Chinese food from a delivery restaurant.\nWe used a food delivery app to order delivery. These apps are very convenient.\nIt takes much less time and effort to order in.\nFirst, we can pay for the food directly on the app. Plus, the delivery address is already stored on the app. Also, the app tells you how long it will take.\n\nBefore we ate, I helped set up the table.\nAnd then, we all sat down and had dinner together.\nThe food was very tasty, and we had a lot of fun.\n\nWhen the guests left, I helped clean up.\nThere were some leftovers, so I put them in the fridge.\nI also cleaned the table and did the dishes.\nAnd then, I started to clean my home. I opened all the windows to refresh the air.\nI also vacuumed and mopped the floors and dusted the furniture.\nPlus, I took out the trash and the recycling.\n\nSo, looking back, it was a memorable party."}, {"slide": 252, "text": "어렸을 때 모임/ 기념일과 요즘 행사들 비교\nHow have celebration and gatherings in your country changed since when you were a child? Are there more of these events now then before?\nWhat sorts of events are more popular today than in the past?\n\n: Frankly, gatherings and celebrations have not changed that much over the years.\n First, people typically have social gatherings.\n\nWhen they get together, they grab some drinks with their friends.\nDrinks break the ice and loosen up the mood.\nThey also sometimes play drinking games while they drink.\n\nMany companies have staff-dinners at bars or restaurants as well.\nIt is a great chance to bond with their co- workers.\nThey can get closer after they have some drinks together.\n\nNext, people go to bars for special occasions such as birthday parties and celebration for promotions and year-end party. (end of year party, welcome parties, farewell parties.)\nI think drinks spice up the mood at these events.\n\nHowever, these days, it was not safe to have large gatherings due to the coronavirus."}, {"slide": 253, "text": "특정 행사 준비 관련해서 사람들이 논의했던 이슈설명\nCelebrations and gatherings are important to people living in a city or town. However, a lot of work, organization and money go into putting one of these events together. Was there a discussion among people related to organizing an event recently? What was the issue or difficulty people were discussing?\n\n: I remember seeing some people who were organizing a birthday party recently.\nFirst, they were talking about the venue and the date.\nThey wanted to decide the best time and place for the party.\n\nAlso, they were discussing the cost.\nThey wanted to fix the budget for the event.\n\nPlus, they were talking about who to invite to the party.\nThey also talked about how to invite them.\nThey also talked about how many people were coming.\n\nSo, these were the issue the organizers were discussing about the event."}, {"slide": 254, "text": "작은 마을과 대도시 간 모임비교\nGatherings and celebrations in small towns are often different from those in big cities. Tell me about some of the similarities and differences between the celebrations people have in small towns and in big cities in your country.\n\n: Frankly, gatherings are pretty much the same wherever you are.\nIt does not matter if you live in a big city or a small town.\nFirst, people typically have social gatherings.\nWhen they get together, they grab some drinks with their friends.\nDrinks break the ice and loosen up the mood.\nThey also sometimes play drinking games while they drink.\n\nMany companies have staff-dinners at bars or restaurants as well.\nIt is a great chance to bond with their co- workers.\nThey can get closer after they have some drinks together.\n\nNext, people go to bars for special occasions such as birthday parties and celebration for promotions and year-end party. (end of year party, welcome parties, farewell parties.)\nI think drinks spice up the mood at these events.\n\nHowever, these days, it was not safe to have large gatherings due to the coronavirus."}, {"slide": 255, "text": "모임 관련 사람들이 갖고 있는 우려 설명\nWhat kinds of concerns do you hear people express when they have gatherings and celebrations in your area? Do people complain about traffic, parking, noise, garbage or other problems? What do people in your area say about such celebration.\n\n: One of the biggest concerns is safety when it comes to gatherings.\nThese days, It is not safe to have gatherings due to the coronavirus.\nIn fact, the epicenter of the virus was the Chinese city of Wuhan.\nHowever, it spread to at least 210 other countries.\nThe situation was especially bad in the US and Europe.\nThere were more than 200 million confirmed cases worldwide, and the global death toll went over 4 million and is still rising.\nMeanwhile the virus also spread widely in Korea.\nThe government declared a national health emergency.\nThere were strong quarantine measures for suspected patients in the initial stages.\nThe spread was curbed early in Korea thanks to active testing and contact tracing.\nBut even so, over 220,000 people got infected and tested positive.\nThe coronavirus outbreak had major ripple effects globally. The virus also took a huge toll on businesses as many of them had to close down. Stock markets around the world and the global economy also took a big hit.\nThat being said, I hope that the coronavirus dies off eventually, so that everything could come back to normal."}, {"slide": 256, "text": "모임 관련 사람들이 갖고 있는 우려 설명 II – NEW \nWhat kinds of concerns do you hear people express when they have gatherings and celebrations in your area? Do people complain about traffic, parking, noise, garbage or other problems? What do people in your area say about such celebration.\n\n: One of the biggest concerns is overdrinking when it comes to gatherings.\nDrinking is fine if you drink moderately.\nHowever, people sometimes drink too much and get drunk.\n\nBad things could happen when this happens.\nFirst, people could make embarrassing mistakes.\nThey could also fall asleep at odd places.\nPlus, they could also cause trouble and noise.\nThey could even get into fights.\n\nWorse things can happen when people get wasted.\nPeople could get into accidents.\nThey could also get hurt or get injured.\nThey could also lose something important.\nPlus, they could have a terrible hangover and get sick the next day.\n\nSo, I think one of the biggest concerns is overdrinking at gatherings.\nPeople should always drink in moderation when they get together for drinks."}], "aliases": ["Gathering"]}, {"key": "vacation at home", "label_ko": "집에서 보내는 휴가", "label_en": "vacation at home", "scripts": [{"slide": 269, "text": "On my vacation\nDuring my vacation at home\nMeet up with my close friends\nHang out with my friends\nTouch base\nDo some catching up                             work more productively\nOver some drinks                                  spend some quality time\nKnow how they are doing                       with their loved ones\nAsk how each other is doing                    need some downtime\nCrucial                                                look back on their lives\nGet some time off                                 make their future plans\nGet some rest\nGet burned out\nregain their energy\nMutual friends\nCommon interest"}, {"slide": 270, "text": "집에서 보내는 휴가 중 만나고 싶은 사람 묘사 (int)\nYou indicated in the survey that you stay at home for vacations.\nWho are the people you would like to see and spend time with on your vacation?\n\n: I have not seen some of my close friends for a long time,\nbecause we were busy with our own lives.\nSo, I really want to know how they are doing.\n\nPlus, we’ve been staying at home a lot because of the coronavirus.\nWe have been practicing social distancing.\n\nI want to get together with my friends on my next vacation.\nI really miss them and hope to see them any time soon.\n\nSo, I want to hang out with my friends on my vacation."}, {"slide": 271, "text": "휴가 때 만나는 사람들과 하고 싶은 일들 묘사 *\nDescribe some of the things that you would like to do with people you visit or see during your vacation.\n\n: During my vacation, I want to spend some time with my friends or family.\nI want to do a lot of catching up with them.\n\nWe could talk about our careers or our work.\nWe could also talk about economy or the job market.\nWe could also talk about our family members or our mutual friends.\n\nUm.. what else?\nI also want to talk about some activities we enjoyed recently.\nFor example, we could talk about movies we watched.\nWe could also talk about some restaurants we went to.\nAlso, we could talk about trips we went on.\n\nI also want to go to decent restaurant and have a nice meal.\nAnd it would be nice if I can go see a movie with my friends.\n\nSo, this is what I want to do with my friends and family."}, {"slide": 272, "text": "지난번 휴가 때 했던 일들 자세히 묘사 (adv)\nDescribe exactly what you did during the last vacation that you spent at home.\nGive me a description from the first to the last day of all the people you saw and everything that you did.\n\n: My friends and I had a gathering on my last vacation.\nMy favorite food is Italian food, so we went to an Italian restaurant.\nIt was a well-known restaurant in town.\n\nWe ordered some main dishes and some side dishes.\nThe main dish was very tasty.\nThe pork in the dish was so juicy and tender.\nAnd the sauce was sweet and savory.\nWe also had some drinks while having the meal.\n\nLooking back, it was an enjoyable dinner."}, {"slide": 273, "text": "집에서 보내는 휴가 중에 기억에 남는 경험 묘사\nCould you tell me about an unusual, unexpected, or satisfying experience you had while at home on vacations?\nTell me all the details of that experience. What happened? Who was involved? And why was this experience so memorable?\n\n: I remember/ when I had a bad stomachache (during my vacation at home.)\nI think I ate too much because I was so hungry.\nI got indigestion, and it was pretty bad.\n\nMy stomach was upset, and I felt like throwing up.\nI also had a fever and felt light-headed.\nI tried to find some medicine but could not find any.\n\nSo, I went to the drug store to get some medicine.\nI told the pharmacist about my symptoms.\nHe gave me something that would make me feel better.\n\nI came back home and took some medicine to get better.\nI had to stay inside and get plenty of rest.\nSince then, I try to be more careful/ when I eat something."}, {"slide": 274, "text": "사람들이 휴가를 보내는 방법 과거 현재 비교 I (NEW)\nYou indicated in the survey that you stay at home for vacations.\nHow do most people spend their vacations in your country?\nHow does that compare to the way people spent their vacations when you were growing up? Are they doing things differently? How have things changed and why have things changed?\nPlease take a minute to discuss this topic.\n\n: Frankly, the way people spend vacations at home is pretty much the same.\nIt has not changed that much.\n\nPeople normally meet up with their close friends on their vacations.\nThey ask how each other is doing and so some catching up.\n\nFirst, people often talk about their career.\nThey talk about how things are going at work.\nThey also talk about the economy or the job market in general.\n\nAlso, people often talk about other people.\nThey also talk about people they are seeing or their mutual friends.\n\nUm.. what else? People also talk about what they have been up to recently.\nThey talk about movies they watched recently.\nThey also talk about decent restaurants or fancy bars they went to.\nPlus, they talk about gatherings they went to.\nThey also talk about trips they went on.\nThey could also talk about hobbies, sports, entertainment, politics or music.\n\nSo, these are the things people do on their vacations."}, {"slide": 275, "text": "사람들이 휴가를 보내는 방법 과거 현재 비교 II\nYou indicated in the survey that you stay at home for vacations.\nHow do most people spend their vacations in your country?\nHow does that compare to the way people spent their vacations when you were growing up? Are they doing things differently? How have things changed and why have things changed? Please take a minute to discuss this topic.\n\n: The way people spend vacations has changed a lot over the past year.\nIn the past, people used to do a lot of outdoor activities or go on trips.\nBut these days, It is not safe to go outside because of the coronavirus.\nIn fact, the virus has had a huge impact on our daily lives.\nFirst, we had to minimize person to person contact.\nPeople were told to avoid crowded places such as bars, clubs and karaokes.\nIn fact, businesses were forced to shut down when the number of new cases spiked.\n\nNext, many companies made their staff work from home.\nWork meetings took place through video conferences, using programs like zoom.\nThis changed the work environment fundamentally.\n\nAlso, schools had to make necessary changes as well.\nIn-school classes were postponed or had to be stopped sometimes, and students had to take remote video classes from home.\nPlus, more people are shopping online more often for even things like groceries.\nMost importantly, people were asked to clean their hands well as often as they could.\nPlus, everyone was told to wear masks in public.\nHand sanitizers were set up in almost all places, including elevators.\n\nIn the end, the coronavirus changed out lives drastically and some changes will never come back to normal."}, {"slide": 276, "text": "휴가가 중요하다고 생각하는 이유 설명\nExperts state that vacations are important for every individual.\nTake a minute and report for me the important benefits of vacation times to a person’s\nhealth, relationships and personal growth.\n\n: I think vacations are very important in many ways.\nPeople need to get some time off for their health, relationships and personal growth.\n\nFirst, vacations are crucial for people’s health.\nPeople need to get some rest. If they continue to work without vacations, they can get burned out. People can take a breather and recharge during a vacation.\nAfter that, they can work more productively.\n\nNext, vacations are important for relationships.\nPeople need to spend some quality time with their loved ones.\nVacations are the best way to do that.\nPeople can do hobbies or go on trips together.\n\nPlus, vacations are important for personal growth as well.\nPeople need some downtime to look back on their lives.\nThey can think about their careers and make future plans.\nThey can also learn something new or study a foreign language.\nIn other words, they can do things related to self-improvement.\n\nOnce again, I think vacations are very important for these reasons."}], "aliases": ["Vacation at Home"]}, {"key": "internet", "label_ko": "인터넷", "label_en": "internet", "scripts": [{"slide": 277, "text": "사람들이 주로 인터넷으로 하는 일들 묘사 (int)\nWhat do people you know, friend and family et cetera usually do on the internet?\nDo they use the internet for work, playing games, watching television, etc?\nWhat do people you know usually do online?\n\n: People do various types of things on the internet these days.\nFirst, they often play online games, which are very popular these days.\n\nThey sometimes shop online for various types of things.\nThey often buy things such as books, clothes, shoes or tickets.\n\nPeople also do online banking quite often.\nMobile banking is very convenient because there is no need to go to an actual bank. People can also do banking whenever they want to.\n\nAlso people sometimes take online courses or check emails on the internet.\n\nThese days, many people do stuff on social media such as Facebook, Instagram or YouTube.\nThey post pictures or video clips and leave comments or replies.\n\nSo, these are the things people do online."}, {"slide": 278, "text": "본인이 인터넷상에서 습관적으로 하는 일들 묘사\nWhat are your usual habits when you are online?\nDo you usually share videos, do you shop, read the news, etc?\nWhat do you usually do online?\n\n본인이 반복적으로 인터넷상에서 하는 일들 묘사\nTell me about your typical routine online. What do you do?\nTell me about your online activities.\n\n: I can get access to the internet on my phone, so I can surf the internet whenever I want to.\nI can also surf the internet when I am on the move.\nFirst, I do online searches most often. I search for many kinds of things such as restaurants, cafes or movie times. I also do searches for things such as books or clothes.\nI also do a lot of searches before I go on trips.\nPlus, I chat with friends or family on messaging apps.\nI think I do that every single day. We typically ask how each other is doing.\n\nWhat else? I also listen to music on streaming sites. These streaming services are very convenient in many ways. They have thousands of songs and it is very easy to search for music.\nThe best thing about them is that people can make their own playlists.\nThey can also see the lyrics or information about the song on the screen.\nThey can also listen to the same song over and over again.\nPlus, the sound quality has become much better than in the past.\nSo, these are the things I do on the internet."}, {"slide": 279, "text": "본인이 가장 좋아하는 웹사이트를 묘사하고 좋아하는 이유 설명 (int)\nTell me about your favorite website or type of website you visit.\nWhy do you like it? Give me as many details as you can.\n\n본인이 인터넷에서 주로 보는 동영상 묘사 (int)\nWhat kinds of videos do you like to watch online for fun, for work or for school?\nTell me about the kinds of videos you like to watch online.\n\n: My favorite website is YouTube.\nThere are tons of video clips that are posted on that site every day.\n\nVideo clips have become much better than in the past.\nThey are very fun to watch and entertaining.\nSome clips are very addictive and I can not stop watching them.\n\nPersonally, I just watch whatever is fun.\nI watch news clips, music videos, or movie trailers most often.\nI also watch comedy clips, sports clips or TV show clips on and off.\nI also have several YouTube channels I am subscribed to.\nMy favorite channel is a food channel.\nI get regular update when there are new postings.\n\nPlus, I take online courses or remote video classes from time to time.\nThey are very helpful and informative.\nI can save a lot of time by learning things
