on the internet.\nPlus, they are much safer because you can take classes at home.\n\nSo, these are the video clips I watch online."}, {"slide": 280, "text": "본인이 초창기 인터넷 서핑 경험 묘사 (adv) *\nWhen did you first become interested in surfing the internet?\nTell me about your first experience or experiences of surfing the internet in great detail.\nWhat were your first impressions of it? What do you remember about it?\n인터넷 서핑과 초창기와 지금 비교 #14\nHow has surfing the internet changed since you first began doing it?\nWhat is similar and what are some of the differences?\n\n: When I first surfed the internet, the connection was very slow.\nIt took a long time to log on to websites.\nI used to get access to the internet on my computer.\nSo I always needed a computer to get internet access.\n\nBut now, things are a lot better. We have come a long way.\nNow, I can surf the internet on my smartphone when I am on the move.\n\nIn fact, mobile internet has become a lot faster over the years.\n5G networks have become commercialized and are amazingly fast.\n\nPlus, there is free wi-fi at many public places such as coffee shops or schools.\nMost households also have wireless routers.\nMany people also use unlimited phone plans.\n\nMobile internet has definitely become the norm.\nMany online services have become mobile-friendly.\n\nSo, internet surfing has become much easier than in the past."}, {"slide": 281, "text": "리서치를 해야 했던 프로젝트에서 인터넷을 활용한 방법 설명 (Adv)\nTell me about a project that you worked on that involved doing research on the internet. Start with giving me some background about the project. When and where it was. And then, tell me how you used the internet to get the project done.\n\n: I remember doing a project at work a few months ago.\nI had to write a report for the project.\n\nI surfed the internet and did a lot of searches.\nI found some background information and some statistics.\nI gathered the data and put them in my report.\n\nThe report became better because there was a lot of information in it.\nIt was worth the time and effort.\n\nSo, surfing the internet was very helpful when I was doing my project."}, {"slide": 282, "text": "인터넷 서핑 중 기억에 남는 게시물 설명 * I (recycling, food poisoning etc 뉴스 가능)\nWe all have things that we remember on the internet.\nTalk about the memorable things that you have seen on the internet.\nWhy were they memorable?\n\n: I remember watching the news about the coronavirus outbreak.\nIt was about a third wave of infections.\nThere were large clusters of community infections here and there.\nAnd.. Hundreds of new(many) confirmed cases were reported each day.\n\nSo, these days, it is not safe to gather with people.\nThere is a high risk of getting infected.\n\nThe good news is that some coronavirus vaccines have been approved,\nbut we have to wait to have them available for the general public.\n\nAnd.. the virus also took a huge toll on businesses, and some companies had to shut down. Stock markets around the world also took a big hit.\n\nSo, I watched a news about the coronavirus on the internet."}, {"slide": 283, "text": "인터넷 서핑 중 기억에 남는 게시물 설명 * II\nWe all have things that we remember on the internet.\nTalk about the memorable things that you have seen on the internet.\nWhy were they memorable?\n\n: I remember watching my favorite youtuber’s (star) trip story to Thailand on YouTube.\nDuring her trip, she had a bad stomachache.\nShe ate too much because she was so hungry.\nShe got indigestion, and she felt pretty bad.\n\nShe also had a fever and felt light-headed.\nShe tried to find some medicine but could not find any.\n\nSo, she went to the drug store to get some medicine.\nShe told the pharmacist about her symptoms.\nHowever, she had a hard time explaining symptoms in English.\nFinally, the pharmacist gave her something that would make her feel better.\n\nShe had to stay inside and get plenty of rest.\nAfter watching the clip, I study English very hard."}, {"slide": 284, "text": "본인이 어제 인터넷으로 했던 일들 묘사 (adv)\nTell me all about what you did online yesterday for work, school, or fun?\nHow did you get online? What website did you visit and what did you look at?\nTell me about the things you did online yesterday.\n\n: I did various types of things on the internet yesterday.\n\nFirst, I played online games, which are very popular these days.\nI also shopped online for various types of things.\nI bought some things such as books, clothes and snacks.\n\nI also transferred money to my sister. Mobile banking is very convenient because\nthere is no need to go to an actual bank.\n\nI took online courses and checked emails from work.\n\nBefore I went to bed, I did some stuff on social media such as\nFacebook, Instagram or YouTube.\nI love to post pictures or video clips and leave comments.\n\nSo these were the things I did yesterday."}, {"slide": 285, "text": "인터넷 관련 사람들의 우려 설명\nWhat kinds of concerns do people have about internet use regarding security, privacy or safety? How have these concerns changed over the times?\nPlease discuss this in more detail.\n\n인터넷 관련 사람들의 우려나 문제점 설명\nWhat kinds of problems or concerns do people have concerning the internet?\nGive me some background on one of these issues. Why is this problem of concern or interest to people who surf the internet?\n\n: One of the biggest concerns on the internet is security.\nIt has become a major issue and is a big challenge for the IT industry.\nHackers have become much better at hacking.\nPersonal information has been hacked quite often.\nSuch information can violate people’s privacy.\nIt can also be used for crimes such as identity theft, voice phishing or fraud.\nThe Facebook incident in 2018 was a good example of a massive security breach.\nThe personal information of 50 million users was hacked.\nThe hacking incident had ripple effects across the board.\nIt raised awareness of the importance of security issues online.\nOnce again, internet security is a major concern in this day and age.\nWe have to make more efforts to enhance online security."}, {"slide": 286, "text": "사람들의 연령별 인터넷 이용 차이점 설명\nHow does internet usage vary among people of different age groups from old to young?\nWhy do they use this internet? What do they do online?\nPlease discuss this in more detail.\n\n: The younger generation are much more tech-savvy than the older generations.\nThey are a lot more active and creative on the internet.\nPlus, younger people get access to the internet on their phones more often.\n\nIn fact, mobile internet has become a lot faster over the years.\n5G networks have become commercialized and are amazingly fast.\n\nPlus, there is free wi-fi at many public places such as coffee shops or schools.\nMost households also have wireless routers.\nMany people also use unlimited phone plans.\n\nMobile internet has definitely become the norm.\nMany online services have become mobile-friendly.\n\nOn the other hand, the older generations are less tech-savvy.\nThey surf the internet on their computers more often.\nThey do use their phones to surf the internet, but it is limited to a small number of activities.\nSo, these are the differences between the younger and the older generations."}], "aliases": ["Internet"]}, {"key": "phone/technology", "label_ko": "전화기/기술", "label_en": "phone/technology", "scripts": [{"slide": 292, "text": "우리나라 사람들이 보편적으로 사용하는 기술 묘사 (int)\nWhat kind of technology do people typically use in your country?\nDo people use computers, cell phones, or hand-held devices?\nWhat are some common forms of technology that people have?\n\n: The most typical type of technology people use in my country is smartphones.\n\nPeople do various type of things on their phones these days because they can get access to the internet.\n\nPlus, they sometimes shop online for many types of things.\nThey buy things such as books, clothes, shoes, or tickets.\nAll you have to do is to pick and choose an item on your computer or phone.\nYou can pay for it instantly and the goods are delivered to your home.\nAlso, there are a lot of options to choose from, so you can get great deals.\n\nPeople also do online banking quite often.\nMobile banking is very convenient because you don’t have to go to an actual bank.\nSo, people can do banking whenever they want to.\n\nAlso, people sometime check email on the internet.\n\nUm.. what else?\nSome people like to use social media such as Facebook, Instagram, Twitter or YouTube.\nThey like to post up pictures or video clips.\nThey also write messages and leave comments.\n\nSo, this is what people do on their smartphone."}, {"slide": 293, "text": "본인 전화기의 가장 좋아하는 기능 묘사 (int)\nWhat do you like most about your phone?\nDo you like the camera? Do you like a certain application?\nDo you like a game that is on your phone?\nTell me why you like that feature?\n\n본인이 매일 가장 자주 사용하는 기술 묘사 (int)\nTell me about a piece of technology that you use every day.\nWhat kind of things do you use it for?\n\n: The piece of technology I use most often in my life is my smartphone.\nAnd the internet is my favorite feature.\nI do a lot of things on the internet every day.\n\nI think I do online searches most often.\nI do searches for restaurants, cafes or movie times.\nI also do searches for books or clothes.\nI also do a lot of searches before I go on trips.\n\nPlus, I chat with friends on messaging apps.\nI think I do that every single day.\nWe usually ask how each other is doing.\n\nWhat else? I also listen to music on streaming sites.\nThese streaming services are very convenient in many ways.\nThey have thousands of songs and it is very easy to search for music.\nThe best thing about them is that people can make their own playlists.\nThey can also see the lyrics or information about the song on the screen.\nThey can also listen to the same song over and over again.\nPlus, the sound quality has become much better than in the past.\nSo, these are the things I do on my phone."}, {"slide": 294, "text": "전화 통화 외에 전화기로 주로 하는 일 묘사 (int)\nWhat do you and your friends do on your phones besides talking to each other over the phone?\nDo you make updates on your social media pages? Do you play games?\nTell me what you typically do on your phone?\n\n: Besides making phone calls, I usually listen to music on my cell phone.\nI always carry around my phone, so I can listen to music wherever I am.\n\nI also use streaming sites to listen to music these days.\nThey have thousands of songs and it is very easy to search for music.\nThe best thing about them is that people can make their own playlists.\nThey can also see lyrics or information about the song on the screen.\nThey can also listen to the same song over and over again.\n\nI think I listen to music most often when I am on the move.\nFor example, I listen to music on the subway or the bus.\nI also listen to music in the car when I am driving.\nPlus, I listen to music when I am walking down the street.\n\nAnd..I listen to music when I am working out, because I can focus on my workout.\nI also listen to music when I am working or studying, because I can concentrate on what I am doing.\nPlus, I listen to music when I am doing housework.\nI also listen to music before I go to sleep.\n\nPlus, I have some music on/ when I feel down or gloomy.\nAlso, I turn some music on/ when I am bored or do not have anything else to do.\n\nSo, I listen to music whenever I want to."}, {"slide": 295, "text": "본인이 썼던 첫 전화기와 지금 전화기 비교 (adv)\nTell me about the first phone you used. How was it?\nHow was it different from the phone you are using now?\n어렸을 때 사용했던 휴대전화와 지금 휴대전화 비교 #14\nHow have cell phones changed over the years? What were they like when you were younger? How were they different from phones today? And how have these changes affected people's ability to stay connected with other people?\n\n특정 기술의 과거 현재 비교 (adv)\nTechnology had definitely changed over time. Tell me about an early memory that you have about a piece of technology. It could be a computer or a mobile phone from many years ago.\nDescribe for me what this thing was like back then. How has that technology changed over time?\n\n: My first cell phone was just a regular phone.\nI was able to just make phone calls and send text messages, but that was it.\nPlus, my first phone was quite heavy and bulky.\n\nHowever, cell phones have come a long way.\nThey are now called smartphones and they have become the norm.\nI can surf the internet on my phone.\nSo, I can do almost everything on my phone.\n\nMobile internet has become a lot faster over the years.\n5G networks have become commercialized and are amazingly fast.\nThere is free wi-fi at many public places such as coffee shops and schools.\nMany people also use unlimited phone plans.\n\nThe latest smartphones have become faster, lighter and thinner\nso they are easier to carry around.\n\nOnce again, smartphones have made a world of difference in our lives."}, {"slide": 296, "text": "본인이 전화기 사용 중 겪었던 문제 설명 (adv)\nSome features and services on phones are easy to use. But you may have to get help from friends, family or the service providers for certain features, battery problems or other phone services. Tell me about a time when you had a problem using your phone. What was the problem and how did you deal with the situation?\n\n어떤 기술에 문제가 있어서 본인이 겪은 불편 묘사 (adv)\nProblems often come up because of our dependence on technology.\nThink about a time when you experienced a problem because some piece of technology was not working properly. Maybe your computer crashed or maybe your cell phone had no service.\nTell me about a time when you had some kind of problem getting your technology to work.\n\n: I remember having several problems with my phone over the years.\nAmong them, one of the most common problems is the phone battery.\nI use my phone all day long, so it runs out of battery quite often.\n\nOnce my phone died when I was outside.\nit was very inconvenient because my phone was dead.\nI had to check some messages, but I could not.\nI also wanted to do some online searches, but I could not.\nIt was very frustrating. I regretted not having charged my phone properly.\n\nEventually, I charged my phone after I got home.\nSince then, I sometimes carry around my charger or my battery pack.\nIt is a bit of a hassle but I have no choice.\n\nI wish phone batteries would last longer."}, {"slide": 297, "text": "친구들과 전화 통화 주제 묘사 (int)\nTell me about the kinds of things you and your friends talk about on the phone.\n\n: Well, I talk about tons of things with my friends over the phone.\n\nWe could talk about our careers or our work.\nWe could also talk about economy or the job market.\nWe could also talk about our family members or our mutual friends.\n\nUm.. what else?\nI also want to talk about some activities we enjoyed recently.\nFor example, we could talk about movies we watched.\nWe could also talk about some restaurants we went to.\nAlso, we could talk about trips we went on.\n\nSo, this is what we talk about over the phone."}, {"slide": 298, "text": "본인의 전화 통화 습관 묘사 (상대, 시점, 통화 길이, 함께 하는 일) (int)\nI’d like to know about your routine of talking on the phone.\nWho do you talk with, when do you usually talk on the phone and how long do you talk for?\nDo you do other things at the same time when you are on the phone?\n\n: I talk to many kinds of people over the phone.\nI call my family members, friends or co-workers.\nSome calls are personal, while others are work-related.\n\nI normally make calls when I am indoors.\nBut now, I use a cell phone, so I often make calls when I am on the move.\n\nFor example, I make calls on the subway or the bus.\nI also make phone calls in the car when I am driving.\nPlus, I can also make calls when I am walking down the street.\n\nAnd…I make phone calls when I am working out.\nPlus, I make phone calls when I am doing housework.\nI also make calls before I go to sleep.\nIt is very convenient if I use my earphone when I talk on the phone.\n\nPlus, I make calls when I feel down or gloomy.\nTalking with someone over the phone makes me feel better.\n\nSo, I can now make phone calls wherever I am, whenever I need to."}, {"slide": 299, "text": "본인의 지금 전화기 기종 선택 이유 설명\nHow did you choose the phone that you currently use?\nHow did you hear about it? Did you do research? Tell me everything you can remember about your experience of choosing your phone from beginning to end.\n\n: I used to use Galaxy 10 but now I use Galaxy 21 .\nThere are few reasons I choose the model.\n\nFirst of all, I liked the color and design.\n\nI also wanted to have a larger screen and also the phone has a good camera features.\nI also wanted a battery that lasted longer and a bigger memory.\n\nPlus, one of my friend from Samsung, recommended this phone for me.\nPlus, there was a good promotion and I got a great deal on my phone.\n\nI like the phone I'm using now.\n\nIt was the worth money I spent."}, {"slide": 300, "text": "본인 기억에 남는 전화 통화 설명\nCan you tell me about a memorable phone conversation you had using your phone?\nMaybe your friend or your relative told you some exciting news.\nMaybe something funny happened while you were on the phone.\nTell me about that story from beginning to end with lots of details about why it was so memorable.\n본인이 전화기를 사용하여 검색한 국내외 이슈 설명\nMany people use their phones to find out about current events in their countries. They can find information about everything from their favorite sports teams to what is happening in their country and around the world. Tell me about something that happened in your country or abroad. Tell me what electronic device you used, what happened from beginning to end, and why what happened was so memorable.\n\n: I remember doing searches about the COVID-19 quite often on my phone.\nI also talked to friends over the phone about the virus as well.\nThe virus spread widely in Korea in the initial stages.\nThe Korean government was quick to declare a national health emergency.\nStrong quarantine and social distancing measures were put in place.\nPlus, a massive number of test kits were produced, and testing stations were set up all across the nation.\nKorea was also the first to introduce drive-thru and walk-thru testing sites.\nThanks to active testing, the spread was curbed early in Korea.\nThe number of new cases dropped to below 50 a day.\n\nHowever, in early-December, there was a third wave of infections which was the worst.\nThere were large clusters of community infections here and there.\nAnd.. hundreds of new confirmed cases were reported each day.\n\nSo, these days, it is not safe to gather with people because there is a high risk of getting infected.\n\nThe virus also took a huge toll on businesses, and some companies had to shut down.\nStock markets around the world also took a big hit.\n\nThat is relatively lower number compared to the case numbers in other countries."}, {"slide": 301, "text": "사람들의 휴대전화 이용 방식 5년 전과 지금 비교 (17-5)\nDescribe how people used cell phones 5 years ago. What could they do with their phone functions and applications? What are some of the biggest changes as to how people use their phones? Describe the phone you used to use in the past in detail.\n\n휴대전화를 통한 정보검색 과거와 현재 비교\nWe can use phones to do more now than before, like finding traveling directions, reading restaurant reviews, and doing other information searches. Describe how using a phone to find information has changed from the time you first started using phones until now.\n\n: Cell phones in the past were smart phones.\nHowever, the internet connection was quite slow.\nPeople did online searches or checked the news on their phones, but that was it.\nBut these days, mobile internet has become a lot faster.\n5G networks have become commercialized and they are amazingly fast.\nPlus, there is free wi-fi at many public places such as coffee shops.\nMany households also have wireless routers.\nMany people also use unlimited phone plans.\nSo, people do various types of things on their phones now.\nFirst, they chat with other people on messaging apps.\nPlus, they stream music and watch video clips on YouTube.\nAlso, they post things on social media such as Facebook or Instagram.\nNext, they play online games and take online courses.\nThey also watch movies or TV shows of Netflix or Disney Plus.\nPlus, they do a lot of shopping on online shopping malls.\nAlso, they order in food using food delivery apps.\nNext, they also use their phones to learn thing by taking online courses.\nSo, people use their phones to do tons of things now."}, {"slide": 302, "text": "사람들이 언급하는 휴대전화 사용 관련 문제점 설명  \nWhat kinds of concerns or problems come up when people discuss the use of cell phones? Give me some background on this problem.\nWhy are these issues of Interest or concerns to people?\n\n젊은이들의 휴대전화 과다사용 부작용 설명\nIn some societies, there is a concern that young people are not developing face-to-face communication skills because they spend too much time on their phones. What do people in your country think about the way in which young people use their phones?\n\n: The youngsters are addicted to their phones.\nThey just can not put them down.\nThey constantly chat with friends on messaging apps.\nThey also post things or leave messages on social media very frequently.\n\nMeanwhile, there are many side effects coming from too much phone use.\nFirst, there are physical side effects.\nPeople’s eyesight gets worse because they stare into a small screen for too long.\nTheir eyes also get very dry and they have to use eye-drops.\nSome people also suffer from back problems, neck problems or shoulder pain because of bad posture.\nNext, there are social side effects. Because people are constantly on their phones, they have less conversations with other people. They cannot develop face-to face communication skills as much as they used to. Many people are concerned about this problem. Once again, phone addiction has become a major issue among youngsters."}], "aliases": ["Phone", "Technology"]}, {"key": "industry", "label_ko": "산업", "label_en": "industry", "scripts": [{"slide": 313, "text": "우리나라에 잘 알려진 산업분야 묘사 (adv)\nTell me about one industry in your country that is well-known. You can talk about any industry. Pick one industry and tell me all about it such as entertainment, technology, automotive industry or other Industries.\n\n: One of the rising Industries in Korea is the cell phone industry.\n\nThe first-generation cell phones were just regular phones.\nPeople were able to just make phone calls and send text messages, but that was it.\nHowever cell phones have become a lot better than in the past.\nThey are now called smart phones and they have become the norm.\n\nPeople can surf the Internet on their phones now.\nSo they can do almost everything on their phones.\n\nPlus the latest smartphone models have become faster, lighter and thinner.\nThey are easier to use and carry around.\n\nSo, the cell phone industry is one of the most promising Industries in Korea."}, {"slide": 314, "text": "방금 언급한 산업에서 잘 알려진 저명한 기업 묘사  (int)\nCan you tell me about one promising or famous company in this particular industry? Tell me how the company started, and all the things that have happened made it become so well-known.\n\n: Korea is an IT Powerhouse.\n\nMany Korean tech companies such as Samsung and LG are market leaders in the global IT industry.\n\nSome product lines Korean companies are leading are smartphones,\nsemiconductors and display panels. (These companies are the leaders for smartphones, semiconductors and display panels.)\n\nThey take up a large market share of the global market.\n\nMeanwhile, Korea has a small domestic market, so it heavily depends on exports.\nIn other words, it is an export-driven economy.\n(They have bigger numbers in exports than domestic markets.)\n\nThese IT products are some of the main export items of our country.\n\nSo, tech companies like Samsung and LG play a big role in Korea's economy."}, {"slide": 315, "text": "방금 언급한 기업의 성공 과정과 난관 극복 과정 설명 (adv)\nWhen this company introduced its most important products, were they successful right away? Describe to me the challenges this company faced and how the company was able to succeed. Tell me in as much detail as you can.\n\n: Korean tech company Samsung has grown tremendously over the years.\nNow, it is one of the largest companies in the world.\nThere are some key reasons that made the company so successful.\nFirst it has made timely investments in research and development.\nAs a result, it has a technological advantage over its competitors.\nNext, the company’s workforce is some of the best brains in the field.\nIn fact, many companies benchmark Samsung for its business practices.\nMeanwhile, the company faces many challenges as well.\nIt heavily depends on its exports.\nSo, if the global economy slows down, the company’s sales volume drops sharply. Plus, the company has to deal with competition coming from its rivals.\nDespite these challenges, Samsung is very likely to thrive in the future."}, {"slide": 316, "text": "방금 언급한 기업의 성공 과정과 난관 극복 과정 설명 (easy version)\nWhen this company introduced its most important products, were they successful right away? Describe to me the challenges this company faced and how the company was able to succeed.\nTell me in as much detail as you can.\n\n: Korean tech company Samsung has grown a lot over the years.\nNow, it is one of the largest companies in the world.\n\nThere are some key reasons for the success of the company.\nFirst, it has invested for R&D.(Research and Development)\n\nNext, the company’s workforce is the best brains in the field.\nIn fact, many companies benchmark Samsung.\n\nMeanwhile, the company faces many hard problems as well.\nIf the global economy slows down, the sales volume drops (goes down) sharply.\n\nPlus, the company has to compete with its rivals.\n\nEven with these challenges, Samsung has a bright future in this industry."}, {"slide": 317, "text": "요즘 젊은이들이 들어가고 싶어 하는 기업들 묘사(Int)\nWhat are some of the companies that young people want to work for these days?\nwhy do young people want to work for these companies?\n\n: Many Korean youngsters want to work for tech companies.\n\nKorea is an IT powerhouse.\nKorean tech companies such as Samsung and LG are market leaders in the global IT industry.\nThey are well known for products like smartphones, and semiconductors.\nAnd.. they take up a large market share of the global market.\n\nMeanwhile, Korea has a small domestic market, and its economy is dependent on exports.\n\nSo, tech companies play a big role in Korea’s economy, and this is why Korean youngsters want to work for tech companies.\n\nWelfare : 복지 Big companies like Samsung offer nice welfare and high income.\nSalary : 급여\nIncome/annual income : 연봉"}, {"slide": 318, "text": "사람들이 매력을 느끼는 기업 혹은 산업 묘사 (adv)\nDescribe a company or industry in your country that is attractive to workers.\nWhen did this company or industry start?\nHow has it become successful?\nwhat has made this company or industry so attractive to workers?\n\n: An attractive industry to workers is the cell phone industry.\nCell phones have come a long way.\nThey have made a world of difference in our lives.\n\nCell phones 5 years ago were smartphones.\nHowever, the internet connection was quite slow.\nPeople did online searches or checked the news on their phones, but that was it.\n\nBut these days, mobile internet has become a lot faster.\n5G networks have become commercialized and they are amazingly fast.\nPlus, there is free wi-fi at many public places such as coffee shops.\nMost households also have wireless routers.\nMany people also use unlimited phone plans.\n\nSo, people do various types of things on their phones now.\nFirst, they chat with other people on messaging apps.\nPlus, they stream music and watch video clips on YouTube.\nAlso, they post things on social media such as Facebook or Instagram.\nNext, they play online games and take online courses.\n\nSo, people use their smartphones to do tons of things now."}, {"slide": 319, "text": "본인 진로를 위해 한 노력들 묘사 (adv) – 과거시제\nWhat kinds of efforts have you made for your career in the past?\nTell me about some individual efforts that you have made for your career.\n\n사람들이 자신의 진로를 위해 하는 노력들 묘사- 현재시제\nWhat do people usually do to prepare for their future careers? How do they learn about the different types of Industries and how do they get ready to apply for those jobs?\n\n사람들이 자신 커리어를 위해 하는 노력, 5년 전과 비교 \nHow do people prepare for future work in your country＇s Industries? Do they get general education first or receive specific training once they join the company? Do they receive specific job training from a young age?\nHow has the process changed over the past five years? Give me all the details.\n\n: What people do for their careers has not changed that much over the years. - 사람들이 자신 커리어를 위해 하는 노력, 5년 전과 비교\nPeople(I) do(did) various things for their career.\nFirst, they go to college to get their degrees.\nThey majored in a certain area of study.\nThey sometimes go to grad school to get a Master’s or PhD.\nThey think about what they want to do with their lives in school.\n\nAfter graduating, they have to study a lot to get a job.\nThey write their resumes and cover letters.\nThey also prepare for written tests and job interviews.\nThey also do internships at companies.\nThey also got some certificates related to their fields.\n\nPlus, they also try to improve their English.\nThey also go to a language schools to learn English.\nThey also take online courses or remote video classes for English tests.\n\nSo, I guess these were the things people do for their careers.\n\nCertification, license : 자격증"}, {"slide": 320, "text": "그 산업의 혜택과 우리 삶에 주는 도움 설명 (int)\nHow did this industry help you in your life?\nTell me about what this industry does and how you use its products or services.\n\n: Cell phones have come a long way.\nPeople can do a lot of things on their phones now.\n\nFirst, they can play online games, and they are very popular these days.\nThey can do some online shopping.\nThey can buy things such as books, clothes, shoes or tickets.\n\nPeople can also do online banking.\nMobile banking is very convenient, because you don’t have to go to an actual bank.\nSo, people can do banking whenever they want to.\n\nAlso, they can check email on the internet whenever they need.\nSome people like to use social media such as Facebook, Instagram or YouTube.\nThey like to post pictures or video clips.\nThey also write messages and leave comments.\n\nSo, people can do tons of things on their phones now."}, {"slide": 321, "text": "본인이 관심 갖고 있는 업계 최근 근황, 3년 전과 비교 I (smart phone)\nCan you tell me about an industry that you follow? Maybe you are interested in the food industry, energy, mobile computing, or another industry.\nWhat was this industry like 3 years ago? How has it changed since then?\n\n우리나라 사람들이 관심을 갖는 산업 분야 설명\nWhat is an industry or a company that people in your country are talking about nowadays? Tell me why people are interested in this industry and what they are saying about it. Give me lots of details.\n\n: I follow the cell phone industry quite closely.\nCell phones have come a long way.\nThey have made a world of difference in our lives.\n\nCell phones three years ago were smart phones.\nHowever, the internet connection was quite slow.\nPeople did online searches or checked the news on their phones, but that was it.\n\nBut these days, mobile internet has become a lot faster.\n5G networks have become commercialized and they are amazingly fast.\nPlus, there is free wi-fi at many public places such as coffee shops.\nMost households also have wireless routers.\nMany people also use unlimited phone plans.\n\nSo, people do various types of things on their phones now.\nFirst, They constantly chat with other people on messaging apps.\nPlus, they stream music and watch video clips on YouTube.\nAlso, they post things on social media such as Facebook or Instagram.\nNext, they play online games and take online courses.\n\nSo, people use their smartphones to do tons of things now."}, {"slide": 322, "text": "본인이 관심 갖고 있는 업계 최근 근황, 3년 전과 비교 II (consumer electronics)\nCan you tell me about an industry that you follow? Maybe you are interested in the food industry, energy, mobile computing, or another industry.\nWhat was this industry like 3 years ago? How has it changed since then?\n\n우리나라 사람들이 관심을 갖는 산업 분야 설명\nWhat is an industry or a company that people in your country are talking about nowadays? Tell me why people are interested in this industry and what they are saying about it. Give me lots of details.\n\n: Well, Koreans are very interested in the tech industry.\nIn fact, Korea is a global leader when it comes to consumer electronics.\nSome Korean electronics companies like Samsung and LG are very well-known.\nProducts made by these companies are world-class.\nThey are very popular and are exported all around the world.\nKorean companies have a high market share in the global electronics market.\nTheir best products are home appliances such as TVs, air-conditioners and air-purifiers.\nThey also make top-class washers, dryers and dry-cleaning clothes.\nThey also make kitchen appliances like fridges, microwaves, rice cookers and air-fryers.\nAside from these products, they also manufacture smartphones and display panels.\nThey also produce batteries and semiconductors.\nIn fact, Korean companies is at the top in terms of memory chips.\n\nMeanwhile, Korea has a small domestic market, so it heavily depends on exports.\nIn other words, it is an export-driven economy. (They have bigger numbers in exports than domestic markets.)\nElectronic products are some of the main export items of Korea.\nSo, tech companies like Samsung like Samsung and LG play a big role in Korea’s economy."}, {"slide": 323, "text": "그 관심 업계에서 기대에 못 미친 상품/ 서비스 묘사 I (phone battery)\nTell me about a time when a product did not meet the expectations of the public. Maybe the gaming industry produced a new video game platform that did not perform well or a new smartphone or software program had problems when it was first released. Tell me all about what happened in detail and describe the reactions of the public and the industry to that issue.\n\n: Cell phones have come a long way.\nThey have made a world of difference in our lives.\n\nHowever, there are still some problems with the newest models.\nAmong them, one of the most common problems is the phone battery.\n\nPeople use their phones all day long, so they run out of battery quite often.\nAs a result, their phones die quite often when they are outside.\nIt is very inconvenient and frustrating when this happens.\nThey want to check some messages, but they cannot.\nSo, many people carry around their chargers or battery packs.\n\nOnce again, phone batteries have yet to meet the expectations of the public."}, {"slide": 324, "text": "그 관심 업계에서 기대에 못 미친 상품/ 서비스 묘사 II (vacuum cleaners)\nTell me about a time when a product did not meet the expectations of the public. Maybe the gaming industry produced a new video game platform that did not perform well or a new smartphone or software program had problems when it was first released. Tell me all about what happened in detail and describe the reactions of the public and the industry to that issue.\n\n: I think vacuum cleaners are one of the most useful home appliances.\nBack in the day, we used to sweep and floors with a broom.\nIt took a long time to clean the floors.\nBut now we use vacuum cleaners to clean the floors.\nThey suck up the dust very easily and cleaning the floors is a breeze now.\nWe just need to change the dust bag in the vacuum from time to time.\nThere are wireless vacuum cleaners these days.\nThey are more convenient because you do not have to plug them in.\nThere are no wires, so they do not get tangled up.\nEven better, there are now robotic vacuum cleaners that clean the floors themselves.\nFrankly, the first-generation models were not that good. They did not do a good job.\nHowever, the new models are much better than in the earlier ones.\nThey are really high-tech and have definitely come a long way.\nThey can be controlled by an application and you can get status updates.\nThey even come back to the charger by themselves.\nSome models even have a mop pads on them as well.\nThey sweep the dust and mop the floors at the same time.\nSo, vacuum cleaners have changed the way we clean the floors.\nCleaning our homes has become a lot easier than in the past."}], "aliases": ["Industry"]}, {"key": "weather", "label_ko": "날씨", "label_en": "weather", "scripts": [{"slide": 328, "text": "우리나라 날씨와 계절묘사\nTell me about the weather in your country. Are there different seasons?\nWhat is the weather typically like?\n\n: Korea has four distinct seasons spring, summer, fall, and winter.\n\nThe weather is very nice in spring and fall.\nThe temperatures are mild and it is great for outdoor activities.\nPeople like to go hiking or camping and go on picnics during these seasons.\nThey also do a lot of outdoor sports such as soccer, basketball or tennis.\n\nBut, summer is very hot. It is also humid and sticky, and people sweat a lot.\nWe have the rainy season in summer.\n\nOn the other hand, winter is freezing cold, and we get a lot of snow in winter.\nWe need to bundle up /to keep ourselves warm/ when we go outside.\nWe get a lot of snow in winter. It is very slippery/ when it snows.\n\nOnce again, there are four distinct seasons in Korea."}, {"slide": 329, "text": "오늘의 날씨 상태 묘사 (int)\nTell me about the weather at where you are today. What is happening right now?\n\nSummer :\nIt is summer in Korea right now.\nThe weather today is very sunny and we have clear skies.\nThe temperature is very hot.\nIt is also very humid and people are sweating a lot.\nThe weather seems to be getting hotter and hotter every day.\nThe weather forecast says it is going to get hotter next week.\n\nWinter :\nIt is mid-winter here in Korea right now. (early, late)\nIt is freezing cold especially in the mornings and evenings.\nThe weather today is very sunny and we have clear skies.\n(It is snowing outside right now)\nThe weather seems to be getting colder and colder every day.\nAnd…soon it will be late winter.\nThe weather forecast says it is going to get colder next week."}, {"slide": 330, "text": "어렸을 때 날씨와 최근 날씨 비교\nHow has the weather in your country change over time? What was the weather typically like when you were a child? How was the weather different from the weather today?\n\n: We still have four distinct seasons in Korea.\n\nHowever summer has been getting hotter and hotter every year.\n(summer is hotter these days)\n\nIt is a lot hotter compared to when I was a kid.\nI remember having a hard time 3years ago in summer because it was unbearably hot.\nIt was much hotter than I had expected.\nThe daytime highs reached 40 degrees Celsius in some areas.\nIt was also very hot at night because it did nor cool off.\nIn fact, it was the hottest summer in Korean history.\n\nLast year, many countries had record-breaking summer weather as well.\nEveryone seemed to be carrying around portable fans to beat the heat.\n\nOnce again, I think summer seems to be getting hotter and hotter every year.\n\n* Global warming : 지구 온난화"}, {"slide": 331, "text": "극단적 날씨 관련 경험 묘사 - 여름 장마, 산불\nSevere weather can often cause serious problems. Tell me about an experience you had when the weather created some kind of problems. Maybe roads were flooded, maybe schools and businesses were closed due to snow or cold weather conditions.\nTell me about an experience you had when severe weather created some kind of problem. Give me lots of details.\n\n: As I mentioned, Korea has a rainy season every summer.\nThis year, the rainy season lasted for more than a month.\n\nAnd…I remember watching many news reports about it.\nThere was heavy rainfall all across the country.\nAlso, there were floods, so many areas went underwater.\nPlus, there were landslides all over the nation.\n\nThese natural disasters caused a lot of damage.\nUnfortunately, some people got injured and some lost their lives.\nAnd…it took a very long time to recover from all the damage.\n\nSo, this was the experience I had with severe weather."}], "aliases": ["Weather"]}, {"key": "transportation", "label_ko": "교통", "label_en": "transportation", "scripts": [{"slide": 335, "text": "우리나라의 교통수단 묘사 (int)\nTell me about how people typically get around in your country.\nDo people drive their own cars or do they use trains or buses?\nWhat are some typical or means of transportation?\n\n: People get around in many ways in Korea.\n\nIn general, it is easy to move around, because public transportation is very well-organized.\nPeople take the bus and subways on a daily basis.\nThey also take trains and planes for trips.\n\nMany people drive their own cars.\nDuring rush hours, traffic gets very bad with many cars.\nPeople often stuck in traffic for a long time.\n\nAlso, parking in Korea can also be a headache since there are not enough parking spaces.\n\nSo, people use public transportation or drive their own cars to get around."}, {"slide": 336, "text": "본인이 자주 이용하는 교통수단 (int)\nWhat means of transportation do you use to get around?\nDo you drive or take public transportation?\n\n: I personally take the subway most often.\nI always do that when I go to work. It is really convenient.\n\nSometimes, I take the bus depending on where I am going.\nIt is one of the cheapest ways to get around.\n\nI sometimes take a taxi when I am in a rush.\nThese days, I use a taxi app called kakao T.\nIt is much easier to get a cab if I use that app.\nI can pay the taxi fare directly on the app, so it saves me the trouble of paying in person.\n\nAnd I also drive my car.\nDriving is the most convenient because I can go wherever I want to.\n\nSo, I use public transportation or drive to get around."}, {"slide": 337, "text": "어렸을 때의 교통수단 묘사 (adv) *\nHow did you travel when you were a child?\nWere the types of Transportation different back then? Describe for me how people used to get around in your city or town.\n\n: Transportation has become a lot better compared to when I was a kid.\nIt has come a long way.\n\nFor example, in the past, trains used to be slower.\nBut now, they have become faster.\nThat’s because there are now bullet trains.\nSo, it takes less time to travel long distance.\n\nAlso in the past, plane tickets used to be very pricey.\nBut now, plane tickets have become cheaper.\n\nAlso, it was hard to get a cab(taxi) in the past.\nBut you can call a cab(taxi) easily by using mobile apps now.\n\nSo, transportation has become better over the years."}, {"slide": 338, "text": "교통편 사용 중 본인이 겪은 문제 설명 (adv)\nProblems often arise related to transportation. Cars break down, trains run late, or there are traffic jams. Tell me about a transportation problem that you once faced. Tell me everything that happened and what you did to deal with the situation.\n\n: I remember when I was stuck in traffic for a long time during the holidays.\n\nCars were not moving at all because traffic was bumper to bumper.\nI was heading to my grandmother’s place.\n\nBecause of the heavy traffic, it took me much longer than usual.\nIt took almost three hours longer to get to my destination.\n\nI felt exhausted because I was in the car for too long.\nI even got carsick and felt light-headed.\n\nSince then, I try to head out early during the holiday."}], "aliases": ["Transportation"]}, {"key": "fashion", "label_ko": "패션", "label_en": "fashion", "scripts": [{"slide": 352, "text": "우리나라 사람들의 패션묘사 (int)\nWhat kinds of clothes do people in your country typically wear?\nThere are different clothes for work and for play? Tell me about the clothes in your country.\n\n: Koreans like to follow the latest fashion trends.\nThey are very stylish and tend to dress well.\n\nFor work, they dress formally.\nMany people wear suits when they go to work.\n\nOn the other hand, for play, they dress casually.\nMany people wear comfortable clothes when they go out with friends.\n\nMeanwhile, Korea has four distinct seasons: spring, summer, fall and winter.\nPeople wear different clothes for each season, so fashion styles are seasonal.\n\nSo, I think people in my country are quite fashionable."}, {"slide": 353, "text": "본인이 좋아하는 옷과 패션 스타일 묘사 (int)\nWhat kinds of clothes do you like to wear personally?\nWhat are you wearing today? What kind of fashion style do you like ?\nGive me all the details about your fashion style.\n\n: I like to follow my own style when it comes to fashion.\nI just wear things that look good on me.\n\nOf course, I wear suitable clothes for the weather.\nIn summer, I like to dress light because it is very hot and humid.\nI also like to wear brighter colors in summer.\n\nOn the other hand, in winter, I have to dress warm because it is freezing cold.\n\nIt is good to bundle up to keep myself warm.\nI also like to wear darker colors in winter.\n\nWhen it comes to fashion style, I guess I am not that fashionable.\nHowever, I pay attention to detail when I dress up for special occasions such as weddings, funerals, dates or job interviews.\n\nclosing이 생각나지 않거나 마무리가 깔끔하게 되지 않을 경우,\n**** These are all I can say about (my fashion style.)"}, {"slide": 354, "text": "어렸을 때 유행했던 패션과 지금 패션 비교 (adv)\nFashion is always changing. Tell me about the kinds of clothes that were popular when you were younger. What did the Styles look like? How are they different from what is popular now?\n\n: When I was a kid, fashion styles were not that stylish.\nThe clothes were a bit old-fashioned.\n\nHowever, fashion styles have come a long way.\nThese days, I think they are more sophisticated.\n\nPeople are exposed to new fashion trends.\nThat’s because there are lots of fashion tips on the internet.\nThere are also many online shopping malls where people can shop clothes.\nThere are even fashion channels on TV or on YouTube.\n\nSo, I think people have become a lot more fashionable.\nPeople’s fashion styles are more sophisticated than in the past."}, {"slide": 355, "text": "본인이 평소 옷을 사러 갈 때 하는 일들 묘사 (int)\nWhat do you do when you go to buy new clothes? Where do you go? Who do you go with? Tell me everything about what you do when you buy new clothes.\n\n: On a typical shopping day, I first decide what to buy.\nI also think about where to go.\n\nI make sure to dress light and wear comfortable shoes\nbecause I have to walk around a lot.\n\nWhen I get to the shopping mall, I first look around and do some window shopping.\nAnd then, I compare prices and try things on.\n\nWhen I find something I want to buy, I pay for it.\nI usually pay with my credit card or debit card.\nI rarely pay in cash these days.\n\nSo, this is what I do when I go to buy new clothes."}, {"slide": 356, "text": "본인의 쇼핑 습관/장소 묘사 (int)\nWhat do you do when you go shopping?\nWhere do you go in what do you look for?\nTell me about your typical shopping habits in detail.\n\n: In the past, I always had to go to actual stores to buy things.\nI used to shop at various locations such as department stores, discount stores, shopping malls or grocery stores.\nBut now, I shop online very often as well. It has become the norm.\n\nOnline shopping is very convenient in many ways.\nThat’s because you don’t need to go to actual stores.\n\nAll you have to do is to pick and choose an item on your computer or phone.\nYou can pay for it instantly and the goods are delivered to your home.\n\nIt takes less time and effort to buy things on the internet.\n\nI get electronics, clothes, shoes, books or tickets on the internet most often.\nPlus, I sometimes buy food, groceries or skincare products online as well.\nI also buy dog supplies, cat supplies, health products and baby products online.\n\nSo, I shop online quite often."}, {"slide": 357, "text": "최근에 옷 사러 갔던 본인 경험, 겪은 문제 묘사\nTell me about the last time you bought a new piece of clothing. What did you need and where did you find it? Were there any challenges or problems?\nGive me all the details.\n\n: I remember shopping for some running shoes a few weeks ago.\nI found a pair of shoes I really liked at a store.\nBut the store did not have my size because they were sold-out.\nI could not buy the shoes I wanted, so I had to buy another one instead.\n\nPlus, I remember getting a shirt online.\nBut when I tried it on at home, it did not fit well.\nIt was too big and too long.\nSo, I sent it back to get an exchange.\n\nAnd I once bought a jacket at a store.\nHowever, when I saw it again at home, it did not look good on me.\nSo, I went back to get a refund.\n\nSo, these were the problem I have had."}], "aliases": ["Fashion"]}, {"key": "bank", "label_ko": "은행", "label_en": "bank", "scripts": [{"slide": 358, "text": "우리나라 보편적인 은행들 묘사 (int)\nTell me about the banks in your country. What do they typically look like? Where are they usually located?\n\n: There are so many banks in Korea.\nThey are everywhere these days.\n\nMany banks are on busy streets with a lot of foot traffic.\nThey are concentrated near subway stations or universities.\n\nWhen you walk into a bank, there are ATMs where you can get cash.\nYou can also see tellers sitting at the counters.\nThere are usually chairs where customers can sit and wait.\n\nNormally, there is also a security guard on duty.\nPlus, there are screens on the walls that show the exchange rates for foreign currencies.\nSo, this is what banks are like in Korea."}, {"slide": 359, "text": "본인이 은행에 가서 하는 업무 묘사 (int)\nI check if I have everything I need before going to banks,\nTell me about the kind of things you usually do when you go to the bank.\n\n: When I go to banks, I first pull out a number and wait for my turn.\nWhen they call my number, I go up to the teller and take care of my business.\n\nI open a new account from time to time.\nI sometimes open a savings account.\nI check the interest rate when I do that.\n\nSometimes, I check my balance or make wire transfers most often.\nI also deposit or withdraw money in and out of my account.\n\nUm…what else? I sometimes exchange currency before I go on trips overseas.\nI also get a loan when I need money.\nPlus, I sometimes pay utility bills or traffic tickets.\nI also get a new card issued whenever I need to.\n\nSo, this is what I do when I go to banks."}, {"slide": 360, "text": "어렸을 때 은행과 지금 은행과의 비교 (adv)\nBanks have definitely changed over time. Tell me about a bank you remember from your childhood. What was the bank like?  How was it different from banks today?\n\n: Well, to be honest, I do not remember how banks were when I was a kid.\nIt was a long time ago, so my memory is unclear.\n\nHowever, I do remember one thing clearly.\n\nOne thing I remember is that I had to go to actual banks to do banking.\n\nBut these days, I can do mobile banking on my phone whenever I need to.\nI can take care of banking chores wherever I am.\nI can even do that when I am on the move.\nSo, I can save a lot of time by doing mobile banking.\n\nTo do mobile banking, I need some passwords, and that’s all I need.\nSo, I think mobile banking is very convenient.\n\nSo, mobile banking is one of the biggest changes that has happened to banks.\nBanking has definitely become a lot easier than in the past."}, {"slide": 361, "text": "은행 업무 관련 본인이 겪은 문제와 해결 방법 설명 (adv)\nSometimes, problems arise when dealing with the bank.\nTell me in detail about a problem you had that involved your bank.\nMaybe the bank was closed when you needed it to be open.\nMaybe the bank made some kind of mistake.\nTell me the story of a time when you had to solve a problem involving your bank.\n\n: I remember going to the bank to pay a bill.\nI think there were many people waiting at the bank.\nI think it was crowded because it was lunch time.\n\nI first pulled out a number from the machine, but there were 10 people waiting in front of me.\nI waited and waited, but it was still not my turn.\nI could not wait any longer, so I just had to leave the bank.\nIt was very frustrating.\n\nSince then, I try to avoid busy hours at the bank."}], "aliases": ["Bank"]}, {"key": "appointment", "label_ko": "예약", "label_en": "appointment", "scripts": [{"slide": 368, "text": "본인이 평소에 하는 예약 종류들 묘사 (int)- Repairing service\nPeople often have appointment for different things.\nTell me about the kinds of places you go for different appointments.\n\n: I think I make many kinds of appointments for different services in my life.\nFirst, I make doctor appointment when I am sick.\nWhen I go to the doctor, I get treatment and get some medicine prescribed.\nI sometimes get some tests done as well.\n\nNext, I make dentist appointments as well.\nI do that most often when I have a toothache.\nWhen that happens, I often have to get my cavities treated or get a root canal.\nOf course, I also go to the dentist to get regular check-ups or get my teeth cleaned.\nI have to make appointments for those dentists visits as well.\n\nWhat else? Oh, Yes! I make hair appointments when I need to get my hair done.\nI sometimes get a haircut or get a perm.\nI also get my hair dyed or get my roots done from time to time.\nI also get a hair treatment if I need to.\n\nOverall, I can save time by making appointments because I do not have to wait."}, {"slide": 369, "text": "본인이 평소에 예약을 하는 방법 구체적으로 묘사 (int)\nWhat kinds of things do you do when you make appointments? Tell me what you exactly do when you make these appointments.\n\n: When I have to make appointments, I first look for a phone number.\nSometimes, I have it on my phone.\nIf not, I look up on the internet.\n\nAnd then, I make a call to make an appointment.\nI ask them when they are available.\n\nI tell them when I want to come in and fix the time.\nI usually get a text message confirming my appointment.\n\nSo, this is what I do when I make appointments.\n\n갑자기 문장이 생각나지 않아 답변을 마무리 하지 못할경우,\n****I am sorry, that’s all I can think (of it) right now."}, {"slide": 370, "text": "본인이 어렸을 때 했던 예약 경험 묘사 (adv) – dentist appointment\nTell me about an appointment you remember from your childhood. Maybe you visited a doctor, the dentist, or a new school. Tell me about the place you went to for this appointment. What were your impressions? How did you feel?\n\n: I remember making a hair appointment when I was a kid.\n I needed to get a haircut.\n\nOn the day of the appointment, I went to the hair salon on time.\n\nFirst, they shampooed my hair.\nAnd then, the hair-stylist cut my hair.\nI also got a perm and I got my hair dyed.\n\nAfter that, they shampooed my hair again.\nThey also dried and styled my hair.\n\nMy hair-stylist did a good job.\nI was happy with my new look.\nIt was worth the money I spent."}, {"slide": 371, "text": "예약 관련 기억에 남는 본인 경험 설명 (adv)\nSometimes, funny or surprising things happen during an appointment. Tell me about an appointment that you remember for some reason. Tell me everything that happened and why this appointment was so memorable.\n\n: I remember making a hair appointment a few months ago.\n\nHowever, something urgent came up suddenly.\nI had to take care of something important.\n\nSo, I could not make it to my appointment.\nI called the hair salon told them that I could not go.\n\nEventually, I had to make a new appointment and went another time."}], "aliases": ["Appointment"]}, {"key": "free time", "label_ko": "자유시간", "label_en": "free time", "scripts": [{"slide": 379, "text": "우리나라 사람들이 자유시간에 가는 장소들 묘사 (int)\nTell me about some places people in your country like to spend their free time.\nDo they visit parks, beaches or other places? What are some popular free time locations?\n\n: Koreans do various types of outdoor activities in their free time.\n\nBecause there are many rivers and parks,\nPeople can get some exercises and get some fresh air there.\nSome people play sports such as basketball, baseball, soccer or badminton.\nAlso, There are people who come out with their families to have picnics.\n\npeople like to go hiking or camping in the mountains\nbecause there are many mountains.\nIn fact, camping has become the nom and is all the rage these days. Camping sites are crowded with people who enjoy camping.\n\nNext, there are many beaches, some people like to spend vacation on coastline.\n\nOnce again, people in my country do various types of outdoor activities."}, {"slide": 380, "text": "우리나라 사람들이 자유시간에 하는 일들 묘사 (adv)\nWhat do people in your country like to do in their free time?\nWhat are some popular free time activities?\n\n: People usually have gatherings at bars in their free time.\n\nThey typically have social gatherings at bars.\nWhen they get together, they grab some drinks with their friends.\nDrinks break the ice and loosen up the mood.\nThey sometimes play drinking games with the people they are with.\n\nSome People also have free time at home.\nAt home, they can relax by enjoying their hobbies and spending their free time with their family.\n\nNext, people go to bars for special occasions such as birthday parties.\nDrinks spice up the mood at these events.\n\nOnce again, people like to hang out with others at bars in their free time.\n\n*Like I mentioned before,  :  내가 전에 말했듯이"}, {"slide": 381, "text": "본인의 자유시간 과거 현재 비교 (adv)\nDo you have more or less free time now than you did in the past?\nDescribe for me how your free time has changed over time.\n\n: I do not think I had much free time when I was a kid.\nThat’s because my main responsibility was studying.\nI had to study day and night.\nThere were so many subjects to study, especially in high school.\n\nOn typical school days, I went to school early in the morning and came back home in the evening. It was not easy to take extra classes until late at night.\nI took some online classes for exams.\nI sometimes had to stay up all night to study for mid-terms and finals.\n\nBut now that I am an adult, I have more free time now.\nI can do whatever I want to in my free time.\nI try to enjoy myself to the fullest when I have free time.\n\nOnce again, I have more free time now compared to the past."}, {"slide": 382, "text": "최근 자유시간에 본인이 한 일 설명 (adv)\nTell me about the last time you had some free time.\nWhat did you do? Who did you spend your free time with?\nTell me everything that happened the last time you had some free time.\n\n: I remember going to a movie a few months ago.\nI went with my friends to a theater in the downtown area.\nBefore watching the movie, we did some shopping at some stores.\nWe bought a shirt, a jacket, a hat and some earrings.\nWe also had some coffee at a coffee shop.\n\nAfter watching the movie, we went to a decent Chinese restaurant.\nThey had the best Chinese food in town.\nThe food tasted extra good because I was starving. \nAnd the 마라탕 was so fresh and delicious.\nWe also ordered the various side dishes.\nPlus, we grabbed some drinks while having the meal.\nAnd I look forward to going there again.\nAfter dinner, we went to a bar to have some beer.\n\nLooking back, it was a very happy day."}, {"slide": 383, "text": ""}, {"slide": 384, "text": ""}], "aliases": ["Free Time"]}, {"key": "family/friend", "label_ko": "가족/친구", "label_en": "family/friend", "scripts": [{"slide": 391, "text": "자주 보는 가족/ 친구 묘사 (int) I\nCan you describe a friend or a family member you see often?\nWho is he or she? What is he or she like?\n\n: Okay, I would like to talk about one of my friends.\nShe is a cheerful and outgoing person with a warm personality.\n\nShe has big eyes and short black hair.\nShe has a great sense of humor. So she makes our time together enjoyable.\nAlso, she likes to participate in active pursuits .\n\nSo, my friend tries to work out as often as she can.\nShe tries to get some exercise at the gym.\nShe also tries to take walks at the park.\n\nSo, this is what my friend is like."}, {"slide": 392, "text": "자주 보는 가족/ 친구 묘사 (int) II\nCan you describe a friend or a family member you see often?\nWho is he or she? What is he or she like?\n\n방문하고 싶은 가족/ 친구 묘사 (int)\nTell me about a family or friends you like to visit?\nWho are these people? What are they like?\n\n가족/친구 2명 비교(유사점/차이점) #14\nDescribe two different friends or family members. Describe each in as much detail as you can.\nThen, tell me what similarities they have in common and what the differences between them are.\n\n: Let me tell you about my parents.\nMy mom and dad are similar in some ways.\nFirst, my parents are very family-oriented.\nThey like to have family gatherings. Plus, both of my parents are very active, so they like to do outdoor activities. They like to go hiking, play golf or go on trips.\nOn the other hand, my mom and dad are different in some ways. For example, my mom likes animals, but my dad does not. Plus, my dad likes drinking, but my mom does not. My parents also have different tastes for food. My dad likes meat, but my mom does not. She likes to have seafood instead.\nSo, my mom and dad have some similarities but also some differences.\n\nPuberty, adolescence : 사춘기\nNephew : 남자조카"}, {"slide": 393, "text": "가족/ 친구를 만나면 주로 하는 일들 묘사 (int)\nWhen you get together with friends or family.\nWhat kinds of things do you like to do together and why?\n가족/ 친구들을 만날 때 하는 대화 주제 설명#14\nWhen you get together with friends and family.\nWhat are some of the topics of interests that are discussed.\nWhy are these things of interest or concern?\nHow do these things affect their lives?\nPlease explain in as much detail as you can.\n\n: When I meet up with my friends and family, I usually do a lot of catching up.\n\nWe could talk about our careers or our work.\nWe also talk about people we are seeing or our marriage plans.\nWe talk about our family members or our mutual friends.\n\nUm.. what else?\nI also want to talk about some activities we enjoyed recently.\nFor example, we could talk about movies we watched and some restaurants we went to.\nAlso, we could talk about trips we went on.\n\nSo, this is what I do with my friends and family."}, {"slide": 394, "text": "가족/ 친구와 최근에 했던 일 묘사 (adv)\nTell me about the last time when you got together with your friends or family.\nWho was there and when was it? Tell me everything you did that day from beginning to end.\n\n: My friend and I had a gathering a few weeks ago.\nWe got together for dinner.\nMy favorite food is Italian food, so we went to an Italian restaurant.\nIt was a well-known restaurant in town.\n\nWhen we got there, we first decide where to sit.\nAnd then, we looked at the menu and decided what to get.\nWe ordered several dishes including a combo menu.\nAnd when the food came out, we started to eat.\nThe main dish and the side dishes were very tasty.\nI think the food tasted extra good because I was starving.\n\nThe pasta and pizza were tasty and the stake was very juicy and tender.\nI also liked the sauce and the seasoning on the food as well. It tasted really good.\nWe also grabbed some drinks while having the meal. We had some beer.\nThe drinks went very well with the food.\n\nLooking Back, it was a very enjoyable dinner.\nI was very happy with the meal I had there.\nI look forward to going there again if I have the chance."}, {"slide": 395, "text": "가족/ 친구와 보냈던 특별했던 이벤트 휴일 설명 (adv)\nCould you tell me about a special event or a holiday you celebrated with your family or friends? Tell me all about that event or the holiday from beginning to end.\n\n: I remember having a family gathering at home.\nWe invited some relatives over for dinner.\n\nWe cooked some food and ordered in some Chinese food from a delivery restaurant.\nWe used a food delivery app to order delivery. These apps are very convenient.\nIt takes much less time and effort to order in.\nFirst, we can pay for the food directly on the app. Plus, the delivery address is already stored on the app. Also, the app tells you how long it will take.\n\nBefore we ate, I helped set up the table.\nAnd then, we all sat down and had dinner together.\nThe food was very tasty, and we had a lot of fun.\n\nWhen the guests left, I helped clean up.\nThere were some leftovers, so I put them in the fridge.\nI also cleaned the table and did the dishes.\nAnd then, I started to clean my home. I opened all the windows to refresh the air.\nI also vacuumed and mopped the floors and dusted the furniture.\nPlus, I took out the trash and the recycling.\n\nSo, looking back, it was a memorable party."}, {"slide": 396, "text": "가족/친구의 집에 방문해서 하는 일들 묘사 (int) – 수다 (날씨/영화/코로나)\nTell me about visits to a friend’s or a family member’s house. What do you normally do when you go there?\n\n: When I visit a friend or a family member, I like to have a chat with them.\nWe talk about various types of topics such as the weather.\nIn fact, Korea has four distinct seasons : spring, summer, fall and winter.\nThe weather is very nice in spring and fall.\nThe temperatures are mild and it is great for outdoor activities.\nPeople like to go hiking or camping and go on picnics during these seasons.\nThey also do a lot of outdoor sports such as soccer, basketball or tennis.\n\nBut, summer is very hot. It is also humid and sticky, and people sweat a lot.\nWe have the rainy season in summer and it pours.\n\nOn the other hand, winter is freezing cold, and we get a lot of snow in winter.\nWe need to bundle up to keep ourselves warm when we go outside.\nWe get a lot of snow in winter. It is very slippery when it snows.\n\nOnce again, there are four distinct seasons in Korea."}, {"slide": 397, "text": "가족/친구의 집에 어렸을 때 방문했던 경험 묘사 (배탈) (adv)\nTalk about a visit to a friend or a family member in your childhood.\nWho did you visit and whom did you go with?\nWhat do you remember about that visit?\nWhat made the visit special?\n\n: I remember when I had a bad stomachache during my vacation.\nI visited my grandmother’s house and I ate too fast because I was so hungry.\nI got indigestion, and it was pretty bad.\n\nMy stomach was upset, and I felt like throwing up.\nI also had a fever and felt light-headed.\nI tried to find some medicine but could not find any.\n\nSo, I went to the drug store to get some medicine.\nI told the pharmacist about my symptoms.\nHe gave me something that would make me feel better.\n\nI came back home and took some medicine to get better.\nI had to stay inside and get plenty of rest.\nSince then, I try to be more careful when I eat something."}, {"slide": 398, "text": "가족/친구의 집에 최근에 방문했던 경험 묘사 (술) I\nTalk about a time when you visited a friend or a family member.\nWhat did you do when you visited them?\nWhat was memorable about that visit?\nTell me everything from beginning to end.\n\n: I remember going to my friend’s home recently.\n\nWe had dinner together and had some drinks.\nThe food and drinks tasted extra good because I was starving.\nHowever, I ended up drinking quite a lot that day.\n\nI got very drunk because I drank on an empty stomach and I drank too fast.\nI felt dizzy and I could not walk straight.\nThe next day, I had a terrible hangover and I felt miserable.\nMy stomach was upset and I felt like throwing up.\n\nI went to a drug store and got some hangover relief medication.\nIt took me quite a while to sober up.\n\nI had to take it easy for some time.\nSince then, I try to be more careful when I drink."}, {"slide": 399, "text": "가족/친구의 집에 최근에 방문했던 경험 묘사 (COVID-19) II\nTalk about a time when you visited a friend or a family member.\nWhat did you do when you visited them?\nWhat was memorable about that visit?\nTell me everything from beginning to end.\n\n: I had to stay home a lot this year.\n\nWe’ve been staying at home a lot because of the coronavirus.\nWe have been practicing social distancing.\n\nSo, I want to get together with my family on my next holidays.\nWe could do some catching up over some drinks.\nWe could also go to a decent restaurant and have a nice meal together.\nI also want to watch movies with my friends.\n\nSo, I hope to visit my family and my friends soon."}], "aliases": ["Family/Friend"]}, {"key": "holidays", "label_ko": "휴일", "label_en": "holidays", "scripts": [{"slide": 403, "text": "우리나라 사람들이 휴일을 보내는 장소/ 활동 묘사\nTell me about some popular holidays in your country.\nWhere do people typically celebrate their holidays?\nWhat kind of things do they use to celebrate?\n\n: There are two big family holidays in Korea.\nOne is the Lunar New Year’s, and the other is the Korean Thanksgiving holidays.\nPeople get several days off to celebrate these occasions.\n\nIt is a tradition for family members to get together during these holidays.\nMany people visit their hometowns or family.\nPeople typically visit their parents, grandparents, or other relatives.\n\nWhen they gather, they cook holiday food and enjoy meals together.\nThey ask how each other is doing and do some catching up.\n\nMeanwhile, exchanging gifts is a big part of family holidays.\nPeople exchange gift boxes or fruit baskets.\n\nSo, these are the two biggest family holidays in Korea.\n\n### Notes:"}, {"slide": 404, "text": "위에 언급한 휴일에 사람들이 하는 일들 상세 묘사\nChoose one of the holiday you just told me about.\nTell me all of the things people typically do to celebrate this holiday.\nWhat activities are involved?\n\n: As I mentioned, Korean Thanksgiving is a big family holiday in our country.\nThere are many long-time traditions and customs for these occasions.\nThey have been passed down for many generations.\n\nFirst, people dress up in traditional outfits.\nThey are called 한복 and they are very colorful and pretty.\n\nPeople also make special rice cakes. They are called 송편.\nThey are very tasty and come in different colors such as white, pink, green and yellow.\n\nPlus, remembering our ancestors is a big part of family holidays.\nThere are traditional memorials that take place. This is called 차례.\nPeople also visit their ancestors’ graves to pay their respects. This is called 성묘.\n\nSo, these are some of the traditions related to Korean Thanksgiving."}, {"slide": 405, "text": "어렸을 때 특별했던 휴일관련 추억\nDescribe for me a special holiday memory that you have from your childhood.\nTell me where you were and what the place looked like and everything you remember from the holiday scene.\n\n: I remember going to a theme park during the holidays when I was a kid.\nI was jumping up and down because I was so excited.\n\nThere were many rides at the amusement park.\nI could not wait to go on the rides.\nThe one I remember the most was the rollercoaster.\nThere was a long line for it, but it was worth the wait.\nI remember being a bit scared at first, but it was fun at the end.\n\nFor lunch, I remember getting some burgers and fries.\nI also ate some pizza and pasta.\nThe food tasted extra good because I was starving.\nI also remember getting some ice-cream and cotton candy.\n\nSo, this was what I did during the holidays when I was a kid."}, {"slide": 406, "text": ""}, {"slide": 407, "text": ""}, {"slide": 408, "text": ""}, {"slide": 409, "text": "가장 최근 휴일에 했던 일들 자세히 묘사\nTell me in detail about the last holiday that you celebrated.\nDid anything special or memorable happen?\nTell me everything you did to celebrate this most recent holiday.\n\n: I had to stay home during the holidays this year.\n\nWe’ve been staying at home a lot because of the coronavirus.\nWe have been practicing social distancing.\n\nSo, I want to get together with my family on my next holidays.\nWe could do some catching up over some drinks.\nWe could also go to a decent restaurant and have a nice meal together.\nI also want to watch movies with my family.\n\nSo, I want to meet my family on my next holidays."}, {"slide": 410, "text": "우리나라 휴일 종류, 사람들이 하는 일들 묘사\nWhat are some holidays in your country?\nWhat do people do during these holidays?\nWhat is special about them?\n\n: There are two big family holidays in Korea.\nOne is the Lunar New Year’s, and the other is the Korean Thanksgiving holidays.\nPeople get several days off to celebrate these occasions.\n\nIt is a tradition for family members to get together during these holidays.\nMany people visit their hometowns or family back home.\nPeople typically visit their parents, grandparents, or other relatives.\n\nWhen they gather, they cook holiday food and enjoy meals together.\nThey ask how each other is doing and do some catching up.\n\nMeanwhile, exchanging gifts is a big part of family holidays.\nPeople exchange gift boxes or fruit baskets. They sometimes offer money gifts as well.\n\nThere are many long-time traditions and customs for these occasions.\nThey have been passed down for many generations.\n\nFirst, people dress up in traditional outfits.\nThey are called 한복 and they are very colorful and pretty.\nPlus, remembering our ancestors is a big part of family holidays.\nThere are traditional memorials that take place. This is called 차례.\nPeople also visit their ancestors’ graves to pay their respects. This is called 성묘."}, {"slide": 411, "text": "휴일 관련 사람들의 우려/걱정 설명 I\nWhat are some issues or concerns people have regarding holidays?\nWhat do people do to address those issues or concerns.\n\n: One of the biggest concerns is safety when it comes to holidays.\nThese days, It is not safe to go outside because of the coronavirus.\nIn fact, the epicenter of the virus was the Chinese city of Wuhan.\nHowever, it spread to at least 210 other countries.\nThe situation was especially bad in the US and Europe.\nThere were more than 200 million confirmed cases worldwide, and the global death toll went over 4 million and is still rising.\nMeanwhile the virus also spread widely in Korea.\nThe government declared a national health emergency.\nThere were strong quarantine measures for suspected patients in the initial stages.\nThe spread was curbed early in Korea thanks to active testing and contact tracing.\nBut even so, over 220,000 people got infected and tested positive.\nThe coronavirus outbreak had major ripple effects globally. The virus also took a huge toll on businesses as many of them had to close down. Stock markets around the world and the global economy also took a big hit.\nThat being said, I hope that the coronavirus dies off eventually, so that everything could come back to normal."}, {"slide": 412, "text": "휴일 관련 사람들의 우려/걱정 설명 II\nWhat are some issues or concerns people have regarding holidays?\nWhat do people do to address those issues or concerns.\n\n: One of the biggest concerns is overdrinking when it comes to holidays.\nDrinking is fine if you drink moderately.\nHowever, people sometimes drink too much and get drunk.\n\nBad things could happen when this happens.\nFirst, people could make embarrassing mistakes.\nThey could also fall asleep at odd places.\nThey could also cause trouble and noise.\nThey could even get into fights.\n\nWorse things can happen when people get wasted.\nPeople could get into accidents.\nThey could also get hurt or get injured.\nThey could also lose something important.\nPlus, they could have a terrible hangover and get sick the next day.\n\nSo, I think one of the biggest concerns is overdrinking.\nPeople should always drink in moderation when they get together for drinks."}], "aliases": ["Holiday"]}], "rp_topics": [{"key": "furniture", "label_ko": "가구 (RP)", "label_en": "RP_furniture", "scripts": [{"slide": 38, "text": "Q11 : 가구점 직원에게 사고 싶은 가구에 대해 현장 문의 (int)\nI'd like to give you a situation and ask you to act it out. You want to buy a new piece of furniture for your home. Speak to the store clerk and describe what you want. Ask three or four questions about the furniture they have for sale.\n\nQ11 : 가구점 직원에게 사고 싶은 가구에 대해 현장 문의\nI'd like to give you a situation and ask you to act it out. You want to buy a new piece of furniture for your home. At the store, you see a piece that you like, but you have some questions about it. Pretend you are speaking to a salesperson. Ask three or four questions to get all the information you need about the furniture you like.\n\n: Hi, I want to get some new furniture.\nI am looking for a new desk to study.\nMy current desk is too old and small so I need a bigger desk.\nI want to buy a desk with a brown color.\n\nwhat kinds of (desks) are available?\nCan you tell me/ how much they are?\nI wonder/ if there are any discounts or promotions going on?\nI want to get a good deal.\n\nCould you recommend (something) for me?\nI (need) some help./ I (need to get) some help."}, {"slide": 39, "text": "Q12 : 가구가 도착했는데 심각한 문제가 있어 전화로 문제 해결 (adv)\n\nI'm sorry but there is a problem I need you to resolve. When you get your new furniture at your home, you realize that there is a serious problem. Call the store and explain the problem in detail. Then make some suggestions as to how you can resolve the problem as quickly as possible.\n\n: Hi, I am a person who got a new desk from your store.\n\nHowever, I found a problem with the desk.\nThere is a big scratch on the desk.\n\nI want to get an exchange.\nI wonder if I could get a refund if I want to.\nWould that be possible?\n\nWhen is a good time to visit your store?\nWhat are your business hours?\nHow late are you open?\n\nPlease call me back if you get this message.\nThanks."}, {"slide": 40, "text": "Q12 : 가구가 도착했는데 외관이 마음에 안 들어 전화로 문제 해결 (adv)\nI'm sorry, but there is a problem I need you to resolve. When you get the piece of furniture at home, you don't like the way it looks. Call the store, explain why you are not satisfied, and propose some solutions to resolve the problem.\n\n: Hi, I am a person who got a new desk from your store.\n\nHowever, there is a problem with the desk.\nI don’t like how it looks. I don’t like the shape and design is not pretty either.\nIt is different from what I expected.\nI don’t want to keep this desk.\n\nI want to get an exchange.\nI wonder if I could get a refund if I want to.\nWould that be possible?\nI am sorry for all the trouble.\n\nWhen is a good time to visit your store?\nWhat are your business hours?\nHow late are you open?\n\nPlease call me back if you get this message.\nThanks!"}, {"slide": 41, "text": "Q13 : 구매한 가구에 문제가 있었던 본인 경험 설명  (adv)\nThat's the end of the situation. Have you ever bought furniture that wasn't what you had expected? Maybe you got the wrong color or maybe it didn't fit in the space you had for it. Tell me about a time when you had a problem with a new piece of furniture.\n\nQ13 : 집에 구매한 무언가가 마음에 안 들었던 본인 경험 설명 (adv)\nThat's the end of the situation. Has anything like that ever happened to you? if you ever bought something for your home or yourself that did not work out? Tell me everything that happened and how you eventually solved the problem.\n\n: I remember when I got a desk for my room.\n\nHowever, when the desk arrived, I had a little problem.\nThe desk was too big for my room and it did not fit in.\nI have tried many different ways, but nothing worked.\nIt was little bigger than I expected.\n\nIn the end, I had to get the exchange with a smaller one."}], "aliases": ["Furnitures"]}, {"key": "realestate", "label_ko": "부동산 (RP)", "label_en": "RP_realestate", "scripts": [{"slide": 58, "text": "Q11 : 부동산에 구하고 싶은 집에 대한 전화 문의\nI'd like to give you a situation and ask you to act it out.\nYou are looking for a new home. Call a real estate agent and introduce yourself.\nAnd then, ask three or four questions about homes and services they offer.\n\n: Hi, I'm calling to ask about renting a house.\nI'm looking for a place to live in for 2 years.\nI want three bedrooms and two bathrooms.\nI also want a large garage because my family has two cars.\nI also have two kids so I want a place that is near a school.\n\nWhat kinds of (houses) are available?\nCan you tell me/ how much they are?\nCan you recommend something for me?\nI think I need to get some help.\n===============================================================\nAlso can you give me some directions/ to your real estate agency? (your office)\nI wonder/ if I could drive my car there.\nIs there a parking lot?\nIf so, how much is it for parking?\nIf not, I will
