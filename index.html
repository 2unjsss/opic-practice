 just take public transportation.\n\nPlease give me a call when you get this.\nThank you."}, {"slide": 59, "text": "Q12 : 입주했는데 창문이 깨져 있어서 수리점에 수리요청\nI'm sorry about there is a problem which I need you to resolve. When you get to your new home, you discover that a window is broken. Call the repair shop and leave a message. Describe in detail the condition of the window. Explain how you think the window got broken. Give two or three reasons why it is important that the window is fixed today.\n\n: Hi, I'm a person who just moved in.\nHowever, I found out that one of the windows is broken.\nI have no idea how that happened.\nBecause of the broken window, bugs are coming in.\nAlso, people can see what I'm doing inside. There's no privacy.\nI need to get a new window ASAP.\nI want to get it fixed today.\n\nWould that be possible?\nWhat kinds of (windows) are available?\nCan you tell me/ how much they are?\nPlease give me a call when you get this.\nthank you."}, {"slide": 60, "text": "Q13 : 무엇인가 깨져 있는 물건을 발견했던 경험과 대처 방법 설명 (adv)\nThat's the end of the situation.\nTell me about a time when you found something that was broken.\nWhy did the thing break and how did you deal with the situation?\nGive me all the details about the incident.\n\n: I remember finding a cup that was broken at home.\nI have no idea how it broke.\n\nThe cup had broken into several pieces, and I had to clean up the glass.\nI picked up the big pieces and vacuum the small pieces.\nI try to be careful, but I cut my hand on a piece of glass.\nIt was bleeding and it was a little sore.\nI disinfected the cut and put a band-aid on it.\nSince then, I try to be more careful."}], "aliases": ["Real Estate"]}, {"key": "recycling", "label_ko": "재활용 (RP)", "label_en": "RP_recycling", "scripts": [{"slide": 67, "text": "Q11: 새로 입주한 건물의 재활용 방법을 관리실에 전화 문의 (int)\nSuppose that you have moved into a new building.\nCall the manager of the building and ask three or four questions about recycling.\n\nQ11: 새로 입주한 아파트의 재활용 방법을 안내 데스크에 전화 문의 (int)\nSuppose you just moved to a big apartment building. Call the person at the front desk and ask three to four questions about the building＇s recycling policy.\n\n: Hi, I’m calling to ask about recycling (in the building.)\nI want to ask about how I should take out the recycling.\n\nWhat are the things/ I should recycle?\nShould I recycle cans, plastics and paper?\nIs there anything else I should recycle?\n\n1) Next, can you tell me /where I should take out the recycling?\nIs there a designated area/ for the recycling?\nIs it next to the dumpster for regular garbage?\nIf so, can you give me some directions?\n\n2) Also, can you tell me /when I should take out the recycling?\nCan I do that anytime /or do I have to do that on certain days?\n\nPlease give me a call when you get this.\nThank you."}, {"slide": 68, "text": "Q12: 해외에서 온 신입 주민이 재활용 수거함에 일반 쓰레기를 잘못 버려서 다른 주민들이 불만, 신입 주민에게 가서 재활용 정책 설명\nA new resident from abroad has just rented an apartment in your building. However he is throwing away garbage in the recycling bin. Other residents are very upset about that. Go to the new resident and explain the situation and tell him about the recycling policy.\n\n: Hi, I'm a person living next door.\n\nPeople are very upset because you are not recycling properly.\nYou threw away regular garbage in the recycling bin.\nYou should not do that.\nYou should throw away garbage in the dumpster.\n\nAs for the recycling, you have to gather plastics, cans and paper.\nAnd then, you have to take them out separately.\nThere is a designated area for the recycling.\nIt is next to the dumpster for regular garbage.\n\nOnce again, you have to recycle properly."}, {"slide": 69, "text": "Q12: 본인이 파티를 한 후 쓰레기 처리 관련하여 주민들 항의가 들어와서 항의가 들어와서 항의 온 주민에게 대안 제시\nYou often host large parties and take out most of the recycling and garbage the next day. However, other residents in your building are not happy about it, and one of them has come to complain to you. Explain the situation and offer some suggestions to resolve the problem.\n\n: Hi, I understand that people are upset because of my garbage.\n\nI host large parties at my place from time to time.\nWhen I do that, I have a lot of trash the next day.\n\nPeople are very upset because I am not recycling properly.\nI threw away regular garbage in the recycling bin.\n\nAs for the recycling, why don’t I gather plastics, cans and paper? -제안\nAnd then, I should take them out separately.-제안\nIs there a designated area for the recycling?\nIs there a dumpster for regular garbage?\n\nPlease tell me what you think.-제안\nI'm fine with whatever you decide."}, {"slide": 70, "text": "Q13: 본인의 어렸을 때 재활용 경험 묘사\nTell me what recycling was like when you were a child. Was there a particular place you took out the recyclables to? How was recycling back then different from what you are doing now?\n\nQ13: 본인의 처음으로 재활용을 접해본 경험 묘사\nDo you remember the first time you heard about recycling? Tell me how it happened, how old you were, where you were and who told you about the process. Describe in detail what happened from beginning to end.\n\n: Back in the day, people did not think recycling was important.\nThey did not recycle at home because there was no recycling policy.\n\nPeople just took out the recyclables with the other garbage.\nHowever, recycling was practiced in schools.\nStudent separated the recyclables from the non-recyclables.\nThey sometimes took the scrap paper to school for collection.\nI remember doing that when I was a kid.\n\nBut these days, people’s thoughts have changed a lot.\nThey think recycling is very important for the environment.\nSo, recycling is well practiced at people's homes.\nIt has become a daily routine in people's lives."}, {"slide": 71, "text": "Q13: 재활용을 하던 중 본인에게 있었던 문제 설명 (milk)\nDescribe a specific time in which you had trouble with recycling. It may have been a situation in which you moved to a new place and did not know the rules, or you put the materials in the wrong containers. Describe what happened from beginning to end.\n\n: I remember watching the news about a recycling problem that happened in 2018.\n\nChina used import recyclables from other countries.\n\nHowever, it stopped doing that from 2018 due to environmental reasons.\nAs a result, Korea had no place to export its recyclables.\nThere was too much supply, and the price for recyclables dropped sharply.\n\nEventually, recycling companies stopped collecting scrap plastic\nbecause they could not make any profits.\nScrap plastic started to pile up at people's homes and it was a serious problem.\n\nIn the end, local governments had to intervene.\nThey started to pay subsidies to recycling companies.\n\nSo, this was the incident I remember about recycling."}], "aliases": ["Recycling"]}, {"key": "mp3", "label_ko": "MP3 (RP)", "label_en": "RP_mp3", "scripts": [{"slide": 80, "text": "Q11: 친구가 쓰는 MP3 플레이어에 대해 전화로 질문\nI'd like to give you a situation and ask you to act it out.  You want to buy an MP3 player. You have a friend who knows a lot about MP3 players. Call your friend and ask three or four questions to get information about buying an MP3 player.\n\n: Hi James. I'm calling to ask about MP3 players.\nSince you know a lot about them, I want to ask about the product you are using.\nFirst, can you tell me/ how much it was?\nI wonder if/ it was expensive.\n\nSecond, when did you buy your mp3 player?\nHow long have you had it?\n\nLast, where did you buy the MP3 player?\nDid you get it online or offline?\nIf you got it online, can you tell me/ which site it was?\nIf you got it offline, can you tell me/ where the store was?\nPlease give me a call when you get this.\nThank you."}, {"slide": 81, "text": "Q12: 친구의 MP3 플레이어 빌렸다가 고장 내서 대안제시\nI'm sorry, but there is a problem which I need you to resolve. You have borrowed your friend’s MP3 player but broke it. Call your friend and explain how you broke it and what is current conditions is like. And then, offer two or three  alternatives to get your friend a working MP3 player as soon as possible.\n\n: Hi, Brian.\nI have some bad news.\nI am really sorry, but I broke your MP3 player by mistake.\nI dropped it on the street.\nIt is completely broken, and I think we can’t fix it. (I don’t think we can fix it)\nI feel so bad about what happened.\n\nWhy don’t I buy you a new one?\nShould I buy the same product for you?\nOr maybe I could pay you money instead. You could buy a new one for yourself with the money.\n\nAnyway, please tell me what you think.\nI am fine with/ whatever you want(decide).\nI will wait for your call. ( I will be waiting for your call).\nBye."}, {"slide": 82, "text": "Q13: 본인의 기계나 기기 고장 경험 설명\nThat’s the end of situation.\nTell me about a situation when some sort of equipment broke or not work properly. Give me the background of the situation. And then, tell me what happened and how you resolved the problem.\n\n: I remember when my TV at home broke down.\nIt was very frustrating because I could not watch TV.\nI tried to fix it myself, But I could not it, so I finally called up a person to fix it.\n\nPlus, I remember when my computer broke down.\nWhen I was surfing on the internet, however the screen was getting black.\nSo, I went to the service center to get it fixed.\n\nNext, I remember when the clock in the living room did not work well.\nI had to replace the batteries for the clock, and it worked again.\n\nI had to wipe off the water from the floor.\nAnd then, I had to call someone to fix the AC.\nSo, these were the problems I have had with equipment."}], "aliases": ["MP3"]}, {"key": "bike", "label_ko": "자전거 (RP)", "label_en": "RP_bike", "scripts": [{"slide": 83, "text": "Q11 : 쇼핑몰에 가기 위해 친구 자전거 빌리기 위해 전화 질문\nI‘d like to give you a situation and ask you to act it out.\nYou want to borrow a bike from your friend to go to a shopping mall and buy something. Call your friend and ask three or four questions as to whether you can borrow the bike.\n\n: Hi, James,\nI am calling to ask about your bike.\nI want to go to the shopping mall.\n\nI wonder if I could borrow your bike.\nIf so, can you tell me /when I can pick up your bike?\nWhere is your bike parked?\nAnd when do you need it back?\nCan I bring it back on Tuesday?\nWould that be possible?\nIf you need it before that, I can bring it back right away.\nPlease give me a call when you get this. Thank you."}, {"slide": 84, "text": "Q12 : 자전거 쇼핑몰에 주차 했는데 트럭에 치여 고장, 친구한테 전화해서 상황 설명 후 대안제시\nI am sorry, but there is a problem which I will need you to resolve.\nYou parked the bike that you borrowed outside the shopping mall, but the bike was run over by a truck. Call your friend and explain the situation.\nGive two or three alternatives to your friend.\n\n: Hi, James, \nI have some bad news. I am so sorry but your bike was broken.\nI parked your bike at the shopping mall, but a truck ran over it.\nIt is completely broken and I think we can not fix it anymore.\nI feel so bad about what happened.\n\nWhy don’t I buy you a new one?\nShould I buy the same product for you?\nOr, maybe I could pay you some money instead.\nYou could buy a new product yourself with the money.\n\nAnyway, please tell me what you think.\nI am fine with whatever you decide.\nI will be waiting for your call. Bye."}, {"slide": 85, "text": "Q13 : 자전거나 다른 교통수단 관련 겪은 어려움 묘사 *\nThat＇s the end of the situation.\nNow, tell me about a time when you had a problem while using a bike or any other type of transportation.\nWhat happened and how did you deal with the problem?\n\n: I remember when I was stuck in traffic jamduring the holidays.\n\nCars were not moving at all because traffic was bumper to bumper.\nI was heading home from a trip.\nBecause of the heavy traffic, It took me much longer than usual.\nSo, I remember that It took three hours to get to my destination.\nI got carsick and I felt light-headed. \nI had to take some medicine and take it easy for a while."}], "aliases": ["Bicycle"]}, {"key": "movie", "label_ko": "영화 (RP)", "label_en": "RP_movie", "scripts": [{"slide": 95, "text": "Q11 : 영화관에 친구와 함께 볼 영화 표 구매 전화 문의\nI'd like to give you a situation and ask you to act it out.\nYou want to take your friend to the movies.\nCall the theater and ask two to three questions to get tickets for you and your friend.\n\n: Hi, I am calling to ask about tonight’s movie. \nI want to get two tickets.\n\nSo, What kinds of (tickets) are available?\nI want to see a romantic comedy movie or horror movie.\nCan you recommend something for me?\nI think I need to get some help.\n\nCan you tell me how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\n\n======================================================================\n\nAlso can you give me some directions to the theater?\nI wonder if I could drive my car there.\nIs there are parking lot?\nIf so, how much is it for parking?\nIf not, I will just take public transportation.\n\nPlease give me a call when you get this.\nThank you."}, {"slide": 96, "text": "Q12 : 영화관 현장에서 그쪽이 잘못 판매한 표 설명. 문제해결\nI'm sorry, but there is a problem which I need you to resolve.\nWhen you and your friend arrive at the theater you discover that they’ve sold the wrong tickets to you. Explain the situation to the ticket seller at the booth.\nOffer two or three alternatives to solve the problem.\n\n: Hi, I am a person who got tickets for tonight’s movie.\n\nHowever, there is a problem with the tickets.\nI think I got the wrong tickets.\nThese are not the tickets I asked for.\nThey are for another movie.\n\nI want to get an exchange.\nI wonder if I could get a refund if I want to.\n\nWould that be possible?"}, {"slide": 97, "text": "Q13 : 계획을 막판 취소했던 본인 경험 설명\nThat＇s the end of the situation.\nHave you ever bought concert tickets or made plans for a trip, or made plans for other things, but had to cancel at the last minute because of something that happened unexpectedly? Tell me everything about what had happened that prevented you from going.\n\n: I remember when I was supposed to go on a trip to USA with my friend.\nHowever, we decided to cancel the trip because of the coronavirus.\nWe thought it was not safe to go on a trip at that time.\n\nThere were many new cases that were occurring and we had to practice\nsocial distancing.\nThere were large clusters of community infections here and there.\n\nSo, I had to cancel the performance and stay home."}, {"slide": 98, "text": "Q11 : 친구가 언급한 영화를 본인도 보고 싶은 지 알아보기 위해 질문\nI'd like to give you a situation and ask you to act it out.\nYour friend just told you about a great new movie. Ask your friend three or four questions about the movie to see if you want to watch it too.\n\n: Hi, James. I am calling to ask about the great new movie you talked about.\nI want to know if I want to watch it myself.\n\nFirst, what kinds of movie is it?\nIs it an action movie or a sci-fi movie?\nIs it a romantic comedy or a superhero movie?\nWhat is the story about?\nAnd who stars in the movie? Are there any well-known stars in the movie?\n\nPlus, I want to ask about the tickets.\nCan you tell me how much they are?\nAnd can I get a discount?\n\nPlease give me a call when you get this.\nThank you.\n\n======================================\n\nAlso can you give me some directions to the theater?\nI wonder if I could drive my car there.\nIs there are parking lot?\nIf so, how much is it for parking?\nIf not, I will just take public transportation."}, {"slide": 99, "text": "Q12 : 극장에서 친구와 영화를 보다 너무 지루해서 중간에 나오고 싶음. 친구한테 상황설명. 대안제시\nI’m sorry, but there is a problem which I need you to resolve.\nYou are at the movies with your friend, but the movie is boring and you want to leave.\nExplain the problem to your friend and come up with two to three alternatives.\n\n: Hey, Brian.\nI don’t know about you, but I think this movie is very boring.\nI think it’s a piece of crap.\nI am almost falling asleep.\n\nI want to leave right now.\nI feel like it is a waste of my time.\n\nSo, Can you tell me what you want to do?\nIf you like the movie, you can keep watching the movie until the end.\nI will wait you outside until it’s over.\nIf you want to leave now, let’s just go grab a bite somewhere.\nActually, I am a bit hungry.\n\nAnyway, please tell me what you think.\nI am fine with whatever you decide."}, {"slide": 100, "text": "Q13 : 본인이 지루한 영화를 본 경험 설명\nThat＇s the end of the situation.\nHave you ever tried to watch a boring movie? If so, what did you do? Did you watch the whole movie? It not, why not? Tell me all the details of this experience.\n\n: I remember when I watched a movie with my friend last week.\n\nThe movie we wanted to watch was sold-out, so we got tickets for another movie instead.\n\nHowever, as I watching movie, I thought it was really boring.\nI could not understand the storyline.\nIt was not what I had expected.\nI thought it was a horrible movie.\n\nI wanted to leave at that time.\nBut, It was a pity for my money. So, I just watched the movie until the end.\n\nLooking back, it was a piece of my crab in my life.\nIt was a waste of my time and I regret watching that movie."}], "aliases": ["Movie"]}, {"key": "performance", "label_ko": "공연 (RP)", "label_en": "RP_performance", "scripts": [{"slide": 101, "text": "Q11 : 공연장에 공연 티켓 구매 전화문의\nI'd like to give you a situation and ask you to act it out.\nYou want to get two tickets to see a performance during your vacation.\nCall the box office and ask three or four questions to get tickets.\n\n: Hi, I am calling to ask about tonight’s performance. \nI want to get two tickets for 7 o’ clock show.\nI want to get some good seats at the front.\n\nWhat kind of (tickets) are available?\nCan you tell me how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\n\nCan you recommend something for me?\nI think I need to get some help.\n\nAlso can you give me some directions to the theater?\nI wonder if I could drive my car there.\nIs there are parking lot?\nIf so, how much is it for parking?\nIf not, I will just take public transportation.\n\nPlease give me a call when you get this.\nThank you."}, {"slide": 102, "text": "Q12 : 몸이 아파서 공연에 못 가게 되어 친구에게 상황 설명. 대안제시\nI'm sorry, but there is a problem which I need you to resolve.\nOn the day of the performance, you are very sick.\nCall your friend and explain the situation and offer two different options to resolve this situation.\n\n: Hi, Brian. I have some bad news.\n\nI do not think I can make it to the performance tonight.\nI am very sick right now.\nI think I came down with the flu.\nI have a fever and I have a sore throat.\nI am also coughing a lot.\nI also have a runny nose and my nose is stuffy.\nI am also aching all over and I have the shivers.\n\nCan you tell me what you want to do?\nWhy don’t we go next time?\nDo you want to go next week?\nOr maybe we could go another time.\n\nAnyway, please tell me what you think.\nI am fine with whatever you decide.\nI'll be waiting for your call.\nBye."}, {"slide": 103, "text": "Q13 : 공연표를 예매했다가 못 가게 된 상황설명. 대안제시\nThat＇s the end of the situation.\nHave you ever had plans or tickets but found out that you could not attend the performance? When was this? What happened? Tell me everything about the situation and what you did to try to resolve it.\n\n: I remember when I was planning to go to a performance with my friend.\nHowever, the performance was canceled because of the coronavirus.\nThere were many new cases that were occurring and we had to practice\nsocial distancing.\nThere were large clusters of community infections here and there.\nHundreds of new confirmed cases were reported each day.\n\nEventually, I had to cancel the performance and stay home."}], "aliases": ["Performance"]}, {"key": "TV", "label_ko": "TV (RP)", "label_en": "RP_TV", "scripts": [{"slide": 115, "text": "Q11 : 친구들 집으로 초대함. 집에서 어떤 영화 보고 싶은 지 전화 질문\nI'd like to give you a situation and ask you to act it out.\nYou are having a group of friends over to watch a movie.\nAsk your friends four to five questions about the kind of movie you should watch together.\n\n: Hi there, guys.\nI am calling to ask about the movie we could watch when you guys come over.\n\nCan you tell me what kinds of movie you guys have in mind?\nDo you want to watch a Korean movie or a Hollywood movie?\n\nI have a Netflix account and I heard that there are many movies or TV shows in Netflix.\nSo, I think we can watch the movies whatever we want to do.\n\nPlease give me a call when you get this.\nThanks."}, {"slide": 116, "text": "Q12 : 집에서 영화 재생이 안 되어 친구들에게 상황 설명. 대안제시\nI'm sorry, but there is a problem which I need you to resolve.\nWhen you try to play the movie, something is wrong and it does not play.\nExplain the problem to your guests and offer two or three different solutions or alternatives to the problem.\n\n: Oh, shoot!\nI think something is wrong with the TV.\nThe movie is not playing.\nI have tried everything myself but it doesn’t work.\nI am so sorry you guys with the problem.\n\nCan you tell me what you want to do?\nInstead, How about playing a board game together?\nI think It would be fun !\nOr, How about listening to music?\n\nAnyway, please tell me what you think.\nI am fine with whatever you decide."}, {"slide": 117, "text": "Q13 : 본인이 과거 영화/TV를 보려고 했는데 차질을 빚은 경험 묘사\nThat＇s the end of the situation.\nHave you ever gone to a movie or wanted to watch a special TV event, and then something happened that prevented you from watching it?\nTell me about that experience, when it happened, where you were, and who you were with. Give me all the details, especially about what exactly happened that prevented you from watching the movie or the TV event and how you dealt with the situation.\n\n: I remember gathering with my friends a few months ago.\nWe had lunch together and chatted for a while.\nAnd then, we decided to watch a movie.\n\nIn fact, there was a newly-released movie we all wanted to see.\nWe checked for tickets at a theater nearby.\n\nHowever, there were no tickets left because it was sold-out.\nThe next available time was too late.\n\nEventually, we just gave up and agreed to watch a movie another time."}], "aliases": ["TV"]}, {"key": "traveling", "label_ko": "국내여행 (RP)", "label_en": "RP_traveling", "scripts": [{"slide": 124, "text": "Q11 : 여행사 직원에게 전화해서 여행 상품 문의\nI’d like to give you a situation and ask you to act it out. You want to take a trip within your own country.\nCall the travel agent and ask three or four questions to find out what you need.\n\nQ11 : 여행사에 전화해서 친구와 함께 갈 휴가 상품 문의\nI’d like to give you a situation and ask you to act it out. You are planning a vacation with a friend. Call the travel agency and describe the kind of vacation you and your friend are planning. Then, ask three or four questions to find out what you need to know to complete the plans for this vacation.\n\n: Hi, I am calling to ask about package trips.\nI want to go on a trip next month.\n\nWhat kinds of package trips are available?\nCan you tell me/ how much they are?\nAnd can I get a discount?\nI want to get a good deal.\nCan you recommend something for me?\nI think I need to get some help.\n===================================================================\nAlso can you give me some directions to the travel agency?\nI wonder if/ I could drive my car there.\nIs there a parking lot?\nIf so, how much is it for parking?\nIf not, I will take public transportation.\n\nPlease give me a call when you get this message. Thank you."}, {"slide": 125, "text": "Q12 : 여행 계획 변경이 필요해서 여행사에 전화해 대안 제시\nI am sorry, but there is a problem which I need you to resolve. You have booked a non-refundable plane ticket. However, something has happened that prevents you from going next week. Call the travel agent, explain what has happened, and offer some alternatives to resolve the problem.\n\n: Hi, I am a person who booked a package trip.\nI have a non refundable plane ticket.\nHowever, I think I can not make it to my trip.\n\nSomething has come up suddenly.\nBecause I have a family emergency. My sister is very sick because he has food poisoning.\n\nI want to reschedule my trip.\nI wonder/ if you could help me make new trip plans.\n( I could make a new arrangements)\nWould that be possible?\nI am so sorry with the trouble.\nWhen is a good time to visit your travel agency?\nWhat are your business hours?\n\nPlease give me a call when you get this.\nThank you."}, {"slide": 126, "text": "Q12 : 친구에게 여행 상품이 원하는 날짜에 없다고 설명하고 대안 제시 (Adv)\nI am sorry, but there is a problem which I need you to resolve. The travel agent informs you that the vacation you want is not available for the dates you want. Call your friend, leave a message explaining the situation and offer two or three alternatives.\n\n: Hi, Brian.\nI have some bad news.\nI talked to travel agency, but the package trip is not available for the date we want.\nWe wanted to go next weekend, right?\nBut, There are no package trips (left) for that time.\nI think it is because it’s the peak season.\n\nSo, Can you tell me/ what you want to do?\nWhy don’t we go next time?\nI am fine/ with whatever you decide\n\nAnyway, please tell me what you think.\nPlease give me a call when you get this"}, {"slide": 127, "text": "Q13 : 여행 중에 있었던 특이한 본인 경험 자세히 묘사\nThat’s the end of the situation.\nThere are times when something out of the ordinary happens while traveling.\nI wonder if you have ever experience anything surprising, unexpected or unusual during a trip. Tell me the story of that experience in detail.\nStart by telling when and where you were traveling. And then, tell me all the details of that experience, especially about what made it so unforgettable.\n\n: I remember when I had a bad stomachache during a trip several years ago.\nI think I ate too fast because I was so hungry.\n\nI got indigestion and it was pretty bad.\nMy stomach was upset and I feel like throwing up.\nI also had a fever and felt lightheaded.\nI tried to find some medicine but I could not find any.\nSo, I went to the drug store to get some medicine.\nI told our pharmacist about my symptoms.\nHe gave me something that would make me feel better.\n\nI came back to the hotel and took some medicine to get better.\nI had to stay inside and get plenty of rest.\n\nSince then, I tried to be more careful when I eat something."}, {"slide": 128, "text": "여행 중에 있었던 잊을 수 없는 에피소드 설명 (배탈) * adv\nTraveling can lead to many kinds of interesting, funny and unexpected experiences. Tell me about one travel experience you had that was unforgettable. Start by telling me when this happened, where you were, and who you were with. Then, tell me about all the things that happened that made this experience so unforgettable.\n\n: I remember/ when I had a bad stomachache (during a trip.)\nI think I ate too fast because I was so starving.\nI feel pretty bad.\n\nMy stomach was upset, and I felt like throwing up.\nI also had a fever and felt light-headed.\nI tried to find some medicine but could not find anything.\n\nSo, I went to the drug store to get some medicine.\nI told the pharmacist about my symptoms.\nSo, He gave me something that would make me feel better.\n\nI came back to the hotel and took some medicine to get better.\nI had to stay inside and get plenty of rest.\nSince then, I try to be more careful/ when I eat something."}, {"slide": 129, "text": "Q13 : 본인이 여행을 계획하는 단계에서 겪어본 어려움 묘사\nThat’s the end of the situation. Think about a time when you had difficulty making vacation plans. Tell me about the details of what happened and what you needed to do.\n\n: I remember when I was supposed to go on a trip with my friends.\n\nHowever, something came up suddenly.\nI got really busy at work and I had to work until late.\nIt was impossible to make time for the trip.\n\nI felt bad about canceling at the last minute,\nBut there was nothing I could do.\nI told my friends that I could not make it and said I was sorry.\n\nLooking back, I regret missing the trip that time."}, {"slide": 130, "text": "Q11 : 미국으로 휴가 다녀온 친구에게 전화로 질문\nI’d like to give you a situation and ask you to act it out. Your friend has just returned from a vacation to the united states. Ask your friend three or four questions to find out everything you can about his or her trip.\n\n: Hi, James.\nI am calling to ask about your vacation to the United States.\nFirst, can you tell me which places you visited?\nDid you go to any landmarks or historic places?\nDid you take a picture or shoot vide?\n\nNext, can you tell me what types of food you had there?\nWhat was your favorite local restaurant?\n\nAnd can you recommend something for me?\nI\nI wonder/ if you did some shopping.\nIf so, what did you buy?\nDid you buy any gifts or souvenirs for your friends or family?\n\nPlease give me call when you get this.\nBye!"}, {"slide": 131, "text": "Q12 : 친구가 자기 집에 초대했는데, 선약이 있어서 못 가는 것을 전화로 상황 설명하고 대안 제시\nI am sorry, but there is a problem which I need you to resolve. Your friend wants you to come over and see his pictures from his trip this evening. However, you have another engagement. Call your friend, explain why you cannot come by this evening and offer some alternatives.\n\n: Hi, Brian. I have some bad news.\nI do not think I can make it to your place this evening.\nI have another engagement. (things to do)\nI am suppose to meet up with another friend.\nWe are going to watch a movie together.\nAfter that, we may have dinner and grab some drinks.\nSo, I may come home quite late today.\n\nI want to reschedule our gathering.\nWhen is a good time for you?\nI am free next Monday.\nAre you available that day?\nIf not, I can make some time next Thursday or Friday.\n\nAnyway, please tell me what you think.\nI am fine with whatever you decide.\nI will be waiting for your call. Bye."}, {"slide": 132, "text": "Q13 : 본인의 기억에 남는 여행 설명\nThat’s the end of the situation. Tell me about a memorable trip that you took.\nWhen was it? Where did you go? Tell me everything that you did on the trip,\nespecially those things that made this trip so special.\n\n: I remember going to the beach with my family a few years ago.\nWe went to a well-known beach in Thailand.\nWe stayed at a beachside cabin that had a great ocean view.\nDuring the day, we took a walk along the beach.\nWe also swam in the ocean and played in the sand.\n\nNext, we took a lot of pictures near the beach.\nFor lunch, we went out for some seafood.\nWe had some fish, shrimp, and crab.\n\nFor dinner, we had a barbeque at our cabin.\nThe food tasted extra good because I was starving.\nWe had some drinks while having the meal.\n\nAfter having dinner, we partied all night long.\nWe even saw the sunrise in the morning.\n\nLooking back, it was one of the most memorable trips in my life.\nIt was worth the money and time.\nI look forward to going again if I have the chance."}], "aliases": ["Traveling"]}, {"key": "flight", "label_ko": "비행기 (RP)", "label_en": "RP_flight", "scripts": [{"slide": 141, "text": "Q11 : 공항에서 항공편이 2시간 출발 지연되어 카운터에 문의\nI'd like to give you a situation and ask you to act it out. You have arrived at the airport, but your flight has been delayed for 2 hours. Go to the counter and ask the person there three or four questions about the delay.\n\n: Excuse me, I want to ask about my flight.\nIt has been delayed for 2 hours.\nFirst, can you tell me/ why there is a delay?\nIs it a technical problem?\nIs it a weather problem?\nPlus, can you tell me /what I can do for 2 hours?\nIs there a lounge I can wait at?\nOr, is there a coffee shop I can go to?\nIf so, can you give me some directions?\nAlso, are you sure the flight will leave in 2 hours?\nWhat happens if it is delayed again?"}, {"slide": 142, "text": "Q12 : 항공편이 지연으로 고객 미팅에 못 가게 되어 전화로 설명하고 대안제시 \nI'm sorry, but there's a problem which I need you to resolve. Because of the flight delay, you cannot attend the business meeting. Call your client, explain the situation, and offer some alternatives to solve the problem.\n\n: Hi, Mr. Kim. This is …\nI have some bad news.\n\nI think I can’t make (it to) (for) our meeting today.\nI am at the airport, but my flight has been delayed for 2 hours.\nThis was totally unexpected.\nThere is no way/ I make it on time for the meeting.\nI am really sorry.\n\nI’d like to reschedule our meeting.\nWhen is a good time for you?\nI am free next Monday.\nWould that be possible for you?/are you available that day?\nIf not, I can make some time next Thursday or Friday.\n\nAnyway, please tell me what you think.\nI am fine with whatever you want (decide).\nI will be waiting for your call. Bye."}, {"slide": 143, "text": "Q12 : 본인이 여행 중 겪은 어려움에 대해서 상세 설명\nThat's the end of the situation.\nHave you ever encountered any difficulties during a trip?\nTell me about that experience and what you did to deal with that difficulty.\nGive me all the details about that experience.\n\n: I remember when I was stuck in traffic for a long time during holidays.\nI was going on a trip with my friend.\nHowever, cars were not moving at all, because traffic was bumper to bumper.\n\nBecause of the heavy traffic, it took much longer than usual.\nIt took almost 4 hours to get to destination.\n\nI was exhausted because I stayed (was) in the car too long.\nI even got carsick and I felt light-headed.\n\nSince then, I try to head out early during the holidays."}], "aliases": ["Flight"]}, {"key": "eva's trip", "label_ko": "에바의 여행 (RP)", "label_en": "RP_eva's trip", "scripts": [{"slide": 144, "text": "Q11 : 우리나라 방문 계획하고 있는 상대에게 몇 가지 질문\nI want to visit your country.\nyou want to help me, but you need more information.\nAsk me three or four questions to learn more about me and my trip.\n\n: Hi Eva,\nI want to help you with your trip.\nI want to ask about what you are interested in.\nFirst, can you tell me what kinds of things you like to do?\nDo you like to do outdoor activities?\nDo you like to go sightseeing?\nDo you like to go shopping when you travel?\nIf so, what do you like to buy?\nDo you like to shop for clothes or shoes?\n\nNext, can you tell me what kinds of foods you like?\nI wonder if you like Korean food.\nWhat is your favorite Korean cuisine?\nCan you eat spicy food? Plus, are you interested in history or culture?\nIf so, do you want to go to some museums or art galleries?\nAlso which is your favorite season?"}, {"slide": 145, "text": "Q12 : 상대가 오늘 공항도착. 내가 공항 픽업 가기로 했으나 긴급상황으로 못 감.\n전화해서 상황 설명. 대안제시\nI’m arriving for visiting your country today. You are going to meet me at the airport, but you have some emergency and cannot make it. Call my voicemail and leave a message. Explain the problem and give me two or three options so that I can get from the airport to your home.(hotel)\n\n: Hi Eva, I have some bad news.\n\nI know I'm supposed to pick you up at the airport.\nHowever, I do not think I can make it.\nSomething has come up suddenly.\nI have a family emergency I have to take care of.\nMy son is very sick because he has food poisoning.\nHe has a high fever and cannot eat anything.\nI have to take him to the doctor and look after him.\n\nHere is what you can do. You can take a taxi to your hotel.\nThere is a taxi stand at the airport terminal.\nOr you can take the airport shuttle to your hotel.\nYou can ask for help at the information desk.\nI'm so sorry that I cannot pick you up.\nI guess I will see you at your hotel.\nplease give me a call when you get this. Thank you."}, {"slide": 146, "text": "Q13 : 본인 국가에 대해 흥미로운 사실을 발견하게 된 경험 (adv) \n(corona, movie, recycling, environment, electronic cars, Korean traditional food, music, good & safe place to travel)\nTell me in detail about the time when you learned or realized something interesting about your country. Maybe you watched a sport event or observed the actions of your country's government that affected the citizens. Tell me about experience from beginning to end.\n\n: The coronavirus outbreak has been the center of attention all across the world.\nI remember watching the news about the outbreak.\nIt was about the rapid spread of the virus all cross the world.\nThe situation was especially bad in the US and Europe.\nMeanwhile, the virus also spread widely in Korea.\nThe government declared a national health emergency.\nThere were strong quarantine measures for suspected patients in the initial stages.\nThe spread was curbed early in Korea thanks to active testing and contact tracing.\nThe virus also took a huge toll on businesses as many of them had to close down.\nStock markets around the world and the global economy also took a big hit.\nSo, the news about the coronavirus was what I watched."}], "aliases": ["Eva's trip"]}, {"key": "hotel", "label_ko": "호텔 (RP)", "label_en": "RP_hotel", "scripts": [{"slide": 160, "text": "Q11 : 새로운 도시를 방문하여 당일 저녁 호텔 투숙 전화 문의\nI’d like to give you a situation and ask you to act it out.\nYou are visiting a new city and need a hotel room for the night. Call a hotel and ask three or four questions to find out about its rooms and services.\n\n: Hi, I'm calling to ask about staying at your hotel for the night.\n\nDo you have a vacancy for tonight?\nI want a room with a twin bed.\nI want to stay for five nights.\nI want to check in at 6 p.m.\nI also prefer a room with a nice Ocean View if possible.\n\nWhat kinds of rooms are available?\nCan you tell me/ how much they are?\nI wonder if/ there are any discounts or promotions going on.\nI want to get a good deal.\nDo you have any special rates? – hotel , rental car\nCan you recommend something for me?\nI think I need to get some help.\nPlease give me a call when you get this.\nThank you."}, {"slide": 161, "text": "Q12 : 호텔 객실이 매우 작고 지저분하여 안내 데스크에 전화로 문제 해결\nI am sorry, but there is a problem which I need you to resolve.\nWhen you get to your hotel room, it is very small and not clean at all. Call the front desk and describe what you have found in detail. Then, make some suggestions as to how you can resolve the situation.\n\n: Hi, I'm a person who just checked in at the hotel.\n\nHowever, there is a problem with the room.\nThe room is very small.\nIt is much smaller than I expected.\nPlus, the room is not clean at all.\nI think it was not cleaned properly\nI am very unhappy with the room.\n\nI want to get an exchange.\nI wonder if / I could get a refund if I want to.\nWould that be possible?\nPlease give me a call when you get this.\nThank you."}, {"slide": 162, "text": "Q13 : 호텔에서 기억에 남는 본인만의 경험 묘사\nThat’s the end of the situation.\nSometimes, surprising or unexpected things can happen when you stay at a hotel. Tell me about a memorable experience you had while staying at a hotel. Maybe there was a problem with your room. Maybe you met some other guests.\nTell me the whole story of an interesting hotel visit.\n\n: I remember when I had a bad stomachache at a hotel several years ago.\nI think I ate too much because I was so hungry.\nI got indigestion, and it was pretty bad.\nMy stomach was upset, and I felt like throwing up.\nI also had a fever and felt light-headed.\nI tried to find some medicine but could not find any.\nSo, I went to the drug store to get some medicine.\nI told the pharmacist about my symptoms.\nHe gave me something that would make me feel better.\nI came back to the hotel and took some medicine to get better.\nI had to stay inside and get plenty of rest.\nSince then, I try to be more careful when I eat something."}, {"slide": 163, "text": "Q11 : 해외 출장 중 머무를 호텔에 전화해서 숙박이 가능한지 문의\nYou are going on a trip on business to another country.\nCall a hotel that you want to stay at and ask three or four questions about the hotel.\n\n: Hi I'm calling to ask about staying at your hotel.\n I want to stay there for my business trip.\nDo you have a vacancy/베이컨시/ for next Friday?\nI want a room with a twin bed.\nI want to stay for two nights.\nI want to check in at 3 p.m.\nI also prefer a room with a nice Ocean View if possible.\n\nWhat kinds of rooms are available?\nCan you tell me/ how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\nDo you have any special rates?\n\nCan you recommend something for me?\nI think I need to get some help.\nPlease give me a call when you get this. Thank you."}, {"slide": 164, "text": "Q12 : 직장 상사와 가기로 한 해외 출장 불참 사유와 대안 제시\nYou were supposed to go on a business trip to another country with your boss. However, something came up suddenly and you can't go. Call your boss and explain the situation. And then make two to three suggestions that will help you continue your business with the company overseas.\n\n: Hi there, boss.\nI have some bad news.\nI do not think I can make it to the business trip.\nSomething has come up suddenly.\n\nI have a family emergency.\nMy daughter is very sick because she has food poisoning.\nShe has a high fever and she cannot eat anything.\nI have to take her to the doctor and look after her.\n\nI think we should reschedule our meeting with our client company.\nI could call them and make new arrangements.\nAnyway, please tell me what you think.\nI'm fine with whatever you decide.\nI will be waiting for your call.\nThank you."}, {"slide": 165, "text": "Q13 : 해외 출장이나 여행 중에 겪어 본 문제와 해결 방법 설명\nHave you ever had a problem during a trip you took on business or for leisure? What was the nature of the problem and how did you deal with the situation? Describe in detail about what happened.\n\n: I remember when I had a bad stomachache during a trip several years ago.\nI think I ate too fast because I was so hungry.\n\nI got indigestion and it was pretty bad.\nMy stomach was upset and I feel like throwing up.\nI also had a fever and felt lightheaded.\nI tried to find some medicine but I could not find any.\nSo, I went to the drug store to get some medicine.\nI told our pharmacist about my symptoms.\nHe gave me something that would make me feel better.\n\nI came back to the hotel and took some medicine to get better.\nI had to stay inside and get plenty of rest.\n\nSince then, I tried to be more careful when I eat something."}, {"slide": 166, "text": "Q11 : 새로운 도시에 도착하여 호텔 안내 데스크에 가서 투숙 문의\nI’d like to give you a situation and ask you to act it out.\nYou have arrived in a new city and you’re trying to find a hotel for tonight. Go to the reception desk of a hotel. Describes the room you want and ask three or four questions to get information about what is available.\n\n: Hi, I want to stay at this hotel.\nDo you have a vacancy for tonight?\nI want a room with a twin bed.\nI want to stay for three nights. (3박 4일= 3nights 4days)\nI want to check in right away.\nI also prefer a room with a nice Ocean View if possible.\n\nWhat kind of rooms are available?\nCan you tell me/ how much they are?\nI wonder if there are/ any discounts or promotions going on.\nI want to get a good deal.\nDo you have any special rates? (offer)\n\nCan you recommend something for me?\nI think I need to get some help."}, {"slide": 167, "text": "Q12 : 여행 일행들에게 전화로 호텔 만실임을 알리고 대안 제시\nI am sorry, but there is a problem which I need you to resolve.\nYou've learned that there are no rooms available in this hotel. Call your travel companions to let them know about the situation.\nLeave a message to describe the situation and propose alternative solutions to the problem.\n\n: Hi there, guys.\nI have some bad news.\nI just talked to a person at the front desk, but there are no rooms available.\nThe hotel is fully booked.\nI think it’s because it is the peak season.\nWe should have made a reservation in advance.\n\nCan you tell me/ what you want to do?\nWe need to find a place to stay.\nWhy don't we try another hotel?\nWe should do some searches on a hotel application.\nOr, maybe we could put our names on the waiting list and see what happens.\n\nAnyway, please tell me what you think.\nI'm fine with whatever you decide.\nI'll be waiting for your call. Bye."}, {"slide": 168, "text": "Q13 : 본인의 여행 계획이 뜻대로 되지 않은 경험 묘사\nThat’s the end of the situation.\nThink about a time when your travel plans did not work out as expected. What happened? Tell me all about the circumstances and what you and the others did.\nHow was the situation finally resolved?\n\n: I remember when I was supposed to go on a trip with my friends.\nHowever, I got really sick because I got food poisoning.\nI felt miserable because my stomach was upset.\nI went to the bathroom over and over again.\nI was in no condition to go on a trip.\nI felt bad about canceling at the last minute,\nbut there was nothing I could do.\nI told my friends that I could not make it and said I was sorry.\nLooking back, I regret missing the trip that time."}, {"slide": 169, "text": "Q11 : 호텔  안내 데스크에 가서 자유 시간에  할 수 있는 활동 문의\nI’d like to give you a situation and ask you to act it out.\nYou are staying at a hotel and have a free day to explore the city.\nGo to the front desk and ask three or four questions about what to do.\n\n: Hi, I want to ask for some help.\nI have a free day to explore the city.\nI am thinking of checking out some landmarks in the city.\nI want to visit some museums or art galleries.\nI also want to go to some famous local restaurants.\nSo, I want to go on a city tour.\n\nWhat kinds of tours are available?\nCan you tell me how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\n\nCan you recommend something for me?\nI think I need to get some help."}, {"slide": 170, "text": "Q12 : 택시에 가방을 두고 내려 택시 회사에 전화로 도움 요청\nI am sorry, but there is a problem which I need you to resolve.\nYou left your bag in the taxi that brought you back to the hotel.\nCall the taxi company and explain what happened. Ask them how you can get it back.\n\n: Hi, I'm a person who took one of your taxis.\nHowever, I think I left my bag behind in the taxi.\nIt's a black medium-sized bag made of leather.\nIt has my wallet and passport in it.\nI think I left it in the back seat.\n\nCould you please check if you have my bag?\nI really need to find it ASAP.\nIf it is there, can you hold on to it?\nI will stop by to pick it up right away.\n\nWould that be possible?\nI'm sorry for all the trouble.\n\nWhen is a good time to visit your office?\nWhat are your business hours?\nHow late are you open?\nPlease give me a call when you get this. Thank you."}, {"slide": 171, "text": "Q13 : 본인이 무엇인가를 분실하거나 잊어버린 경험 묘사\nThat’s the end of the situation.\nHas anything like that ever happened to you?\nHave you ever lost something somewhere or could not find something important?\nTell me about when you lost or forgot something important.\n\n: I remember when I left my umbrella behind on the subway.\nI forgot to pack it (take it with me) when I got off the subway.\nIt was pouring outside, and I got a little wet.\nI had to buy a new umbrella at a convenience store.\nSince then, I try to be more careful not to leave my umbrella behind."}], "aliases": ["Hotels"]}, {"key": "Nutritionist", "label_ko": "영양사 (RP)", "label_en": "RP_Nutritionist", "scripts": [{"slide": 182, "text": "Q11 : 영양사에게 식습관 개선 프로그램에 대해 전화로 질문\nYou read about a professional nutritionist that helps people improve their diet.\nCall the nutritionist’s office and ask three or four questions to get more information.\n\n: Hi, I’m calling to ask about your nutrition program.\nI want to get some advice on improving my diet.\nI want to get healthy again.\n\nWhat kind of programs are available?\nCan you tell me how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\n\nCan you recommend something for me?\nI think I need to get some help.\n==================================================================\nAlso can you give me some directions to your office?\nI wonder if I could drive my car there.\nIs there are parking lot?\nIf so, how much is it for parking?\nIf not, I will just take public transportation.\n\nPlease give me a call when you get this.\nThank you."}, {"slide": 183, "text": "Q12 : 야근을 해야 해서 영양사와의 예약을 전화로 변경 요청하고 대안 제시\nYou have an appointment to meet with a nutritionist who can help you make your diet healthier. However, on the day, of the appointment, your boss asks you to work late. Call the nutritionist, explain the situation, and offer some alternatives.\n\n: Hi, my name is Brian Lee.\nI am supposed to come in/ for an appointment later today.\n\nHowever, I do not think I can make it to the appointment.\nSomething has come up suddenly.\nMy boss is asking me to work late.\nI am very sorry for canceling like this.\n\nI want to reschedule the appointment.\n\nWhen is a good time for you?\nI am free next Monday.\nAre you available that day?\nIf not, I can make some time next Thursday or Friday.\n\nPlease give me a call when you get this. Thank you."}, {"slide": 184, "text": "Q13 : 본인의 과거 식습관이나 운동에 큰 변화를 준 경험 설명\nDescribe a time when you made a significant change to your diet or exercise routine.\nWhat led to this change? How did it work out?\nDescribe what happened in detail from beginning to end.\n\n: Eating healthy was one of the most significant changes I made to my life.\nI tried to eat healthy every day.\n\nFor starters, I tried to eat vegetables and fruits as often as I could.\nThey contain a lot of vitamins, minerals and fiber.\nMy favorite vegetables are tomatoes and potatoes.\nI also like to have cabbages and onions.\nI also like cucumbers and carrots because they are very crunchy.\nI like to have peaches and grapes when they are in season.\n\nNext, I tried to eat fish, pork, beef and chicken breasts as much as I could.\nI tried to eat beans and tofu whenever I had the chance.\nThey are rich in healthy protein.\n\nAlso, I tried to eat organic food whenever I could.\nThey are NOT grown with chemicals, so they are much healthier.\n\nIn the end, eating properly helped me stay healthy and lose some weight."}], "aliases": ["Nutritionist"]}, {"key": "health/food", "label_ko": "건강식품 (RP)", "label_en": "RP_health/food", "scripts": [{"slide": 194, "text": "Q11 : 건강 식품 상점에 전화문의\nThere is a new health food store in your town.\nCall the store and ask three or four questions to learn more about the store.\n\n: Hi, I am calling to ask about some health food products.\nI want to get some vitamins.\n\nWhat kind of products are available?\nCan you tell me how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\n\nCan you recommend something for me?\nI think I need to get some help.\n==================================================================\nAlso can you give me some directions to your store?\nI wonder if I could drive my car there.\nIs there a parking lot?\nIf so, how much is it for parking?\nIf not, I will just take public transportation.\n\nPlease give me a call when you get this.\nThank you."}, {"slide": 195, "text": "Q12 : 구매한 건강 식품에 문제 있어서 전화로 문제 해결\nAfter purchasing a food item at the store, you have discovered that something is wrong with the item.\nCall the store and explain the problem in detail and propose a solution.\n\n: Hi, I am a person who got a product at your store.\n\nHowever, there is a problem with the item I bought.\nI think I got the wrong item.\nThis is NOT the product I had in mind.\n\nI want to get an exchange.\nI wonder if I could get a refund if I want to.\n\nWould that be possible?\nI am sorry for all the trouble.\n\nWhen is a good time to visit your store?\nWhat are your business hours?\nHow late are you open?\n\nPlease give me a call when you get this. Thank you."}, {"slide": 196, "text": "Q13 : 기억에 남는 본인의 식사 자리 경험 묘사\nWe sometimes have interesting experiences when we have meals with family, friends or co-workers.\nTell me about a memorable meal you had. Who were you with and where did you have the meal? What kind of food did you have?\n\n: My family and I had dinner near my home last weekend.\n\nWe went to a decent seafood restaurant.\nThey had the best seafood in town.\n\nThe food tasted extra good because I was starving.\nThe lobster and crab dishes were so juicy and tender.\n\nWe also ordered some side dishes.\nPlus, we grabbed some drinks while having the meal.\n\nI was very happy with the meal we had there.\nI look forward to going there again because I liked the food so much.\n\nLooking back, it was a very enjoyable dinner."}], "aliases": ["Health Food"]}, {"key": "gym", "label_ko": "헬스장 (RP)", "label_en": "RP_gym", "scripts": [{"slide": 197, "text": "Q11 : 피트니스 센터에 등록하고 싶은 강습 전화 문의\nI’d like to give you a situation and ask you to act it out.\nYou want to enroll for a class at a fitness center.\nCall the fitness center and ask questions about their programs.\nQ11 : 새로운 헬스장에 시설 관련 전화 문의 \nI’d like to give you a situation and ask you to act it out.\nYou want to join a new gym.\nCall the gym and ask three or four questions to find out more about what they have to offer.\n\n: Hi, I am calling to ask about your fitness center [=gym]\nI want to sign up for a membership.\n\nWhat kinds of programs are available?\nCan you tell me how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\n\nCan you recommend something for me?\nI think I need to get some help.\n==================================================================\nAlso can you give me some directions to the fitness center[=gym]?\nI wonder if I could drive my car there.\nIs there a parking lot?\nIf so, how much is it for parking?\nIf not, I will just take public transportation.\n\nPlease give me a call when you get this.\nThank you."}, {"slide": 198, "text": "Q12 : 트레이너에게 전화로 트레이닝 불참 통보 및 대안 제시\nI am sorry, but there is a problem which I need you to resolve.\nThere is an emergency, and you cannot make it to the session with your personal trainer.\nCall your trainer and explain the situation.\nGive some alternatives to make arrangements for a schedule change.\n\n: Hi, my name is Brian Kim.\nI am supposed to come in for a session later today.\n\nHowever, I do NOT think I can make it to the session.\nSomething has come up suddenly.\n\nI have a family emergency.\nMy son is very sick because he has food poisoning.\nI have to take him to the doctor and look after him.\nI am so sorry for canceling like this at the last minute.\n\nI want to reschedule the session.\n\nWhen is a good time for you?\nI am free next Monday.\nAre you available that day?\nIf not, I can make some time next Thursday or Friday.\n\nPlease give me a call when you get this. Thank you."}, {"slide": 199, "text": "Q12 : 헬스장 첫 방문 후에 마음에 들지 않아서 전화로 환불 요청\nI am sorry, but there is a problem which I need you to resolve. When you visit the gym for the first time,\nIt is not what you expected. Call the gym manager and describe your experience in detail. And then, make an arrangement to get a full refund for your money.\n\n: Hi, I am a person who signed up for a membership at your gym.\n\nHowever, there is a problem with the gym.\nI visited your gym, but it was NOT what I had expected.\nIt was very small and not clean at all.\nI think I got the wrong item.\nPlus, there were too many people at the gym, and it was very crowded.\n\nI want to cancel my membership.\nI wonder if I could get a full refund if I want to.\n\nWould that be possible?\nI am sorry for all the trouble.\n\nWhen is a good time to visit your gym?\nWhat are your business hours?\nHow late are you open?\n\nPlease give me a call when you get this. Thank you."}, {"slide": 200, "text": "Q13 : 건강을 위해 본인이 해본 일들 묘사\nThat’s the end of the situation.\nHave you ever tried anything to become healthier?\nTell me everything that you did to improve your health.\nQ13 : 본인의 건강 증진을 위해 했던 도전 과거 설명\nThat’s the end of the situation.\nMaintaining one’s health can be a big challenge.\nTell me in detail about a challenge you faced related to maintaining or improving your health.\nMaybe you tried a difficult diet or maybe you tried to stop smoking. Tell me everything that you did.\n\n: Eating healthy was one of the most effective ways to stay healthy.\nI tried to eat healthy every day.\n\nFor starters, I tried to eat vegetables and fruits as often as I could.\nThey contain a lot of vitamins, minerals and fiber.\nMy favorite vegetables are tomatoes and potatoes.\nI also like to have cabbages and onions.\nI also like cucumbers and carrots because they are very crunchy.\nI like to have peaches and grapes when they are in season.\n\nNext, I tried to eat fish, pork, beef and chicken breasts as much as I could.\nI tried to eat beans and tofu whenever I had the chance.\nThey are rich in healthy protein.\n\nAlso, I tried to eat organic food whenever I could.\nThey are NOT grown with chemicals, so they are much healthier.\n\nIn the end, eating properly helped me stay healthy and lose some weight."}], "aliases": ["Fitness Center"]}, {"key": "store", "label_ko": "상점 (RP)", "label_en": "RP_store", "scripts": [{"slide": 210, "text": "Q11 : 옷가게에 가서 직원에게 옷 구매에 대해 문의\nI'd like to give you a situation and ask you to act it out.\nYou are at a clothing store and need to get some clothes.\nAsk two to three questions about the clothes you would like to buy.\n\nQ11 : 옷가게에 가서 직원에게 사고 싶은 의상에 대한 질문\nI'd like to give you a situation and ask you to act it out. You need to buy some clothes.\nGo to a clothing store and tell the salesperson about the piece of clothing you want to buy.\nAsk two to three questions about all the things you need to know about that type of clothes.\n\n: Hi, I want to get /some new clothes.\nI want (to get) /a new shirt.\nI am going on a vacation and I need to buy some T-shirts.\nmy favorite colors are blue and green.\nI want to buy shirts in those colors.\nI may buy more than one.\n\nWhat kinds of /shirts are available?\nCan you tell me/ how much they are?\n\nI wonder/ if there are any discounts or promotions (going on.)\nI want (to get) a good deal.\nCan you recommend something for me?\nI think I need (to get) some help."}, {"slide": 211, "text": "Q12 : 배달된 셔츠에 문제가 있어서 전화로 문제 해결\nI'm sorry but there is a problem which I will need you to resolve. The clothes you have ordered have arrived, but one of the shirts has a problem. Call the clothing store and explain the problem. Give two to three or alternatives to solve the problem.\n\nQ12 : 구매한 물품이 손상되어 상점에 전화로 문제 해결\nI＇m sorry but there is a problem which I would need you to resolve. Once you get home with an item you bought, you realize that the item is damaged. Call the store and explain the situation and state what you want to do to resolve the situation.\n\n: Hi, I'm a person/ who got some new clothes at your store.\nHowever, there is a problem with the shirt I got.\nThere is a button that is missing.\nPlus, there is a stain on the left sleeve.\nI am very unhappy/ with this shirt.\n\nI want to get an exchange.\nI wonder/ if I could get a refund if I want to.\nWould that be possible?\nWhen is a good time to visit your (store?)\nwhat are your business hours?\nHow late/ are you open?\n\nPlease give me a call when you get this.\nThank you."}, {"slide": 212, "text": "Q12 :  셔츠 하나가 잘못 배달이 와서 전화로 문제 해결\nI am sorry, but there is a problem which I will need you to resolve. The clothes you have ordered arrived home, but one of the shirt is not the correct one. Call the clothing store and explain the problem. Make two to three suggestions as to how and when you can get the correct shirt.\n\n: Hi, I'm a person/ who got some new clothes at your store.\nHowever, there is a problem with the shirt (I got.)\nThis is not the one I ordered.\nI think there was a mistake.\nI ordered a white T-shirt, but the one I got is black.\nI am very unhappy/ with the wrong delivery.\n\nI want/ to get an exchange.\nI wonder/ if I could get a refund if I want to.\nWould that be possible?\nWhen is a good time/ to visit your store?\nwhat are your business hours?\nHow late/ are you open?\n\nPlease give me a call/ when you get this.\nThank you."}, {"slide": 213, "text": "Q13 : 본인이 구매했던 옷에 문제가 있었던 경험 묘사\nThat's the end of the situation. Have you ever bought a piece of clothing and found out that there was a problem with it? Perhaps, there was a rip or a stain on the clothing.\nTell me what the problem was and what you did to solve the situation.\n\n:  I remember shopping/ for some jeans recently.\n\nI found a pair of jeans I really liked at a store.\nHowever, the store did not have my size in stock.\nBecause they were sold out.\nI could not find the jeans I wanted, so I had to buy another one instead.\n\nPlus, I remember getting a jacket online.\nHowever, when I tried it on at home, it did not fit well.\nI did not like how I looked in the jacket.\nSo, I sent it back to get an exchange.\n\nNext, I once bought a coat at a store.\nHowever, when I saw it again at home, it did not look good on me.\nSo, I went back to get a refund.\n\nSo, these were the problems I have had while shopping."}, {"slide": 214, "text": "Q11 : 좋아하는 상점에 직접 가서 세일 관련 질문\nI’d like to give you a situation and ask you to act it out. You see a sign at your favorite store that says that they are having a big sale. Go to the store and ask three or four questions to get as much information as possible about the sale.\n\n:  Hi, I want to ask about the sale.\nI want to get a new shirt.\nI'm going on a vacation and I need to buy some T-shirts.\nMy favorite colors are blue and green.\nI want to buy shirts in those colors.\nI may buy more than one.\n\nWhat kinds of shirts are available?\nCan you tell me how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\nCan you recommend something for me?\nI think I need to get some help."}, {"slide": 215, "text": "Q13 : 고장이 나거나 손상된 물건을 구매했던 경험 설명\nThat's the end of the situation. Have you ever bought something that did not work or was damaged? Tell me about the item you bought that did not function properly or was damaged. Explain what the item was, what was wrong and what you did to resolve the situation.\n\n:  I remember when I bought an alarm clock online.\nI took the clock out of the box and put the batteries in.\nHowever, it did not work properly.\nIt was frustrating.\nEventually, I sent it back to get a refund."}, {"slide": 216, "text": "Q11 : 좋아하는 상점에 전화해서 세일 관련 질문\nI’d like to give you a situation and ask you to act it out. You see a sign at your favorite store that says that they are having a big sale.\nCall the store and ask three or four questions about that special sale.\n\n: Hi, I'm calling to ask about the sale.\nI want to get a new shirt.\nI'm going on a vacation and I need to buy T-shirts.\nMy favorite colors are blue and green.\nI want to buy shirts in those colors.\nI may buy more than one.\n\nWhat kinds of shirts are available?\nCan you tell me how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\nCan you recommend something for me?\nI think I need to get some help.\n===============================================================\nAlso, can you give me a some directions to the store?\nI wonder if I could drive my car there.\nIs there a parking lot? If so, how much is it for parking?\nIf not, I’ll just take public transportation.\n===============================================================\nPlease give me a call when you get this. Thank you."}, {"slide": 217, "text": "Q12 : 구매 물건이 세일 가격 적용이 안되어 전화로 문제 해결 (adv)\nI’m sorry. There is a problem which I will need you to resolve. Once you get home with the things you bought, you realize that you did not get them at the sale price. Call the store and explain the situation and offer several ways to resolve the situation.\n\n: Hi, I'm a person who got some new shirts at your store.\nHowever, there is a problem with the shirts I got.\n\nI took a look at the receipt when I got home.\nBut the price I paid does not look like the sale price.\nI think the discount was not applied properly.\nI bought the shirts because they were on sale.\nI clearly remember the 30% discount sign at the store.\n\nI want to get an exchange.\nI wonder if I could get a refund if I want to.\nWould that be possible?\nWhen is a good time to visit your store?\nWhat are your business hours?\nHow late are you open?\nPlease give me a call when you get this. Thank you."}, {"slide": 218, "text": "Q13 : 본인이 쇼핑 중 겪었던 문제와 해결 방법 설명 (adv)\nThat’s the end of the situation. Have you ever had a problem while you are shopping? Perhaps, a store did not have an item you wanted. Or perhaps, something was too expensive. Tell me about that problem in detail and what you did to deal with the situation.\n\nQ13 : 기억에 남는 쇼핑 경험이나 겪은 문제 설명 (adv)\nThat's the end of the situation. I'd like to now know about your shopping experience that was particularly memorable. It might have been about a special gift you bought or perhaps an interesting experience with a salesperson or even a problem with the purchase. Can you talk about that memorable experience? Describe the circumstances, the items you bought, how things turned out in the end.\n\n: I remember shopping for some jeans recently.\nI found a pair of jeans I really liked at a store.\nHowever, the store did not have my size in stock.\nBecause they were sold out.\nI could not find the jeans I wanted, so I had to buy another one instead.\n\nPlus, I remember getting a jacket online.\nHowever, when I tried it on at home, it did not fit well.\nI did not like how I looked in the jacket.\nSo, I sent it back to get an exchange.\n\nNext, I once bought a coat at a store.\nHowever, when I saw it again at home, it did not look good on me.\nSo, I went back to get a refund.\n\nSo, these were the problems I have had while shopping."}, {"slide": 219, "text": "Q11 : 가장 좋아하는 상점의 세일에 대해 친구에게 질문\nI'd like to give you a situation and ask you to act it out. Your friend tells you about a great sale happening at one of your favorite stores. Ask your friend three or four questions to find out as much as you can about the sale.\n\nQ11 : 새로 오픈한 상점의 대해 친구에게 질문\nI'd like to give you a situation and ask you to act it out. There is a newly-opened store. Call your friend who knows about the new store and ask some questions about the store to get some information.\n\n: Hi, Brian.\nI'm calling to ask about the sale at the store you talked about.\nI want to get some new clothes.\nI'm going on a vacation and I need to buy some T-shirts.\nMy favorite colors are blue and green.\nI want to buy shirts in those colors.\nI may buy more than one.\n\nWhat kinds of shirts are available?\nCan you tell me how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\nCan you recommend something for me?\nI think I need to get some help.\n\nAlso can you give me some directions to the store?\nI wonder if I could drive my car there.\nIs there are parking lot?\nIf so, how much is it for parking?\nIf not, I will just take public transportation.\nPlease give me a call when you get this.\nThank you."}, {"slide": 220, "text": "Q12 : 구매한 물건 하나를 상점에 두고 와서 전화로 도움 요청\nI'm sorry but there is a problem which I will need you to resolve. You went to the sale and bought several items, but when you returned home, you are surprised to discover that one item is missing. Call the store and leave a message explaining your problem with as much detail as possible. Suggest several solutions to the situation.\n\n:  Hello, I am a person who bought some clothes from your store.\nHowever, I left (a shirt) (behind) at the store.\nIt is white with some letters on the front. It is in a big plastic (paper) bag.\nI think I left it on the counter.\n\nCould you check if you have my shirt? I need to find it ASAP.(as soon as possible)\nIf it is there, can you hold on to it?\nI will stop by to pick it up right away. (tomorrow)\n\nAre you available? / is it possible?/ Would that be possible?\nI am sorry for the problem/ I am sorry for the trouble.\n\nWhen is a good time to visit there (your store)?\nWhat are your business hours?\nHow late are you open?\nPlease give me a call when you get this.\nThank you."}, {"slide": 221, "text": "Q12 : 지갑을 상점에 두고 와서 전화로 도움 요청\nI＇m sorry but there is a problem which I will need you to resolve. You left your wallet behind at the store. Call the store and explain your situation. Give several alternatives to solve the problem.\n\n: Hello, I am a person who bought some clothes from your store.\nHowever, I think I left (a wallet) (behind) at the store.\nIt is a black leather wallet. It has my credit card, my ID card in it.\nI think I left it on the counter.\n\nCould you check if you have my wallet? I need to find it ASAP.(as soon as possible)\nIf it is there, can you hold on to it?\nI will stop by to pick it up right away. (tomorrow)\n\nAre you available? / Would that be possible?\nI am sorry for the problem/ the trouble.\n\nWhen is a good time to visit there (your store)?\nWhat are your business hours?\nHow late are you open?\nPlease give me a call when you get this.\nThank you."}, {"slide": 222, "text": "Q13 : 본인이 무엇인가를 어디에 두고 온 경험 묘사\nThat's the end of the situation. Have you ever left something behind at a restaurant or at a store? It can be your wallet, your cell phone, or anything that was important. Give me all the details.\n\n:  I remember when I left my umbrella behind at a store.\n\nI forgot to pack (put) it when I left the store.\n\nIt was raining and I got a little wet.\nI had to buy a new umbrella.\n\nSince then, I try to be more careful not to leave my umbrella behind."}, {"slide": 223, "text": "Q11: 친구가 말한 식료품점에 대해 친구에게 전화로 질문\nYour friend has told you about our great food store. Call your friend and ask two or three questions about the food store he talked about.\n\n: Hi, Brian.\nI'm calling to ask about the food store you talked about.\nI want to get groceries there.\nI need to get some vegetables and fruit such as bananas and tomatoes.\nI also need to get some beef and chicken.\nI also want to pick up some beer and wine.\n\nWhat kind of groceries are available?\nCan you tell me how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\nCan you recommend something for me?\nI think I need to get some help.\n\nAlso can you give me some directions to the store?\nI wonder if I could drive my car there is there.\nIs there a parking lot?\nIf so, how much is it for parking?\nIf not, I will just take public transportation.\nPlease give me a call when you get this.\nThank you."}, {"slide": 224, "text": "Q11 : 새로운 상점 찾다가 길을 잃음. 음식점에 들어가서 안내 요청 (int)\nI'd like to give you a situation and ask you to act it out. You are trying to find a store that has just opened recently. But got lost while doing so. Go to the closest restaurant and ask for three to four questions about where the new store is.\n\n: Hi, can I ask for some help?\nI seem to be lost.\nI'm looking for a store that opened recently.\nThe name of the store is Jamba Juice.\nI can’t find the store.\nI tried to find it on my phone, but I could not.\nIt says on my map that it is nearby.\nCan you give me some directions?\nCan you point me in the right direction?\nWhich is the fastest (faster) way to the store?\nIs there a shortcut by any chance?"}, {"slide": 225, "text": "Q12 : 구매한 물품 중 일부를 종업원이 누락하고 담아 주지 않아 전화로 도움 요청\nA new food store has opened in your neighborhood. You visited the store and purchased some items. However, when you got home, you found out that the clerk left out some items from your food cart. Call the Store, explain the situation and make suggestions to solve the problem.\n\n: Hi, I'm a person who got groceries at your store.\nHowever, I think I left some of my groceries behind.\n\nI think the clerk left out some items from my food cart.\nI got some meat and chicken.\nThey are not in my grocery bags.\nI'm sure I got them because they are on my receipt.\nCould you please check if you have my groceries?\nI really need to find it ASAP.\nIf it is there, can you hold on to it?\nI’ll stop by to pick it up right away.\n\nWould that be possible?\nWhen is a good time to visit your store?\nWhat are your business hours?\nHow late are you open?\nPlease give me a call when you get this.\nThank you."}, {"slide": 226, "text": "Q13 : 본인이 가는 식료품점을 찾는 방법과 상점에 대해 설명\nTell me about how you found a food store. Where is it located and why do you like going there? What do you like to shop for there? Give me all the details about that food store you go to.\n\n:  I get groceries at a local supermarket chain.\nIt was easy to find because it was not far from my home.\n\nThe store is very large in size.\nThey sell everything from fresh vegetables to all kinds of seafood.\nSo, there are a lot of options to choose from.\nThey have a good prices and good-quality goods.\nSo I can get great deals there.\n\nI'm a regular and I go there at least once or twice a week on average.\n\nSo, this is the grocery store I often go to."}], "aliases": ["Store"]}, {"key": "restaurant", "label_ko": "음식점 (RP)", "label_en": "RP_restaurant", "scripts": [{"slide": 239, "text": "Q11 : 친구의 가족이 개업한 음식점에 대해 친구에게 문의\nI ‘d like to give you a situation and ask you to act it out.\nYour friend had a family member who has just opened up a restaurant.\nAsk three or four questions to learn more about this new restaurant to decide whether you want to order food from it.\n\n: Hi, Brian.\nI am calling to ask about your uncle’s new restaurant.\nI want to order (in) some food from there.\n\nWhat kind of menus are available?\nCan you tell me how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\n\nCan you recommend something for me?\nI think I need to get some help.\n==================================================================\nAlso can you give me some directions to the restaurant?\nI wonder if I could drive my car there.\nIs there a parking lot?\nIf so, how much is it for parking?\nIf not, I will just take public transportation.\n\nPlease give me a call when you get this. Thank you."}, {"slide": 240, "text": "Q12 : 잘못 배달된 점심 도시락 음식점에 전화해서 문제 해결\nI am sorry, but there is a problem which I need you to resolve.\nYou ordered food to be delivered to your workplace for a lunch meeting. When you opened the package, you realize that the delivery person has brought you someone else’s order.\nCall the restaurant, talk to the manager and offer two or three solutions to the problem so that you can get the correct order as soon as possible.\n\n: Hi, I am a person who ordered lunch from your restaurant.\n\nHowever, there is a problem with the lunch.\nI think I got the wrong menu.\nThis is NOT the menu I asked for.\nI ordered a tuna sandwich, but the one I got is a chicken sandwich. ( I got a chicken sandwich)\n\nI want to get an exchange ASAP.\nI wonder if I could get a refund if I want to.\n\nWould that be possible?\nI am sorry for all the trouble.\n\nPlease give me a call when you get this. Thank you."}, {"slide": 241, "text": "Q13 : 최근 음식점에서 했던 특별했던 식사 자리 묘사\nThat’s the end of the situation.\nTell me about a time when you went out for a special meal with your family, friends or co-workers. \nWhat was the occasion?\nWhere did you go and what happened during the meal?\nTell me what happened from beginning to end.\n\n: My family and I had dinner near my home last weekend.\nIt was my mom’s birthday.\n\nWe went to a decent Italian restaurant.\nThey had the best pizza and pasta in town.\n\nThe food tasted extra good because I was starving.\nThe main dish was very tasty.\n\nThe beef in the dish were so juicy and tender.\nI really liked the sauce and the seasoning in the food as well.\n\nWe also ordered some side dishes.\nPlus, We grabbed some drinks while having the meal.\nThe drinks went very well with the food.\n\nLooking back, it was a very enjoyable dinner.\nI look forward to going there again if I have the chance."}, {"slide": 242, "text": "Q11 :새로 개업한 음식점에 전화해서 음식점에 대해 문의\nI ‘d like to give you a situation and ask you to act it out.\nYou would like to go to a new restaurant that has opened recently.\nCall the restaurant and ask three or four questions to see if you want to go to that restaurant.\n\n: Hi, I am calling to ask about your new restaurant.\n\nI want to get together with my friends this weekend.\nI am planning on going to that new place.\nI want to get some details about your restaurant.\n\nWhat kind of menus are available?\nCan you tell me how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\n\nCan you recommend something for me?\nI think I need to get some help.\n==================================================================\nAlso can you give me some directions to the restaurant?\nI wonder if I could drive my car there.\nIs there a parking lot?\nIf so, how much is it for parking?\nIf not, I will just take public transportation.\n\nPlease give me a call when you get this. Thank you."}, {"slide": 243, "text": "Q12 : 현금과 신용카드를 집에 두고 와서 직원에게 외상 요청\nI am sorry, but there is a problem which I need you to resolve.\nYou just had a great meal at the new restaurant.\nBut after your meal, you found out that you left your money and credit card at home.\nExplain your situation to the staff and make suggestions to solve the problem.\n\nHi, I’m so sorry but I can’t find my wallet.\nI think I left it behind at home.\n\nI do not have any cash on me right now.\nI do not have my credit card either because it is in my wallet.\nSo, I do not think I can pay for the food right now.\n\nI wonder if I could pay for the food tomorrow.\nI could stop by on my way home.\nI could give you my contact info.\nHere is my business card.\n\nOr, could you give me an account number?\nMaybe I could wire the money to you when I get home.\n\nWould that be possible?\nI am sorry for all the trouble."}, {"slide": 244, "text": "Q13 : 최근 음식점에서 했던 특별했던 식사 자리 묘사\nThat’s the end of the situation.\nTell me about a memorable experience you had at a restaurant.\nMaybe you did not like the food you ordered.\nMaybe there was some issue with other customers.\nTell me everything about the incident you encountered.\nQ13 :  음식점에서 있었던 예기치 않았던 본인 에피소드 묘사 \nThat’s the end of the situation.\nHave you ever had anything memorable happen to you when you were going to a restaurant?\nMaybe someone was late or got lost something interesting happened during the meal. \nExplain your experience in detail.\nWhat was the situation and what happened from start to finish?\n\n: I remember eating too fast at a restaurant.\nI think indigestion, and it was pretty bad.\n\nMy stomach was upset and I feel like throwing up.\nI also had a fever and felt lightheaded.\nI tried to find some medicine but I could not find any.\n\nSo, I went to the drug store to get some medicine.\nI told our pharmacist about my symptoms.\nHe gave me something that would make me feel better.\n\nI came back home and took some medicine to get better.\nI had to stay inside and get plenty of rest.\n\nSince then, I tried to be more careful when I eat something."}, {"slide": 245, "text": "Q11 : 내일 함께 저녁 식사할 음식점에 대해 친구에게 전화 질문\nI ‘d like to give you a situation and ask you to act it out.\nA friend has invited you for dinner tomorrow night at a restaurant that you’ve never been to.\nCall your friend and leave a voice mail message asking three or four questions about the restaurant.\n\n: Hi, I am calling to ask about the restaurant we are going to have dinner at.\nWe are supposed to meet there tomorrow evening. right?\nI want to get some details.\n\nWhat kind of menus are available?\nCan you tell me how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\n\nCan you recommend something for me?\nI think I need to get some help.\n==================================================================\nAlso can you give me some directions to the restaurant?\nI wonder if I could drive my car there.\nIs there a parking lot?\nIf so, how much is it for parking?\nIf not, I will just take public transportation.\n\nPlease give me a call when you get this. Thank you."}, {"slide": 246, "text": "Q12 : 저녁 식사 가는
