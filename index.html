 길에 사고로 도로 정체. 친구에게 상황 설명. 대안 제시\nI am sorry, but there is a problem which I need you to resolve.\nOn your way to the restaurant, you were delayed by an accident on the road.\nCall your friend’s cell phone and leave a message for your friend.\nExplain the situation and offer two or three alternatives.\n\n: Hi, Brian.\nI have some bad news.\n\nI do not think I can make it to dinner on time.\nI am stuck in traffic because of an accident that happened.\nCars are not moving at all.\nI think I will be very late for dinner.\nI am really sorry, but there is nothing I can do.\n\nCan you tell me what you want to do?\nWhy don’t you have dinner by yourself?\nPerhaps, we could grab some drinks later on.\nOr, maybe we could just have coffee.\n\nAnyway, please tell me what you think.\nI am fine with whatever you decide.\nI’ll be waiting for your call. Bye."}], "aliases": ["Restaurant(RP)"]}, {"key": "party/celebration", "label_ko": "파티/축하 (RP)", "label_en": "RP_party/celebration", "scripts": [{"slide": 257, "text": "Q11 : 친구에게 휴일파티에 대해 전화질문\nI ‘d like to give you a situation and ask you to act it out.\nYou have been invited to a holiday party.\nCall your friend and ask when the party starts and what you should bring there.\nAsk two or three more questions about the party.\n\nQ11 : 친구가 초대한 파티에 대해 전화로 질문\nI’d like to give you a situation and ask you to act it out. An old friend called to ask you to come to a party.\nCall your friend and ask three to four questions to find out everything you need to know.\n\nQ11 : 친구의 휴일 파티 준비를 도와주기 위해 전화로 질문\nI’d like to give you a situation and ask you to act it out.\nYour friend is thinking about having a holiday party and has asked for your helps to plan the event.\nCall you friend and ask three or four questions to find out more about the party.\n\nHi, Brian. I am calling to ask about the holiday party.\n\nI want to get some details.\nFirst, can you tell me when the party starts?\nShould I be there by six?\n\nNext, can you tell me what I should bring to the party?\nShould I bring some food or drinks?\n\nPlus, I wonder if you need any help with anything.\nDo you want me to help you set up the tables?\nOr, do you want me to help you clean up afterwards?\n\nAlso, can you give me some directions to the party venue?\nI wonder if I could drive my car there.\nIs there a parking lot?\nIf so, how much is it for parking?\nIf not, I‘ll just take public transportation.\nPlease give me call when you get this. Thank you."}, {"slide": 258, "text": "Q12 : 차 사고가 나서 파티에 늦게 될 상황을 친구에게 전화로 설명하고 대안제시\nI am sorry, but there is a problem which I need you to resolve. You just had a car accident and you think you are going to be late for the holiday party. Call your friend, explain the situation, and give two or three alternatives regarding the situation.\n\n: Hi, Brian. I have some bad news.\n\nI do not think I can make it to the party on time.\nI had a car accident on my way to the party.\nI called my insurance company and I am waiting right now.\nThis may take a while, and I think I will be very late.\n\nCan you tell me what you want to do?\nWhy don’t you have dinner by yourself?\nPerhaps, we could grab some drinks later on.\nOr, maybe we could just have coffee.\n\nAnyway, please tell me what you think.\nI am fine with whatever you decide.\nI ‘ll be waiting for your call. Bye."}, {"slide": 259, "text": "Q12 : 친구의 파티 준비를 도와줄 시간이 많지 않아 전화로 대안 제시\nI am sorry, but there is a problem which I need you to resolve. After you agreed to help plan the party with your friend, you realize that you will be very busy the week before the party. Since you have less time to help your friend, call him, explain the situation. Offer two or three suggestions as to how to plan the party in less time.\n\n: Hi, Brian. I have some bad news.\n\nI know that I am supposed to help you plan the party.\n\nHowever, I realized that I will be very busy the week before the party.\nSo, I will not have much time to help you.\n\nHere is what I can do.\nWhy don’t I ask someone else to help you?\nHow about I ask my sister or brother to help you out?\nOr, maybe I could ask one or my friends to give you a hand.\n\nAnyway, please tell me what you think.\nI am fine with whatever you decide.\nI’ll be waiting for your call. Bye."}, {"slide": 260, "text": "Q13 : 막판에 파티나 여행을 취소한 본인 경험 묘사\nThat’s the end of the situation. Have you ever made plans for a trip or a party but had to cancel at the last minute because of something that happened unexpectedly?\nTell me everything about what happened that prevented you from going.\nQ13 : 파티나 행사에 불참하게 된 본인 경험 묘사\nThat’s the end of the situation. Tell me about a time when you really wanted to go to a party or a celebration, but for some reason you could not go. What happened? Tell me the whole story from beginning to end.\n\n: I remember when I was supposed to go to a party with my friends.\n\nHowever, I got really sick because I came down with the flu.\nI had a high fever and I felt dizzy.\nI was also losing my voice.\nI was in no condition to go to a party.\n\nI felt bad about canceling at the last minute, but there was nothing I could do.\nI told my friends that I could not make it and said I was sorry.\n\nLooking back, I regret missing the party that time."}, {"slide": 261, "text": "Q11 : 친구 집으로 휴일 식사에 초대받고 식사에 대해 전화로 질문\nI’d like to give you a situation and ask you to act it out.\nYour friend has invited you to a holiday meal.\nCall your friend and ask three or four questions about the meal.\n\n: Hi, Brian. I am calling to ask about the holiday meal.\n\nI want to get some details.\nFirst, can you tell me when the dinner starts?\nShould I be there by six or seven?\n\nNext, can you tell me what I should bring to the dinner?\nShould I bring some dessert or snacks?\n\nPlus, I wonder if you need any help with anything.\nDo you want me to help you set up the tables?\nOr, do you want me to help you clean up afterwards?\n\nAlso, can you give me some directions to your place?\nI wonder if I could drive my car there.\nIs there a parking lot?\nIf so, how much is it for parking?\nIf not, I‘ll just take public transportation.\nPlease give me call when you get this. Thank you."}, {"slide": 262, "text": "Q12 : 친구집에 가는 길에 차가 고장 나서 매우 늦을 거 같아 대안 제시\nI am sorry, but there is a problem which I need you to resolve.\nYour car broke down on your way to your friend’s house.\nYou think you will be very late to the meal.\nCall your friend, explain the situation. And then, talk about when and how you plan to get there, even though you will be late.\n\n: Hi, Brian. I have some bad news.\n\nI do not think I can make it to the dinner on time.\nMy car broke down on my way to your place.\nI called my insurance company and I am waiting right now.\nThis may take a while, and I think I will be very late.\nHowever, I still plan to go.\n\nCan you tell me what you want to do?\nWhy don’t you have dinner by yourself?\nPerhaps, we could grab some drinks later on.\nOr, maybe we could just have coffee.\n\nAnyway, please tell me what you think.\nI am fine with whatever you decide.\nI ‘ll be waiting for your call. Bye."}, {"slide": 263, "text": "Q12 : 겹치는 선약이 있어서 파티에 못 가게 되어 친구한테 설명\nI am sorry, but there is a problem which I need you to resolve.\nYou already have plans for the evenings of the party.\nCall you friend, explain the situation, and offer two or three alternatives regarding the situation.\n\n: Hi, Brian. I have some bad news.\n\nI do not think I can make it to the party.\nI found out that I already have plans for the evening of the party.\nI have another engagement.\nI am supposed to meet up with another friend.\n\nI wonder if I could take a raincheck.\nWhy don’t I go next time?\nWhat do you say I go to the next party?\n\nAnyway, please tell me what you think.\nI am fine with whatever you decide.\nI ‘ll be waiting for your call. Bye."}, {"slide": 264, "text": "Q13 : 친구나 가족을 방문해 본 기억에 남는 본인 경험 묘사\nThat’s the end of the situation. Can you tell me about a memorable visit you made to your family or friends? Pick one of those special visits and tell me all about it. Start with some background about where and when it took place. And then, tell me the whole story of what happened during the visit.\n\n: I remember visiting my friend’s home for a housewarming party.\nWe all sat down and had a nice dinner together.\nWe also had some drinks while having the meal.\n\nHowever, I ended up drinking quite a lot that day.\nI got very drunk because I drank too much and I mixed drinks.\nI got wasted and blacked out and I do not remember how I got home.\n\nThe next day, I had a terrible hangover and I felt very miserable .\nMy stomach was upset and I felt like throwing up.\nI went to a drug store and got some hangover relief medication.\nBut still, it took me quite a while to sober up.\nI had to take it easy for some time.\n\nSince then, I try to be more careful when I drink."}, {"slide": 265, "text": "Q13 : 휴일에 잡아 놓은 계획에 차질을 빚은 본인 경험 설명.\nThat’s the end of the situation. Have you ever had problems with plans you had on a holiday?\nPerhaps, something unexpected did not enable you to do what you had planned to do. If could have been the weather or the traffic situation. Tell me everything about that experience and how you dealt with it.\n\n: I remember when I was stuck in traffic for a long time during the holidays.\nI was heading home from a trip.\n\nCars were not moving at all because traffic was bumper to bumper.\nBecause of the heavy traffic, it took me much longer than usual.\nIt took almost three hours to get to my destination.\n\nI felt exhausted because I was in the car too long.\nI even got carsick and felt light-headed.\n\nSince then, I try to head out early during the holidays."}, {"slide": 266, "text": "Q11 :친구에게 기념 모임 자리에 대해 질문\n\nA friend of yours invites you to attend a celebration in the area which she lives.\nAsk your friend three or four questions to learn more about this celebration.\n\n: Hi, Brian. I am calling to ask about the celebration.\nI want to get some details.\n\nFirst, can you tell me when the celebration starts?\nShould I be there by six or seven?\n\nNext, can you tell me what I should bring to the celebration?\nShould I bring some dessert or snacks?\n\nPlus, I wonder if you need any help with anything.\nDo you want me to help you set up the tables?\nOr, do you want me to help you clean up afterwards?\n\nAlso, can you give me some directions to the venue?\nI wonder if I could drive my car there.\nIs there a parking lot?\n\nPlease give me call when you get this. Thank you."}, {"slide": 267, "text": "Q12 : 집 수도관 파열로 참석 불가. 전화로 상황 설명 및 일정변경 제안\nOn the day of the celebration, a water pipe breaks in your home and you have to stay there until it is repaired. Call your friend, explain what has happened, and propose some alternative plans to see your friend at another time.\n\n: Hi, Brian. I have some bad news.\n\nI do not think I can make it to the celebration today.\nI have an emergency that I have to take care of.\nA water pipe at home broke.\nIt is leaking water all over the place and it is a mess.\nI had to wipe off the water from the floor.\nI called up a person to fix the problem.\nI have to stay at home until it is repaired.\n\nI want to reschedule the celebration.\n\nWhen is a good time for you?\nI am free next Monday.\nAre you available that day?\nIf not, I can make some time next Thursday or Friday.\n\nAnyway, please tell me what you think.\nI am fine with whatever you decide.\nI’ll be waiting for your call. Bye."}, {"slide": 268, "text": "Q13 : 본인 동네에 발생했던 기억에 남는 사건 묘사 (food poisoning)\nHas anything interesting or unusual ever happened in the area which you live?\nTell me in detail about the memorable event that has happened in your area.\nBe sure to tell me what happened from beginning to end.\n\n: I remember when the coronavirus broke out all across the nation.\nThere were many cases that occurred in my neighborhood as well.\n\nThere were more than 300 million confirmed cases worldwide, and the global death toll went over 5 million and is still rising.\nMeanwhile, the virus also spread widely in Korea.\nThe government declared a national health emergency.\nThere were strong quarantine measures for suspected patients in the initial stages.\nBut even so, over 500,000 people got infected and tested positive.\n\nThis virus had major effect globally and the WHO declared a global pandemic.\nMany countries set strong travel restrictions and shut down their borders.\nThe virus also took a huge toll on businesses as many of them had to close down.\nThe global economy also took a big hit."}], "aliases": ["Celebration"]}, {"key": "internet", "label_ko": "인터넷 (RP)", "label_en": "RP_internet", "scripts": [{"slide": 287, "text": "Q11 : 친구가 찾은 웹사이트에 대해 친구에게 전화로 질문\nI’d like to give you a situation ask you to act it out.\nYour friend has found a cool website. Call your friend and ask three or four questions about this new website.\n\n: Hi Brian.\nI'm calling to ask about the cool website you found.\nI want to go check it out myself.\n\nCan you tell me what kind of site it is?\nI wonder if it is a social networking site.\n\nIf so, can you “friend” or “follow” people?\nCan you post up pictures or video clips?\nCan you write messages or leave comments?\nCan you also press the LIKE button on other people’s postings?\n\nPlus, how long have you used that website?\nHow often do you use it and what is the best thing about it?\n\nI am very eager to check out that website.\nPlease give me a call when you get this. Thank you."}, {"slide": 288, "text": "Q12 : 그 사이트가 접속이 안 되어 친구에게 전화로 도움 요청\nI am sorry, but there is a problem which I will need you to resolve.\nWhen you tried to visit the site that your friend has recommended, nothing comes up. Call your friend and explain what happened. Then, make some suggestions as to how you might want to see the site as soon as possible.\n\n: Hi Brian.\nI am afraid there is a problem with the website.\n\nI tried to log on to the site, but it is not available.\nNothing shows up on the screen.\nPerhaps, you gave me the wrong link.\n\nI wonder if you could help me out.\nMaybe we could meet up to talk about it.\n\nWhen is a good time for you?\nI am free on Monday.\nAre you available that day?\nIf not, I can make some time on Thursday or Friday.\n\nAnyway, please tell me what you think.\nI am fine with whatever you decide.\nI’ll be waiting for your call. Bye."}, {"slide": 289, "text": "Q12 : 웹 브라우저 문제 발생. 인터넷 서비스 센터에 전화 도움 요청\nI am sorry, but there is a problem which I will need you to resolve.\nYou have tried to log on to that website, but there is something wrong with your web browser. Call the internet help desk and ask for help. Explain why you need to get help as soon as possible.\n\n: Hi I am calling to ask for some help.\n\nThere is something wrong with my web browser.\nI am having some connection problems.\n\nI cannot get access to a website I want to check out.\nNothing shows up on the screen.\nI do not know what the problem is.\nI tried everything, but nothing seems to be working.\n\nI want to get some help ASAP.\nI wonder if you could help me out.\n\nPlease give me a call when you get this. Thank you."}, {"slide": 290, "text": "Q13 : 본인이 인터넷을 하면서 겪은 문제와 대응 방법 묘사\nThat’s the end of the situation.\nHave you ever had a problem while you were surfing the internet?\nMaybe the site you were looking for was not available.\nMaybe you lost your internet connection.\nTell me about the time when you ran into some kind of problem.\nTell me everything that happened as well as what you did to fix the problem.\n\n: I get so much spam mails these days.\nThey are quite annoying.\nMy email account filters them out, but some get through from time to time.\n\nOnce, there was a spam mail in my in-box.\nSo, I blocked the address while deleting that email.\nIt was not the first time I did this.\nIn fact, I remember doing it several times.\n\nSo, spam mail is one of the most common problems I have on the internet."}, {"slide": 291, "text": "Q13 : 인터넷을 이용해서 본인이 최근에 한 프로젝트 묘사\nThat’s the end of the situation.\nHow did you use the internet to get a project done in the past?\nWhat was the project about? Give me all the details.\n\n: I remember doing a project at work a few months ago.\nI had to write a report for the project.\n\nI surfed the internet and did a lot of searches.\nI found some background information and some statistics.\nI gathered the data and put them in my report.\n\nThe report became better because there was a lot of information in it.\nIt was worth the time and effort.\n\nSo, surfing the internet was very helpful when I was doing my project."}], "aliases": ["Internet(RP)"]}, {"key": "phone", "label_ko": "전화기 (RP)", "label_en": "RP_phone", "scripts": [{"slide": 303, "text": "Q11 : 전화기 대리점에 신규 휴대전화 구매 문의\nI’d like to give you a situation ask you to act it out.\nYou would like to buy a new mobile phone.\nCall a store and tell them what you need. And then, ask three or four questions to find out about the phone they offer.\n\n: Hi, I'm calling to ask about new cell phones.\nI want to get a new phone.\nI watch video clips on my phone quite often, so I want a large screen.\nI also take a lot of pictures, so I want a good camera as well.\nI also want more memory on my phone than my current phone.\n\nWhat kinds of phones are available?\nCan you tell me how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\n\nCan you recommend something for me?\nI think I need to get some help.\n\nAlso, can you give me some directions to the store?\nI wonder if I could drive my car there.\nIs there a parking lot?\nIf so, how much is it for parking?\nIf not, I’ll just take public transportation.\nPlease give me a call when you get this. Thank you."}, {"slide": 304, "text": "Q12 : 구매한 전화기 기능이 마음에 들지 않음. 교환 요청.\nI am sorry, but there is a problem which I will need you to resolve.\nWhen you get the new phone, you realized that it does not have all the features you need.\nCall the store, explain what is missing, and make arrangements to get a phone that has what you need.\n\n: Hi, I am a person who got a new phone at your store.\nHowever, there is a problem with the phone.\n\nIt does not have all the features I need.\nYou see, I watch a lot of video clips and do video chats on my phone.\nSo, I wanted a phone with a large screen, but the screen is not big enough.\nPlus, I need more memory on the phone.\nThis one does not have enough memory.\n\nSo, I want to get an exchange.\nI wonder if I could get a refund if I want to.\n\nWould that be possible?\nI am sorry for all the trouble.\n\nWhen is a good time to visit your store?\nWhat are your business hours?\nHow late are you open?\nPlease give me a call when you get this Thank you."}, {"slide": 305, "text": "Q13 : 새로운 제품/기술이 마음에 들지 않았던 경험 묘사\nThat’s the end of the situation.\nHave you ever bought a piece of technology which was not what you had wanted or different from what you had expected? What was the problem and how did you solve the situation?\nTell me in detail about the beginning of the story until the end.\n\n: I remember getting a new phone a few years ago.\nIt was a nice phone and I really liked the new features.\nHowever, the only problem was that it ran out of battery too fast.\n\nOnce, my phone died when I was outside.\nIt was very inconvenient because my phone was dead.\nI had to check some messages, but I could not.\nI also wanted to do some online searches, but I could not.\nI wanted to call someone, but I could not.\nIt was very frustrating, I regretted not having charged my phone properly.\n\nEventually, I charged my phone after I got home.\nSince then, I sometimes carry around my charger or battery pack.\nIt is a bit of hassle, but I have no choice.\nI wish phone batteries would last longer."}, {"slide": 306, "text": "Q13 : 새로 개통한 전화기를 세팅해본 경험 설명\nThat’s the end of the situation.\nHave you ever had to set up a new phone? Tell me about a specific time when you had to do that.\nWhat happened during the process?\nPerhaps, you had to download information or contact numbers from the old phone. Perhaps, you had to do download applications or music. Tell me exactly what happened when you had to set up the new phone.\n\n: I remember getting a new phone last year.\nI had to download everything from my old phone to my new phone.\n\nFirst, I downloaded all my contacts to my new phone.\nAnd then, I moved all my picture, videos and music files.\nPlus, I reinstalled all my apps and logged in to my accounts.\nAlso, I reset the main screen and the wallpaper.\nI also set up the password for the lock.\n\nWhen I was done, my new phone had everything my old phone used to have.\n\nSo, this is what I had to do when I got a new phone."}, {"slide": 307, "text": "Q11 : 해외여행 전에 통신사에 전화로 해외 로밍 문의\nI’d like to give you a situation ask you to act it out.\nYou and your friend are going to be traveling internationally and you want to take your phone with you. Call your phone service provider, explain the situation, and ask two or three questions to learn about what you may need to do to do to use your phone overseas.\nWhat the charges maybe, and other relevant information.\n\n: Hi, I'm calling to ask about international roaming for my phone.\nI will be traveling internationally with the friend.\nI want to take my phone with me and use it while I travel.\nI will be visiting countries in Europe such Germany, France and the UK.\nI want to know what I can do. I need a new phone plan. Right?\n\nWhat kinds of international phone planes are available?\nCan you tell me how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\n\nCan you recommend something for me?\nI think I need to get some help.\n\nAlso, can you give me some directions to your office?\nI wonder if I could drive my car there.\nIs there a parking lot?\nIf so, how much is it for parking?\nIf not, I’ll just take public transportation.\nPlease give me a call when you get this. Thank you."}, {"slide": 308, "text": "Q12 : 친구 전화기 국제통화 불가능. 친구한테 해결책 제안\nI am sorry, but there is a problem which I will need you to resolve.\nBefore you leave on a trip overseas with the friend, you learn that your phone service plan is set  up for international calls, but your friend’s phone is not.\nTalk to your friend and offer two or three solutions to resolve this problem.\n\n: Hi, Brian. I have some bad news.\nRemember that we wanted to use our phones during our trip?\nMy phone plan is set up for international calls.\nHowever, I found out that yours is not.\nYou are using a phone plan that does not allow international phone calls.\n\nCan you tell me what you want to do?\nWhy don’t you change your phone plan?\nWhy don’t you check out some international phone plans?\nMaybe we could meet up to talk about it.\nWe could talk about other travel plans as well.\n\nWhen is a good time for you?\nI am free next Monday.\nAre you available that day?\nIf not, I can make some time next Thursday or Friday.\n\nAnyway, Please tell me what you think.\nI am fine with whatever you decide.\nI’ll be waiting for your call. Bye."}, {"slide": 309, "text": "Q13 : 여행이나 출퇴근 중 본인 전화기 사용 중 겪었던 문제점 설명\nThat’s the end of the situation.\nPeople sometimes have difficulties with their phones when they are traveling, commuting, or going from one place to another. Sometimes, their batteries run out. Sometimes, they cannot get a good signal when they make a phone call. Tell me about a time when you had difficulties using your phone while traveling or commuting.\n\n: I remember having several problems with my phone over the years.\nAmong them, one of the most common problem is the phone battery.\nI use my phone all day long, so it runs out of battery quite often.\n\nOnce, my phone died during a trip.\nIt was very inconvenient because my phone was dead.\nI had to check some messages, but I could not.\nI also wanted to do some online searches, but I could not.\nI wanted to call someone, but I could not.\nIt was very frustrating, I regretted not having charged my phone properly.\n\nEventually, I charged my phone when I got to the hotel.\nSince then, I sometimes carry around my charger or battery pack when I travel.\nIt is a bit of hassle, but I have no choice.\nI wish phone batteries would last longer."}, {"slide": 310, "text": "Q11 : 친구가 본인이 쓰는 휴대폰 기종 신규 모델 구입함. 친구에게 질문\nI’d like to give you a situation ask you to act it out.\nYour friend has gotten a new version of the phone that you currently have. You are curious about the new version. Ask your friend two to three questions about the phone and its different features.\n\n: Hi, I'm calling to ask about your new phone.\nYou and I use the same phone, remember?\nYou recently got the new version, so I am curious about the new features.\nI am thinking of getting the new phone myself.\n\nFirst, what kind of colors are available?\nDo they come in different colors?\nWhat color did you get?\n\nNext, can you tell me how much it is?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\n\nAlso, I want to ask about some new features.\nHow is the camera? Is it much better than the old version?\nPlus, How much memory does the phone have on it?\nWhat else? How about the battery? Does it last longer?\n\nAnyway, please give me a call when you get this. Thank you."}, {"slide": 311, "text": "Q12 : 친구가 휴대폰으로 보낸 파일에 문제가 있음. 상황설명. 대안제시\nI am sorry, but there is a problem which I will need you to resolve.\nYour friend tries to send a document to your smartphone.\nYou attempt to open the document, but you can not read it.\nContact your friend, explain the situation, and offer two or three possible solutions to the problem.\n\n: Hi, Brian. I have some bad news.\nThere seems to be a problem with the document you sent me.\nI downloaded the file on my phone and tried to open it, but it does not work.\nI tried over and over again, but it just does not open properly.\nI keep getting the same error message.\n\nI do not know what the problem is.\nMaybe there is something wring with the file.\n\nIf you don’t mind, can you send me the file one more time?\nI will try to open it again.\n\nAlso, maybe you could send it to my email as well as a back up.\nI will forward my email address to you via text.\nI will try to open it on my computer, if my phone does not work again.\n\nAnyway, please tell me when you can send the file again.\nCall me or text me when you send it."}, {"slide": 312, "text": "Q13 : 본인 전화기 사용 중 겪었던 문제점 설명\nThat’s the end of the situation.\nHave you ever had an issue or a problem with your cell phone?\nTell me about one of those experiences and what the situation was.\nHow did you get it resolved?\nTell me all the details about what happened and what made this situation unforgettable.\n\n: I remember having several problems with my phone over the years.\nAmong them, one of the most common problems is the phone battery.\nI use my phone call all day long, so it runs out of battery quite often.\n\nOnce, my phone died when I was outside.\nIt was very inconvenient because my phone was dead.\nI had to check some messages, but I could not.\nI also wanted to do some online searches, but I could not.\nIt was very frustrating.\nI wanted to call someone, but I could not.\nI regretted not having charged my phone properly.\n\nEventually, I charged my phone after I got home.\n\nSince then, I sometimes carry around my charger or battery pack.\nIt is a bit of hassle, but I have no choice.\nI wish phone batteries would last longer."}], "aliases": ["Phone(RP)"]}, {"key": "techindustry", "label_ko": "기술산업 보고서 (RP)", "label_en": "RP_techindustry", "scripts": [{"slide": 325, "text": "Q11 : 기술산업 관련 보고서를 쓰기 위해 많이 아는 친구에게 전화 질문\nYou have been writing a report about the technology industry. Your friend knows a lot about this industry. Call her and ask three or four questions to learn more about this industry for your report.\n\n: Hi Brian.\nI'm calling to ask for some help.\n\nI'm writing a report on the technology industry.\nI know that you know a lot about the industry.\nI wonder if I could ask you some questions.\n\nFirst, can you tell me how the technology industry is doing these days?\nAre tech companies doing better or worse compared to the past?\n\nNext, are there any Innovations in the tech world?\nAre they related to artificial intelligence, blockchain technology, 5G networks, or virtual recognition?\n\nMaybe we could meet up to talk about it.\nPlease give me a call when you get this. Thank you."}, {"slide": 326, "text": "Q12 : 가족 중 한 사람이 긴급 상황발생. 기술산업 관련 보고서 쓰는 것을 도와주겠다는 친구를 만날 수 없게 되어, 친구에게 상황설명. 대안제시\nYour friend offers to meet you, so that you can learn more about the industry which she works in. However, a few days before meeting your friend, a member of your family has an emergency and need to help him. Call you friend, explain the situation and offer two or three alternatives, so that you can get information later on.\n\n: Hi Brian, I have some bad news.\n\nI do not think I can make it to our meeting.\nA member of my family has an emergency.\nMy mom hurt her arm and I have to take her to the doctor.\nIt is quite urgent and I have to help her out.\n\nI do not think I can meet up right now.\nI am very sorry for canceling like this.\n\nSo, I want to reschedule our meeting.\n\nWhen is a good time for you?\nI'm free next Monday. Are you available that day? If not, I can make some time next Thursday or Friday.\n\nAnyway, please tell me what you think. I'm fine with whatever you decide.\nI’ll be waiting for your call. Bye."}, {"slide": 327, "text": "Q13 : 신제품을 처음으로 접해 본 본인 경험 묘사\nTell me about a time you learned about an exciting new product.\nIt might have been the first time you learned about smartphones, video games, cars or other products.\nTell me about the product and how you learned about it. Tell me everything you did from beginning to end in as much detail as possible.\n\n: I remember being quite excited when I got my first smartphone.\nIt was quiet revolutionary.\n\nMy first cell phone was just a regular phone. I was able to just make phone calls and send text messages, but that was it. Plus, my first phone was quite bulky and heavy.\n\nHowever, cell phones have come a long way.\nThey are now called smartphones and they have become the norm.\nI can surf the internet on my phone now. So, I can do almost everything on my phone.\n\nPlus, mobile Internet has become a lot faster over the years.\n5G networks have become commercialized and are amazingly fast.\nAlso, there is free Wi-Fi at many public places such as coffee shops.\nMany households also have wireless routers.\nMany people also use unlimited phone plans.\n\nSo, smartphones have made a world of difference in our lives."}], "aliases": ["Technology Industry Report"]}, {"key": "hotel/weather", "label_ko": "호텔+날씨 (RP)", "label_en": "RP_hotel/weather", "scripts": [{"slide": 332, "text": "Q11 : (챙겨갈 옷을 위해) 호텔에 전화해서 현지 날씨 문의\nI’d like to give you a situation and ask you to act it out.\nYou are planning a vacation abroad.\nCall your hotel and ask three or four questions about the weather in that country and what kinds of clothes you should bring with you.\n\n: Hi, I'm calling to ask about the weather near the hotel.\nI want to know what clothes I should take.\n\nIs the weather hot and humid?\nIf so, do I need to bring some light clothes?\n\nOr, Is it cool and windy?\nOr, Is it cold and snowy?\nIf so, do I need to bring some warm clothes?\n\nPlus, what are the temperature like?\nWhat are the morning lows and daytime highs?\n\nNext, how often does it rain?\nDoes the weather change often?\n\nPlease give me a call when you get this. Thank you."}, {"slide": 333, "text": "Q12 : (가져온 옷이 날씨에 안 맞아서) 현지 옷가게에 옷 구매 관련문의\nI am sorry, but there is a problem which I need you to resolve.\nWhen you arrive on your vacation, you realize that you have brought the wrong clothes for the weather. Call a clothing store and explain what happened in detail. And then, make some arrangements to purchase some new clothes as soon as possible.\n\n: Hi I'm calling to ask about getting some new clothes.\n I think I brought the wrong clothes with me.\nThey are not suitable for the weather here.\nThe weather is cold but my clothes are not warm enough.\nI need to buy some warmer clothes.\n\nCan you tell me how much they are?\nI wonder if there are any discount promotions going on?\nI wanted a good deal.\nCan you recommend something for me?\nI think I need to get some help.\nAlso, can you give me some directions to your store?\nI wonder if I could drive my car there.\nIs there a parking lot?\nIf so, how much is it for parking?\nIf not, I’ll just take public transportation.\nPlease give me a call when you get this.\nThank you."}, {"slide": 334, "text": "Q13 : 예상치 못한 날씨를 경험한 본인 경험 묘사  - 여름 장마, 산불\nThat’s the end of the situation.\nWas there ever a time when the weather was really not what you had expected?\nMaybe it snowed in the spring, maybe it was especially warm in the winter, or maybe the rainy season was dry or the dry season was rainy. Tell me in detail about a time when the weather was not what people had expected.\n\n: We still have four distinct Seasons in Korea.\nHowever, summer has been getting hotter and hotter every year.\nIt is a lot hotter compared to when I was a kid.\nI remember having a hard time 2 years ago in summer because it was unbearably hot.\nIt was much hotter than we had expected.\nThe daytime highs reached 40 degrees Celsius in some areas.\nIt was also very hot at night because it did not cool off.\nIn fact it was the hottest summer in Korean history.\n\nLast year, many countries in Europe and Australia had a record-breaking summer weather as well. This year, summer was sweltering hot in Korea once again.\nEveryone seemed to be carrying around portable fans to beat the heat.\nOnce again, I think summer seems to be getting hotter and hotter every year."}], "aliases": ["Hotel+Weather"]}, {"key": "rentalcar", "label_ko": "렌터카 (RP)", "label_en": "RP_rentalcar", "scripts": [{"slide": 339, "text": "Q11 :  렌터카 업체에 전화해서 차 렌트 문의\nI＇d like to give you a situation and ask you to act it out.  You need to rent a car for about a week.\nCall the rental agency and ask three or four questions to get all the information you need.\n\n: Hi, I am calling to ask about renting a car.\nI want to rent a medium-sized car that has good mileage.\nI need a navigation because I am not good with directions.\nI need the car for a week.\n\nWhat kinds of cars are available?\nCan you tell me how much they are?\nI wonder if there are any discounts and promotions going on.\nI want to get a good deal.\n\nDo you have any special rates? – rental, hotel\n\nCould you recommend something for me?\nI think I need some help.\nAlso, can you give me some directions to your rental agency?\n\nPlease call me when you get this, thank you."}, {"slide": 340, "text": "Q11 :  뉴욕 휴가 가서 렌터카 업체에서 현장문의\nI like to give you a situation ask you to act it out. You are visiting New York on vacation. You go to a car rental agency to rent a car. Imagine you are speaking to a rental car agent.\nAsk three or four questions about renting a car for a week.\n\n: Hi, I want to rent a car.\nI want a medium sized car that has good mileage.\nI also need a navigation because I am not good with the directions.\nI will be needing the car for a week.\nWhat kinds of cars are available?\nCan you tell me/ how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\nDo you have any special rates?\nCan you recommend something for me?\nI think I need to get some help."}, {"slide": 341, "text": "Q12 : 렌터카에 문제가 있어서 렌터카 회사에 전화로 해결\nI'm sorry but there is a problem which I need you to resolve. You have a received the rental car, but there are many problems with it. Call the rental agency and explain the situation. Give two to three or alternatives.\n\n: Hi, I’m a person who rented a car from your agency.\nHowever, there is a problem with the car.\nThe car is smaller than I expected.\nI need a bigger car.\nThe car is not clean at all.\nI do not think it was cleaned properly.\n\nI want to get an exchange.\nI wonder if I could get a refund if I want to.\n\nWould that be possible?\nWhen is a good time to visit your agency?\nWhat are your business hours?\nHow late are you open?\n\nPlease give me call when you get this, thank you."}, {"slide": 342, "text": "Q12 : 본인이 원하는 렌터카 차종이 없어서 전화해서 문제 해결\nI＇m sorry but there is a problem which I need you to resolve.  You want to rent a specific kind of car, but you find out that none are available. Call the manager and describe the situation. Explain why you want that particular kind of car offer several alternatives to solve the problem.\n\n: Hi, I＇m a person who wants to rent a car from your agency.\nI want to get an SUV with a diesel engine.\nHowever, it is not available.\nI really want to get that car.\nIt is easy to drive and it has good mileage.\nIf you do not have that car, can you recommend something for me?\nI think I need to get some help.\nWould that be possible?\nI'm sorry for all the trouble.\nWhen is a good time to visit your agency?\nWhat are your business hours?\nHow late are you open?\nPlease give me a call when you get this. Thank you."}, {"slide": 343, "text": "Q12 : 본인의 면허증에 대해 설명하고 왜 미국 면허증과 동일한 효력을 가지는지에 대해 설명\nI＇m sorry but there is a problem which I need you to resolve.\nI'm not sure if I can let you rent a car because I'm not familiar with your non US driver's license. Can you explain to me what your license says and why it is the same as a valid US license?\n\n: Okay, let me tell you about my license.\n\nAs you see here, the title says “driver's license” in English.\n\nI got this license in 2020.\nSo it says 2020 here.\nPlus, the date here shows that it expires in 2030.\nThis license is still valid.\n\nSo my driver's license is the same as a US driver's license.\nI hope you can accept it."}, {"slide": 344, "text": "Q13 : 본인의 렌터카 이용 경험 묘사\nThat’s the end of the situation.\nHave you ever rented a car?\nWhen and where was it? why did you need to rent a car? where did you go?\nTell me everything about that experience.\n\n:  I remember renting a car when I went on a trip a few years ago. I did some searches and found some good rates. I was able to get a good deal. I was happy with the car I rented. It was worth the money I spent.\n\n렌트한 경험이 없는 경우, \nFrankly, I have never rented a car in my life. So, I really do not have much to say about this topic."}, {"slide": 345, "text": "Q13 : 본인 휴가 중에 있었던 기억에 남는 경험 설명\nThat’s the end of the situation. Can you now tell me a story about an experience that you had while you were on one of your vacations? was it memorable because something unexpected happened or because it was so enjoyable? Start this story by telling me when this happened. Where you were, and who you were traveling with. And then, tell me all the details of your experience.\n\n: I remember when I had a bad stomachache during a vacation.\nI think I ate too fast because I was so hungry.\n\nI got indigestion and it was pretty bad.\nMy stomach was upset and I feel like throwing up.\nI also had a fever and felt lightheaded.\nI tried to find some medicine but I could not find any.\nSo, I went to the drug store to get some medicine.\nI told our pharmacist about my symptoms.\nHe gave me something that would make me feel better.\n\nI came back to the hotel and took some medicine to get better.\nI had to stay inside and get plenty of rest.\n\nSince then, I tried to be more careful when I eat something."}], "aliases": ["Rental Car"]}, {"key": "carproblem", "label_ko": "자동차 고장 (RP)", "label_en": "RP_carproblem", "scripts": [{"slide": 346, "text": "Q11 : 차 고장으로 서비스 센터에 가서 차량 수리 문의\nI'd like to give you a situation and ask you to act it out.\nYou are driving your car through a small town and have car trouble.\nGo to the nearest service station and ask for help. Ask three or four questions in order to get the information you need to get your car fixed.\n\n: Hi, I want to ask for some help.\nI am having some car trouble.\nMy car broke down suddenly in the middle of the road.\nI want to get it checked ASAP.\n\nCan you tell me how long it will take?\nHow much will it cost?\nAlso, is there a place I can wait (at)? = Is there a waiting area?\nIs there a coffee shop around here?\nIf so, can you give me some directions?"}, {"slide": 347, "text": "Q12 : 차 고장으로 고객 미팅 못 가서 고객에게 전화로 상황 설명하고 대안 제시\nI'm sorry, but there is a problem which I need you to resolve.\nBecause of the car trouble, you will miss important business meeting.\nCall your client and explain the situation and offer some alternative solutions.\n\n: Hi, Mr. Johnson. This is Brian.\nI have some bad news.\nI do not think I can make it to our meeting today.\nMy car suddenly broke down on my way to the meeting.\nI'm at the service center getting it fixed.\nThis may take a while.\nThere is no way/ I can make it to your meeting on time.\nI'm really sorry.\nI want to reschedule our meeting.\nWhen is a good time for you?\nI'm free next Monday. Are you available that day?\nIf not, I can make some time next Thursday or Friday.\nAnyway, please tell me what you think.\nI am fine with whatever you decide.\nI'll be waiting for your call.\nBye."}, {"slide": 348, "text": "Q13 : 본인 차량에 문제가 생겼던 경험 및 대처 방법 설명\nThat's the end of the situation. Tell me about the last time you had trouble with your car. What was the problem and how did you deal with it? Give me lots of details.\n\n: I remember when I (got into/had) a car accident.\nHowever, I got a dent on my bumper, but I did not get hurt.\nI had to take my car in for repairs.\nI covered the cost with my insurance.\nPlus, I remember when I had a flat tire.\nThere was a warning sign on my dashboard.\nI went to a tire shop to get a new tire.\nIt cost me some money to pay for the new tire.\nSo, these were the problems I have had with my car.\n\nWrecker : 견인차"}], "aliases": ["Car Problem"]}, {"key": "train", "label_ko": "기차 (RP)", "label_en": "RP_train", "scripts": [{"slide": 349, "text": "Q11 : 기차역 창구에 가서 기차표 구매 문의\nI’d like to give you a situation and ask you to act it out.\nYou need to buy a train ticket to go visit your friend this weekend. Go to the ticket counter at the train station and ask three or four questions to get information for a reservation.\n\n:  Hi, I want to get a ticket.\nI want to get on the 5 o’clock train to Busan.\nI want to get a seat in the first-class section.\nI also want to get a window seat if possible.\nI tried to use my application to get the ticket, but I was not able to.\nSomething was not working properly.\nThat is why I came to the ticket counter.\n\nAnyway, what kinds of tickets are available?\nCan you tell me how much they are?\nI wonder if there are any discounts or promotions going on.\nI want to get a good deal.\n\nCan you recommend something for me?\nI think I need to get some help."}, {"slide": 350, "text": "Q12 :  I'm sorry but there is a problem which I will need you to resolve. When you get to the train station, you miss your train and it will be late to meet your friend. Call your friend explain your situation and offer some alternatives.\n\nHi Brian.\nI have some bad news.\nI do not think I can make it to your place on time today.\nI just missed the train I had to take.\nMy train was 6 o ’clock, but I arrived at the station 5 minutes late.\nThe train had already left.\nI will have to get on the next train, which will leave at 7.\nCan you tell me what you want to do?\nWhy don't you have dinner by yourself?\nPerhaps, we could grab some drinks later on.\nOr maybe we could just have coffee.\nAnyway, please tell me what you think.\nI'm fine with whatever you decide.\nI'll be waiting for your call. bye"}, {"slide": 351, "text": "Q13 : 본인이 여행 중 교통편을 놓쳐서 생긴 문제 설명\nThat's the end of the situation. Have you ever travel somewhere and missed a bus, train or a plane? Tell me about an experience you have had when you had difficulty getting to your destination as planned. Start by telling me where you were going and why. Then, tell me everything that happened and what you had to do to finally get to your destination.\n\n:  Frankly, I've never had the kind of experience.\nI think I was very lucky.\n\nSo, I really do not have much to say about this topic."}], "aliases": ["Train"]}, {"key": "bank", "label_ko": "은행 (RP)", "label_en": "RP_bank", "scripts": [{"slide": 362, "text": "Q11 : 은행에 전화해서 계좌개설 관련문의\nI‘d like to give you a situation and ask you to act it out.\nYou want to open a bank account. Call the bank and ask three to four questions about the services they offer to open an account.\n\n: Hi, I am calling to ask about opening a new bank account.\nI want to open a savings account.\n\nWhat kinds of accounts are available?\nWhat is the interest rate for savings accounts?\n\nCan you recommend something for me?\nI think I need to get some help.\n\nI want to make a bank card as well.\nWould that be possible?\n\nAlso, I want to visit the bank.\nCan you give me some directions to the bank?\nI wonder if I could drive my car there.\nIs there a parking lot?\nIf so, how much is it for parking?\nIf not, I’ll just take public transportation.\nPlease give me a call when you get this.\nThank you."}, {"slide": 363, "text": "Q12 : 카드 받았는데 문제가 있음. 전화해서 해결\nI am sorry, but there is a problem which I will need you to resolve.\nYou just got your bank card, but there is problem and you can’t use it.\nCall the bank, explain the situation, and offer some suggestions to get some a new card.\n\n: Hi, I am a person who got a new card from your bank.\n\nHowever, there is a problem with the card.\nI tried to use it at a store, but it was declined.\nI followed the instructions, but I do not know what the problem is.\nI think there is something wrong.\n\nI want to get a new card.\n\nWould that be possible?\n\nI want to visit the bank.\nWhen is a good time to visit there?\nWhat are your business hours?\nHow late are you open?\n\nPlease give me a call when you get this.\nThank you."}, {"slide": 364, "text": "Q13 : 본인이 카드로 ATM 사용 중 문제가 생겼던 경험\nThat＇s the end of the situation.\nHave you ever had any problems with your bank card when you were using an ATM?\nPerhaps, your card stuck in the machine. Or, you found someone else’s money or card.\nDescribe the problem you had in detail.\n\n: I remember having several problems with my bank card.\n\nOnce I was trying to get some cash from an ATM.\nHowever, the card was rejected.\nI did not have enough money in the account.\nMy balance was too low.\n\nI also remember when I lost my bank card.\nI think I left it behind somewhere.\nI had to cancel my card and get a new one.\n\nAlso I remember when the IC chip on my card was damaged.\nI was not able to use it, so I had to get a new card issued.\n\nWhat else? Another time, I maxed out my credit card.\nI had to wait until I paid my credit card bill to use it again.\n\nSo, these were the problems I have had with my bank cards."}, {"slide": 365, "text": "Q11 : 은행 지점 현장에 가서 직원에게 은행 계좌 개설 문의\nI‘d like to give you a situation and ask you to act it out.\nYou need to open a new bank account. Go to the bank and ask the bank representative three or four questions to learn everything about what you need to do to open an account.\n\n: Hi, I want to open a new bank account.\nI want to open a savings account.\n\nWhat kinds of accounts are available?\nWhat is the interest rate for savings accounts?\n\nCan you recommend something for me?\nI think I need to get some help.\n\nI want to make a credit card as well.\nWould that be possible?"}, {"slide": 366, "text": "Q12 : 은행 카드를 음식점에 두고 와서 전화로 도움 요청\nI am sorry, but there is a problem which I will need you to resolve.\nYou have left your new bank card at the restaurant where you had dinner.\nCall the restaurant and explain what happened.\nDescribe the card and tell them how to get the card back to you.\n\n: Hi, I am a person who went to your restaurant.\n\nHowever, I think I left my card behind at the restaurant.\nIt is a black visa card.\nIt has my signature card on the back.\nI think I left it on the counter.\n\nCould you please check if you have my card?\nI really need to find it ASAP.\nIf it is there, can you hold on to it?\nI will stop by to pick it up right away.\n\nWould that be possible?\nI am sorry for all the trouble.\n\nWhen is a good time to visit your restaurant?\nWhat are your business hours?\nHow late are you open?\n\nPlease give me a call when you get this.\nThank you."}, {"slide": 367, "text": "Q13 : 본인이 카드로 ATM 사용 중 문제가 생겼던 경험\nThat＇s the end of the situation.\nCan you remember an experience you had with a bank account, a credit card, or an ATM card that required some assistance? Perhaps, you lost your card or a card would not work.\nTell me about that experience you had in as much detail as you can.\n\n: I remember having several problems with my bank card.\n\nOnce I was trying to get some cash from an ATM.\nHowever, the card was rejected.\nI did not have enough money in the account.\nMy balance was too low.\n\nI also remember when I lost my bank card.\nI think I left it behind somewhere.\nI had to cancel my card and get a new one.\n\nAlso I remember when the IC chip on my card was damaged.\nI was not able to use it, so I had to get a new card issued.\n\nWhat else? Another time, I maxed out my credit card.\nI had to wait until I paid my credit card bill to use it again.\n\nSo, these were the problems I have had with my bank cards."}], "aliases": ["Bank"]}, {"key": "doctor's app", "label_ko": "병원 예약 (RP)", "label_en": "RP_doctor's app", "scripts": [{"slide": 372, "text": "Q11 : 병원 진료 예약 전화문의\nI‘d like to give you a situation and ask you to act it out.\nYou need to make an appointment with your doctor. Call the office and describe what you need. Then, ask three or four questions to find out when the doctor is available.\n\n: Hi, I am calling to make a doctor appointment.\nI want to come in to see the doctor.\n\nI think I have food poisoning because I ate something that went bad.\nMy stomach is upset and feel like throwing up.\nI also have a fever and I feel light-headed.\n\nCan you tell me when the doctor is available?\nWhen is the earliest appointment I can make?\n\nAlso, can you give me some directions to the clinic?\nI wonder if I could drive my car there.\nIs there a parking lot?\nIf so, how much is it for parking?\nIf not, I’ll just take public transportation.\n\nPlease give me a call when you get this.\nThank you."}, {"slide": 373, "text": "Q12 : 사정이 생겨서 병원 진료 예약 전화로 변경\nI am sorry, but there is a problem which I will need you to resolve.\nOn the day of your appointment, you realize that you will not be able to make it. Call the doctor’s office and explain your situation detail. Then, offer some suggestions as to when you can reschedule the appointment.\n\n: Hi, I am a person who made an appointment at 3 o’clock.\n\nHowever, I do not think I can make it to the appointment.\nSomething has come up suddenly.\nI have an emergency that I have to take care of.\nSo, I will not be able to come in/ for the appointment.\nI am very sorry for cancelling like this.\n\nI want to reschedule my appointment.\n\nI am free tomorrow morning.\nIs the doctor available at that time?\nIf not, I can make some time in the afternoon.\n\nPlease give me a call when you get this. Thank you."}, {"slide": 374, "text": "Q13 : 중요한 예약/ 미팅 불참 혹은 늦은 본인 경험 묘사  (COVID-19)\nThat＇s the end of the situation.\nHave you ever had an important appointment that you had to miss for some reason or perhaps you were late? Tell me in detail about an experience you had when you had trouble getting into an important appointment.\n\n: I remember when I was supposed to attend a meeting in the US.\n\nHowever, I decided not to go because of the Coronavirus.\nI thought it was not safe to attend the meeting.\nThe situation was especially bad in the US and Europe.\nThere were more than 30 million confirmed cases worldwide and is still rising. Meanwhile, the virus also spread widely in Korea.\n\nEventually, I had to make new online meetings."}, {"slide": 375, "text": "Q13 : 중요한 예약/ 미팅 불참 혹은 늦은 본인 경험 묘사  (appointment)\nThat＇s the end of the situation.\nHave you ever had an important appointment that you had to miss for some reason or perhaps you were late? Tell me in detail about an experience you had when you had trouble getting into an important appointment.\n\n: I remember making a hair appointment a few months ago.\n\nHowever, something urgent came up suddenly.\nI had to take care of something important.\n\nSo, I could not make it to my appointment.\nI called the hair salon told them that I could not go.\n\nEventually, I had to make a new appointment."}], "aliases": ["Doctor Appointment"]}, {"key": "company interview", "label_ko": "회사 면접 (RP)", "label_en": "RP_company interview", "scripts": [{"slide": 376, "text": "Q11 :면접 보러 가야 하는 회사에 대해 전화로 질문\nI‘d like to give you a situation and ask you to act it out.\nImagine that you have an interview for a job at a very important company. To prepare for the interview, you want to learn more about the company. Call the company and ask three or four questions to learn more about it.\n\n: Hi, my name is Brian Lee.\nI have an interview with your company soon.\nI want to learn more about your company before the interview.\nI want to ask some questions.\n\nFirst, can you tell me what your company specializes in?\nNext, what are some employee benefits?\nHow much do managers get paid on average?\nHow much vacation time do employees get every year?\n\nAlso, can you give me some directions to your company?\nI wonder if I could drive my car there.\nIs there a parking lot?\nIf so, how much is it for parking?\nIf not, I’ll just take public transportation.\n\nPlease give me a call when you get this.\nThank you."}, {"slide": 377, "text": "Q12 : 사정이 생겨서 병원 진료 예약 전화로 변경\nI am sorry, but there is a problem which I will need you to resolve.\nDue to an emergency, you will not be able to attend your job interview.\nCall the company and leave a message explaining the situation.\nThen, offer two or three alternative plans so that you do not lose this opportunity.\n\n: Hi, this is Brian Lee. I have some bad news.\n\nI do not think I can make it to the interview.\nSomething has come up suddenly.\nI have an emergency that I have to take care of.\nSo, I will not be able to attend the job interview.\nI am very sorry for cancelling like this.\n\nI want to reschedule the interview.\n\nWhen is a good time for you?\nI am free next Monday.\nAre you available that day?\nIf not, I can make some time next Thursday or Friday.\n\nAnyway, please tell me what you think.\nI am fine with whatever you decide.\nI will be waiting for your call. Bye."}, {"slide": 378, "text": "Q13 : 수업, 미팅, 면접 못 가게 된 본인 경험 묘사\nThat＇s the end of the situation.\nHave you ever had to miss a class, a meeting or an interview at school or for work? Tell me the story of that experience. What happened? When did it happen and how did you resolve it?\nGive me lots of details.\n\n: I remember when I was supposed to attend a group study.\n\nHowever, I decided not to go because of the Coronavirus.\nI thought it was not safe to go to a study session.\nThe situation was especially bad in the US and Europe.\nThere were more than 30 million confirmed cases worldwide and is still rising. Meanwhile, the virus also spread widely in Korea.\n\nEventually, I had to make a new schedule."}], "aliases": ["Company interview"]}, {"key": "freetime/gathering", "label_ko": "자유시간/모임 (RP)", "label_en": "RP_freetime/gathering", "scripts": [{"slide": 385, "text": "Q11 : 친구 만난기로 한 약속 언제 어디서 만날지 전화로 질문\nI’d like to give you a situation and ask you to act it out.\nYou want to get together your friend.\nCall your friend and ask two or three questions about where and when to meet.\n\n: Hi, James. \nI am calling to ask about your plans this weekend.\nI wonder if you want to hang out with me.\n\nIf so, when is a good time for you?\nI am free on Saturday.\nAre you available that day?\nIf not, I can make some time on Sunday.\n\nNext, can you tell me what you want to do?\nWhy don’t we go on a picnic?\nMaybe we could get some food to go?\nor, we could go grab some drinks together.\n\nI ‘ll be waiting for your call. Bye."}, {"slide": 386, "text": "Q12 :  친구를 만나기로 한 시간/장소에서 못 만나게 됨. 전화로 대안제시\nI am sorry, but there is a problem which I will need you to resolve.\nYou are unable to meet your friend at the time and place that was agreed upon. Call your friend and give three or four alternatives to address the problem.\n\n: Hi, Brian. I have some bad news.\n\nI do not think I can make it to our gathering.\nSomething has come up suddenly.\nI have a family emergency.\nMy dad is very sick because he has food poisoning.\nHe is throwing up and he has a high fever.\nI have to take him to the doctor and look after him.\nI am very sorry for canceling like this.\n\nCan you tell me what you want to do?\nWhy don’t we hang out next time?\nDo you want to get together next week?\nOr, maybe we could meet up another time.\n\nAnyway, please tell me what you think.\nI am fine with whatever you decide.\nI ‘ll be waiting for your call. Bye."}, {"slide": 387, "text": "Q13 : 자유시간에 계획했던 것이 뜻대로 되지 않은 경험\nThat’s the end of the situation.\nWas there a time when you had some free time and had some plans?\nBut maybe the weather got bad. Or maybe you had work or chores that had to be taken care of. How did you deal with the situation that did not turn out as you had expected?\n\n: I remember when I was supposed to meet up with a friend.\nHowever, I decided to cancel due to the coronavirus.\nI thought it was not safe to go outside.\n\nThere were many new cases that were occurring and we had to practice social distancing.\nThe situation was especially bad in the US and Europe.\nThere were large clusters of community infection const PAD = n => String(n).padStart(2,'0');
const LS = {
  get(k, def) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? def; } catch(e){ return def; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};

// 기기/브라우저에 저장된 기록이 없을 때 보여줄 기본값 (2026-09-19 기준 내보내기 반영)
const DEFAULT_PROGRESS = {
  opic_map_general: {
    "1": "furniture", "2": "recycling", "3": "housing", "4": "music", "5": "movie",
    "6": "TV", "7": "restaurant", "8": "Gathering", "9": "vacation at home", "10": "food",
    "11": "Health", "12": "shopping", "13": "Domestic trips", "14": "Overseas trip", "15": "geography",
    "16": "internet", "17": "phone/technology", "18": "phone/technology", "19": "industry", "20": "weather",
    "21": "transportation", "22": "fashion", "23": "bank", "24": "Hotel", "25": "appointment",
    "26": "free time", "27": "family/friend", "28": "holidays"
  },
  opic_map_rp: {
    "1": "store", "2": "traveling", "3": "hotel", "4": "furniture", "5": "realestate",
    "6": "relatives", "7": "recycling", "8": "mp3", "9": "flight", "10": "rentalcar",
    "11": "carproblem", "12": "performance", "13": "movie", "14": "TV", "15": "bank",
    "16": "doctor's app", "17": "company interview", "18": "party/celebration", "19": "freetime/gathering", "20": "techindustry",
    "21": "gym", "22": "Nutritionist", "23": "health/food", "24": "restaurant", "25": "internet",
    "26": "phone"
  },
  opic_script_pick: {}
};

let mapGeneral = LS.get('opic_map_general', DEFAULT_PROGRESS.opic_map_general);
let mapRP = LS.get('opic_map_rp', DEFAULT_PROGRESS.opic_map_rp);
let scriptPick = LS.get('opic_script_pick', DEFAULT_PROGRESS.opic_script_pick);

// 이전 버전에서 저장해둔 선택값을 새 데이터 구조(key)로 자동 이전
function migrateMap(type) {
  const m = mapObj(type);
  const topics = topicList(type);
  let changed = false;
  Object.keys(m).forEach(num => {
    const val = m[num];
    if (topics.some(t => t.key === val)) return; // 이미 최신 key
    const found = topics.find(t => (t.aliases || []).includes(val));
    if (found) { m[num] = found.key; changed = true; }
    else { delete m[num]; changed = true; } // 대응 안 되는 옛 값은 정리
  });
  if (changed) saveMap(type);
}
migrateMap('general');
migrateMap('rp');

let state = { tab: 'map', practiceType: null, practiceNum: null, practiceSub: null };

// 현재 재생 중인 오디오를 하나만 유지 (다른 걸 재생/선택하면 자동으로 멈춤)
let activeAudio = null;
let activeAudioBtn = null;
function stopActiveAudio() {
  if (activeAudio) { activeAudio.pause(); activeAudio.currentTime = 0; }
  if (activeAudioBtn) activeAudioBtn.textContent = '▶';
  activeAudio = null; activeAudioBtn = null;
}

function audioPath(type, num, sub) {
  const dir = type === 'general' ? 'general' : 'rp';
  return dir + '/' + PAD(num) + '-' + PAD(sub) + '.mp3';
}

function topicList(type) {
  return type === 'general' ? DATA.general_topics : DATA.rp_topics;
}
function audioNums(type) {
  return type === 'general' ? DATA.audio_general_numbers : DATA.audio_rp_numbers;
}
function mapObj(type) {
  return type === 'general' ? mapGeneral : mapRP;
}
function saveMap(type) {
  LS.set(type === 'general' ? 'opic_map_general' : 'opic_map_rp', mapObj(type));
}

// ---------- 매핑 설정 화면 ----------
function renderMapTab() {
  const el = document.getElementById('app');
  el.innerHTML = '';

  ['general','rp'].forEach(type => {
    const nums = audioNums(type);
    const topics = topicList(type);
    const m = mapObj(type);
    const doneCount = nums.filter(n => m[n.num]).length;

    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = (type==='general' ? '일반 문항' : 'Role Play') + ` — ${doneCount}/${nums.length} 완료`;
    el.appendChild(title);

    const bar = document.createElement('div');
    bar.className = 'progress-bar';
    bar.innerHTML = `<div class="progress-fill" style="width:${(doneCount/nums.length*100).toFixed(0)}%"></div>`;
    el.appendChild(bar);

    nums.forEach(({num, count}) => {
      const row = document.createElement('div');
      row.className = 'row';

      const badge = document.createElement('div');
      badge.className = 'num-badge';
      badge.textContent = PAD(num);
      row.appendChild(badge);

      const btn = document.createElement('button');
      btn.className = 'play-btn';
      btn.textContent = '▶';
      btn.onclick = () => {
        // 같은 버튼을 다시 누르면 중지
        if (activeAudio && activeAudioBtn === btn) { stopActiveAudio(); return; }
        stopActiveAudio();
        const a = new Audio(audioPath(type, num, 1));
        a.onended = () => { if (activeAudioBtn === btn) stopActiveAudio(); };
        a.play().then(() => {
          activeAudio = a; activeAudioBtn = btn;
          btn.textContent = '■';
        }).catch(() => alert('오디오 파일을 찾을 수 없어요.\n' + audioPath(type,num,1) + ' 경로를 확인해주세요.'));
      };
      row.appendChild(btn);

      const sel = document.createElement('select');
      const optEmpty = document.createElement('option');
      optEmpty.value = '';
      optEmpty.textContent = `선택 안 함 (${count}개 문항)`;
      sel.appendChild(optEmpty);
      topics.forEach(t => {
        const o = document.createElement('option');
        o.value = t.key;
        o.textContent = `${t.label_ko} ${t.label_en} (스크립트 ${t.scripts.length}개)`;
        if (m[num] === t.key) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = () => {
        stopActiveAudio();
        if (sel.value) m[num] = sel.value; else delete m[num];
        saveMap(type);
        renderMapTab();
      };
      row.appendChild(sel);

      const badge2 = document.createElement('div');
      badge2.className = 'badge ' + (m[num] ? 'done' : 'empty');
      badge2.textContent = m[num] ? '완료' : '미확인';
      row.appendChild(badge2);

      el.appendChild(row);
    });
  });
}

// ---------- 연습 화면 ----------
function renderPracticeTab() {
  const el = document.getElementById('app');
  el.innerHTML = '';

  if (!state.practiceType) {
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = '어떤 문항을 연습할까요?';
    el.appendChild(title);
    ['general','rp'].forEach(type => {
      const card = document.createElement('button');
      card.className = 'topic-card';
      card.innerHTML = `<div>${type==='general' ? '일반 문항' : 'Role Play'}</div>`;
      card.onclick = () => { stopActiveAudio(); state.practiceType = type; state.practiceNum = null; renderPracticeTab(); };
      el.appendChild(card);
    });
    return;
  }

  const crumb = document.createElement('div');
  crumb.className = 'crumb';
  crumb.innerHTML = `<button id="crumb-root">연습</button>`;
  el.appendChild(crumb);
  crumb.querySelector('#crumb-root').onclick = () => { stopActiveAudio(); state.practiceType = null; renderPracticeTab(); };

  const type = state.practiceType;
  const m = mapObj(type);
  const nums = audioNums(type);

  if (state.practiceNum === null) {
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = (type==='general'?'일반 문항':'Role Play') + ' 주제 선택';
    el.appendChild(title);

    const unmapped = nums.filter(n => !m[n.num]).length;
    if (unmapped > 0) {
      const note = document.createElement('div');
      note.className = 'hint';
      note.style.marginBottom = '14px';
      note.textContent = `아직 주제가 확인되지 않은 번호 ${unmapped}개는 목록에서 빠져 있어요. '매핑 설정' 탭에서 채워주세요.`;
      el.appendChild(note);
    }

    nums.filter(n => m[n.num]).forEach(({num, count}) => {
      const topic = topicList(type).find(t => t.key === m[num]);
      const card = document.createElement('button');
      card.className = 'topic-card';
      card.innerHTML = `<div>${PAD(num)}. ${topic.label_ko} ${topic.label_en}</div>
        <div class="tc-count">${count}개 문항 · 스크립트 후보 ${topic.scripts.length}개</div>`;
      card.onclick = () => { stopActiveAudio(); state.practiceNum = num; state.practiceSub = 1; renderPracticeTab(); };
      el.appendChild(card);
    });
    return;
  }

  const numInfo = nums.find(n => n.num === state.practiceNum);
  const topic = topicList(type).find(t => t.key === m[state.practiceNum]);

  crumb.innerHTML += ` › <button id="crumb-topic">${topic.label_ko}</button>`;
  crumb.querySelector('#crumb-topic').onclick = () => { stopActiveAudio(); state.practiceNum = null; renderPracticeTab(); };

  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = `${topic.label_ko} ${topic.label_en} — 문항 선택`;
  el.appendChild(title);

  const grid = document.createElement('div');
  grid.className = 'q-grid';
  for (let s = 1; s <= numInfo.count; s++) {
    const chip = document.createElement('button');
    chip.className = 'q-chip' + (state.practiceSub === s ? ' active' : '');
    chip.textContent = s + '번';
    chip.onclick = () => { stopActiveAudio(); state.practiceSub = s; renderPracticeTab(); };
    grid.appendChild(chip);
  }
  el.appendChild(grid);

  const sub = state.practiceSub;
  const playerBox = document.createElement('div');
  playerBox.className = 'player-box';
  const audioEl = document.createElement('audio');
  audioEl.controls = true;
  audioEl.src = audioPath(type, state.practiceNum, sub);
  playerBox.appendChild(audioEl);
  el.appendChild(playerBox);
  // 이 플레이어도 전역 중지 대상으로 등록 (다른 걸 누르면 같이 멈추도록)
  audioEl.addEventListener('play', () => {
    if (activeAudio && activeAudio !== audioEl) { activeAudio.pause(); if (activeAudioBtn) activeAudioBtn.textContent = '▶'; }
    activeAudio = audioEl; activeAudioBtn = null;
  });

  const pickKey = `${type}_${state.practiceNum}_${sub}`;

  const scriptTitle = document.createElement('div');
  scriptTitle.className = 'section-title';
  scriptTitle.textContent = '스크립트';
  el.appendChild(scriptTitle);

  if (topic.scripts.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-note';
    empty.textContent = '이 주제는 PPT에서 대응하는 스크립트를 찾지 못했어요. 음성만 듣고 연습해주세요.';
    el.appendChild(empty);
    return;
  }

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.style.marginBottom = '10px';
  hint.textContent = '이 문항에 맞는 스크립트를 골라주세요. 한 번 고르면 다음에도 기억해둬요.';
  el.appendChild(hint);

  topic.scripts.forEach((scr, idx) => {
    const card = document.createElement('div');
    card.className = 'script-card' + (scriptPick[pickKey] === scr.slide ? ' picked' : '');
    card.innerHTML = `<div class="sc-label">후보 ${idx+1} · 슬라이드 ${scr.slide}${scriptPick[pickKey] === scr.slide ? ' · 선택됨' : ''}</div>
      <pre></pre>`;
    card.querySelector('pre').textContent = scr.text;
    card.onclick = () => {
      audioEl.pause();
      scriptPick[pickKey] = scr.slide;
      LS.set('opic_script_pick', scriptPick);
      renderPracticeTab();
    };
    el.appendChild(card);
  });
}

function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.tab));
  if (state.tab === 'map') renderMapTab();
  else renderPracticeTab();
}

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => { stopActiveAudio(); state.tab = t.dataset.tab; render(); };
});

// ---------- 진행상황 내보내기 / 가져오기 (다른 브라우저·주소로 옮길 때 사용) ----------
function exportBackup() {
  const data = {
    opic_map_general: LS.get('opic_map_general', {}),
    opic_map_rp: LS.get('opic_map_rp', {}),
    opic_script_pick: LS.get('opic_script_pick', {})
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'opic-progress-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.opic_map_general) LS.set('opic_map_general', data.opic_map_general);
      if (data.opic_map_rp) LS.set('opic_map_rp', data.opic_map_rp);
      if (data.opic_script_pick) LS.set('opic_script_pick', data.opic_script_pick);
      mapGeneral = LS.get('opic_map_general', {});
      mapRP = LS.get('opic_map_rp', {});
      scriptPick = LS.get('opic_script_pick', {});
      alert('가져오기 완료!');
      render();
    } catch (e) {
      alert('파일을 읽을 수 없어요. JSON 형식을 확인해주세요.');
    }
  };
  reader.readAsText(file);
}

document.getElementById('exportBtn').onclick = exportBackup;
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e) => {
  const file = e.target.files[0];
  if (file) importBackup(file);
  e.target.value = '';
};

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

render();
</script>
